  - name: "step05_partial_correlation"
    step_number: 5
    description: "Compute partial correlation controlling for initial encoding levels"
    
    verification_status:
      module_verified: true
      function_signature_verified: true
      decision_d068_embedded: true
      paths_hierarchical: true
    
    analysis_call:
      type: "custom_stdlib"
      description: "Partial correlation using scipy.stats with dual p-values"
      
      steps:
        - step: "import_modules"
          code: |
            import pandas as pd
            import numpy as np
            from scipy.stats import pearsonr
            from scipy.stats.contingency import chi2_contingency
            from tools.bootstrap import bootstrap_correlation_ci
            
        - step: "load_data_and_compute"
          code: |
            # Load merged dataset
            df = pd.read_csv('results/ch7/7.6.2/data/step03_analysis_input.csv')
            
            # Compute partial correlation controlling for encoding levels
            # Control variables: ravlt-trial-5-score (encoding), REMEMVR_Intercept (initial ability)
            from scipy.stats import linregress
            
            # Residualize RAVLT_Forgetting on controls
            X_controls = df[['ravlt-trial-5-score', 'REMEMVR_Intercept']].values
            y_ravlt = df['RAVLT_Forgetting'].values
            y_slope = df['REMEMVR_Slope'].values
            
            # Simple residualization (could use statsmodels for more sophisticated approach)
            from sklearn.linear_model import LinearRegression
            
            # Residualize RAVLT_Forgetting
            reg_ravlt = LinearRegression().fit(X_controls, y_ravlt)
            ravlt_residuals = y_ravlt - reg_ravlt.predict(X_controls)
            
            # Residualize REMEMVR_Slope  
            reg_slope = LinearRegression().fit(X_controls, y_slope)
            slope_residuals = y_slope - reg_slope.predict(X_controls)
            
            # Correlation of residuals = partial correlation
            partial_r, p_uncorrected = pearsonr(ravlt_residuals, slope_residuals)
            
            # Apply Decision D068: Dual p-values
            p_bonferroni = min(1.0, p_uncorrected * 28)  # 28 = total Ch7 hypotheses
            
            # Bootstrap CI for partial correlation
            boot_result = bootstrap_correlation_ci(
                ravlt_residuals, slope_residuals, 
                n_bootstrap=1000, random_state=42
            )
            
            # Save results
            partial_results = pd.DataFrame([{
                'partial_r': partial_r,
                'CI_lower': boot_result['ci_lower'],
                'CI_upper': boot_result['ci_upper'],
                'p_uncorrected': p_uncorrected,
                'p_bonferroni': p_bonferroni,
                'N': len(df)
            }])
            
            partial_results.to_csv('results/ch7/7.6.2/data/step05_partial_correlation.csv', index=False)
            
    input_files:
      - path: "results/ch7/7.6.2/data/step03_analysis_input.csv"
        required_columns: ["RAVLT_Forgetting", "REMEMVR_Slope", "ravlt-trial-5-score", "REMEMVR_Intercept"]
        
    output_files:
      - path: "results/ch7/7.6.2/data/step05_partial_correlation.csv"
        description: "Partial correlation controlling for encoding levels"
        expected_columns: ["partial_r", "CI_lower", "CI_upper", "p_uncorrected", "p_bonferroni", "N"]
        
    validation_call:
      module: "tools.validation"
