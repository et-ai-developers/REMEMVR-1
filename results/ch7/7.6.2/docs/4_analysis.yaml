      signature: "validate_correlation_test_d068(result: Dict, bonferroni_factor: int = 28) -> Dict[str, Any]"
      parameters:
        bonferroni_factor: 28
        
    log_file: "results/ch7/7.6.2/logs/step05_partial_correlation.log"

  - name: "step06_diagnostic_tests"
    step_number: 6
    description: "Test correlation assumptions: normality, linearity, outliers, homoscedasticity"
    
    verification_status:
      module_verified: true
      function_signature_verified: true
      paths_hierarchical: true
    
    analysis_call:
      type: "custom_stdlib"
      description: "Comprehensive assumption testing using scipy.stats"
      
      steps:
        - step: "import_modules"
          code: |
            import pandas as pd
            import numpy as np
            from scipy.stats import kstest, normaltest, levene
            from scipy.stats import pearsonr, spearmanr
            import matplotlib.pyplot as plt
            
        - step: "run_diagnostics"
          code: |
            # Load analysis data
            df = pd.read_csv('results/ch7/7.6.2/data/step03_analysis_input.csv')
            
            x = df['RAVLT_Forgetting'].values
            y = df['REMEMVR_Slope'].values
            
            diagnostics = []
            
            # Normality tests
            ks_x, p_ks_x = kstest(x, 'norm')
            diagnostics.append({
                'test_type': 'normality_RAVLT', 
                'statistic': ks_x, 
                'p_value': p_ks_x,
                'conclusion': 'PASS' if p_ks_x > 0.05 else 'FAIL'
            })
            
            ks_y, p_ks_y = kstest(y, 'norm') 
            diagnostics.append({
                'test_type': 'normality_REMEMVR',
                'statistic': ks_y,
                'p_value': p_ks_y, 
                'conclusion': 'PASS' if p_ks_y > 0.05 else 'FAIL'
            })
            
            # Linearity assessment (correlation difference)
            r_pearson, _ = pearsonr(x, y)
            r_spearman, _ = spearmanr(x, y) 
            linearity_diff = abs(r_pearson - r_spearman)
            diagnostics.append({
                'test_type': 'linearity',
                'statistic': linearity_diff,
                'p_value': np.nan,  # No p-value for this metric
                'conclusion': 'PASS' if linearity_diff < 0.1 else 'FAIL'
            })
            
            # Outlier detection (Cook's D approximation)
            # Simple outlier detection: |z-score| > 3
            z_x = np.abs((x - np.mean(x)) / np.std(x))
            z_y = np.abs((y - np.mean(y)) / np.std(y))
            n_outliers = np.sum((z_x > 3) | (z_y > 3))
            diagnostics.append({
                'test_type': 'outliers',
                'statistic': n_outliers,
                'p_value': np.nan,
                'conclusion': f"{n_outliers} outliers detected"
            })
            
            # Save diagnostics
            diagnostics_df = pd.DataFrame(diagnostics)
            diagnostics_df.to_csv('results/ch7/7.6.2/data/step06_diagnostics.csv', index=False)
            
    input_files:
      - path: "results/ch7/7.6.2/data/step03_analysis_input.csv"
        required_columns: ["RAVLT_Forgetting", "REMEMVR_Slope"]
        
    output_files:
      - path: "results/ch7/7.6.2/data/step06_diagnostics.csv"
        description: "Correlation assumption tests and outlier identification"
        expected_columns: ["test_type", "statistic", "p_value", "conclusion"]
        
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, expected_columns: List[str]) -> Dict[str, Any]"
      parameters:
        expected_columns: ["test_type", "statistic", "p_value", "conclusion"]
        
    log_file: "results/ch7/7.6.2/logs/step06_diagnostic_tests.log"

  - name: "step07_bootstrap_stability"
    step_number: 7
    description: "Cross-validation via bootstrap resampling and sensitivity analysis"
    
    verification_status:
      module_verified: true
      function_signature_verified: true
      paths_hierarchical: true
    
    analysis_call:
      type: "custom_stdlib"
      description: "Bootstrap stability analysis with outlier sensitivity testing"
      
      steps:
        - step: "import_modules"
          code: |
            import pandas as pd
            import numpy as np
            from tools.bootstrap import bootstrap_correlation_ci
            from scipy.stats import pearsonr
            
        - step: "stability_analysis"
          code: |
            # Load analysis data
            df = pd.read_csv('results/ch7/7.6.2/data/step03_analysis_input.csv')
            
            x = df['RAVLT_Forgetting'].values
            y = df['REMEMVR_Slope'].values
            
            stability_results = []
            
            # Full sample bootstrap (already done in step 4, but for completeness)
            full_boot = bootstrap_correlation_ci(x, y, n_bootstrap=1000, random_state=42)
            stability_results.append({
                'metric': 'full_sample_correlation',
                'mean_estimate': full_boot['correlation'],
                'CI_lower': full_boot['ci_lower'],
                'CI_upper': full_boot['ci_upper'],
                'stability_index': 1.0  # Reference stability
            })
            
            # Outlier sensitivity: remove extreme values and recompute
            z_x = np.abs((x - np.mean(x)) / np.std(x))
            z_y = np.abs((y - np.mean(y)) / np.std(y))
            
            # Keep only |z| <= 2.5 (less stringent than 3)
            clean_idx = (z_x <= 2.5) & (z_y <= 2.5)
            x_clean = x[clean_idx]
            y_clean = y[clean_idx]
            
            if len(x_clean) >= 90:  # Ensure adequate sample size
                clean_boot = bootstrap_correlation_ci(x_clean, y_clean, n_bootstrap=1000, random_state=42)
                # Stability index: how similar is cleaned vs full sample?
                stability = 1.0 - abs(full_boot['correlation'] - clean_boot['correlation'])
                
                stability_results.append({
                    'metric': 'outlier_robust_correlation',
                    'mean_estimate': clean_boot['correlation'],
                    'CI_lower': clean_boot['ci_lower'],
                    'CI_upper': clean_boot['ci_upper'],
                    'stability_index': stability
                })
            
            # Subsample stability: random 80% of sample
            np.random.seed(42)
            n_subsample = int(0.8 * len(x))
            subsample_idx = np.random.choice(len(x), n_subsample, replace=False)
            
            sub_boot = bootstrap_correlation_ci(
                x[subsample_idx], y[subsample_idx], 
                n_bootstrap=1000, random_state=42
            )
            
            subsample_stability = 1.0 - abs(full_boot['correlation'] - sub_boot['correlation'])
            stability_results.append({
                'metric': 'subsample_correlation',
                'mean_estimate': sub_boot['correlation'],
                'CI_lower': sub_boot['ci_lower'],
                'CI_upper': sub_boot['ci_upper'],
                'stability_index': subsample_stability
            })
            
            # Save results
            stability_df = pd.DataFrame(stability_results)
            stability_df.to_csv('results/ch7/7.6.2/data/step07_bootstrap_results.csv', index=False)
            
    input_files:
      - path: "results/ch7/7.6.2/data/step03_analysis_input.csv"
        required_columns: ["RAVLT_Forgetting", "REMEMVR_Slope"]
        
    output_files:
      - path: "results/ch7/7.6.2/data/step07_bootstrap_results.csv"
        description: "Bootstrap stability analysis and sensitivity tests"
        expected_columns: ["metric", "mean_estimate", "CI_lower", "CI_upper", "stability_index"]
        
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
      parameters:
        column: "stability_index"
        min_val: 0.0
        max_val: 1.0
        allow_none: false
        
    log_file: "results/ch7/7.6.2/logs/step07_bootstrap_stability.log"

  - name: "step08_power_analysis"
    step_number: 8
    description: "Interpret effect sizes and assess statistical power for observed correlations"
    
    verification_status:
      module_verified: true
      function_signature_verified: true
      paths_hierarchical: true
    
    analysis_call:
      type: "custom_stdlib"
      description: "Effect size interpretation and power analysis using Cohen's guidelines"
      
      steps:
        - step: "import_modules"
          code: |
            import pandas as pd
            import numpy as np
            from scipy.stats import pearsonr
            
        - step: "power_analysis"
          code: |
            # Load correlation results
            bivariate_df = pd.read_csv('results/ch7/7.6.2/data/step04_bivariate_correlation.csv')
            partial_df = pd.read_csv('results/ch7/7.6.2/data/step05_partial_correlation.csv')
            
            power_results = []
            
            # Cohen's effect size guidelines for correlations
            def interpret_effect_size(r):
                abs_r = abs(r)
                if abs_r < 0.10:
                    return "negligible"
                elif abs_r < 0.30:
                    return "small"
                elif abs_r < 0.50:
                    return "medium"
                else:
                    return "large"
            
            # Simple power approximation for correlation with N=100
            # For α=0.05, power ≈ 80% when effect size = 0.28 with N=100
            def approximate_power(r, n=100, alpha=0.05):
                # Rough approximation based on Cohen's tables
                effect_size = abs(r)
                if effect_size >= 0.50:
                    return 0.99  # Very high power for large effects
                elif effect_size >= 0.30:
                    return 0.85  # Good power for medium effects  
                elif effect_size >= 0.28:
                    return 0.80  # Standard power threshold
                elif effect_size >= 0.20:
                    return 0.60  # Moderate power
                elif effect_size >= 0.10:
                    return 0.25  # Low power for small effects
                else:
                    return 0.10  # Very low power for negligible effects
            
            # Minimum detectable effect size for 80% power with N=100
            min_detectable_r = 0.28  # Approximate for correlation with N=100, α=0.05
            
            # Analyze bivariate correlation
            r_bivariate = bivariate_df.iloc[0]['correlation']
            power_bivariate = approximate_power(r_bivariate)
            
            power_results.append({
                'analysis_type': 'bivariate_correlation',
                'effect_size': r_bivariate,
                'power': power_bivariate,
                'min_detectable_r': min_detectable_r,
                'interpretation': interpret_effect_size(r_bivariate)
            })
            
            # Analyze partial correlation
            r_partial = partial_df.iloc[0]['partial_r']
            power_partial = approximate_power(r_partial)
            
            power_results.append({
                'analysis_type': 'partial_correlation',
                'effect_size': r_partial,
                'power': power_partial,
                'min_detectable_r': min_detectable_r,
                'interpretation': interpret_effect_size(r_partial)
            })
            
            # Save power analysis
            power_df = pd.DataFrame(power_results)
            power_df.to_csv('results/ch7/7.6.2/data/step08_power_analysis.csv', index=False)
            
    input_files:
      - path: "results/ch7/7.6.2/data/step04_bivariate_correlation.csv"
        required_columns: ["correlation"]
      - path: "results/ch7/7.6.2/data/step05_partial_correlation.csv"
        required_columns: ["partial_r"]
        
    output_files:
