# Generated: 2026-01-05T19:30:00Z
# RQ: ch7/7.3.5 - Confidence-accuracy gap predicting cognitive reserve
# Agent: rq_analysis v5.3.0
# 
# Deep Verification Summary v5.3.0:
#   - CRITICAL CORRECTION: Changed master.xlsx -> dfnonvr.csv (Ch7 rule)
#   - CRITICAL CORRECTION: Fixed column names to exact dfnonvr.csv names
#   - Module paths verified: tools.data, tools.analysis_stats, tools.bootstrap
#   - All validators matched to analysis types
#   - All paths converted to hierarchical structure
#   - Ch6 dependency verified: results/ch6/6.1.1/data/step03_theta_confidence.csv
#   - Warning: NART not available in dfnonvr.csv
# ============================================================================

metadata:
  rq_id: "ch7/7.3.5"
  verification_level: "deep_v5.3.0"
  critical_fixes_applied: 5
  ch7_data_source_corrected: "master.xlsx -> dfnonvr.csv"
  column_names_corrected: true

steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Validate cross-RQ dependencies exist before proceeding with analysis"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: Union[str, Path], min_size_bytes: int = 0) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
        description: "Ch5 5.1.1 theta scores (memory accuracy)"
        required_columns: ["UID", "theta_all"]
        expected_rows: "~100"
      - path: "results/ch6/6.1.1/data/step03_theta_confidence.csv"
        description: "Ch6 confidence scores on IRT scale"
        required_columns: ["UID", "theta_confidence"]
        expected_rows: "~100"
      - path: "data/dfnonvr.csv"
        description: "CRITICAL v5.3.0: Use dfnonvr.csv, NEVER master.xlsx"
        required_columns: ["UID", "rpm-score", "age", "education"]
        expected_rows: "~100"
        note: "NART not available in prepared data"
    
    output_files:
      - path: "results/ch7/7.3.5/data/step00_dependency_validation.txt"
        description: "Validation results for all cross-RQ dependencies"
    
    parameters:
      min_size_bytes: 200
      validate_columns: true
      
    validation_call:
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: Union[str, Path], min_size_bytes: int = 0) -> Dict[str, Any]"
    
    log_file: "results/ch7/7.3.5/logs/step00_validate_dependencies.log"
    
    expected_behavior_on_failure: "QUIT immediately with specific error about missing dependency"

  - name: "step01_extract_merge_data"
    step_number: 1
    description: "Extract and merge theta scores, confidence ratings, and cognitive reserve indicators"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_cognitive_tests"
      signature: "extract_cognitive_tests(df: pd.DataFrame, tests: List[str] = None) -> pd.DataFrame"
    
    input_files:
      - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
        description: "Ch5 5.1.1 IRT theta scores (memory accuracy)"
        required_columns: ["UID", "theta_all"]
      - path: "results/ch6/6.1.1/data/step03_theta_confidence.csv"
        description: "Ch6 confidence ratings on IRT scale"
        required_columns: ["UID", "theta_confidence"]
      - path: "data/dfnonvr.csv"
        description: "CRITICAL v5.3.0: Exact column names from dfnonvr.csv"
        required_columns: ["UID", "rpm-score", "age", "education"]
    
    output_files:
      - path: "results/ch7/7.3.5/data/step01_merged_data.csv"
        description: "Merged dataset with theta, confidence, and cognitive reserve indicators"
        columns: ["UID", "theta_all", "confidence_theta", "education", "rpm", "age"]
    
    parameters:
      tests: ["education", "rpm", "age"]
      merge_method: "inner"
      column_mapping:
        education: "education"
        rpm: "rpm-score" 
        age: "age"
        confidence_theta: "theta_confidence"
      
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
    
    log_file: "results/ch7/7.3.5/logs/step01_extract_merge.log"

  - name: "step02_create_calibration_groups"
    step_number: 2
    description: "Create calibration groups based on confidence-accuracy regression residuals"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], add_constant: bool = True, return_diagnostics: bool = True) -> Dict"
    
    input_files:
      - path: "results/ch7/7.3.5/data/step01_merged_data.csv"
        description: "Merged data from step 1"
        required_columns: ["UID", "theta_all", "confidence_theta", "education", "rpm", "age"]
    
    output_files:
      - path: "results/ch7/7.3.5/data/step02_calibration_groups.csv"
        description: "Participants assigned to calibration groups based on residuals"
        columns: ["UID", "theta_all", "confidence_theta", "residual", "group", "group_n", "education", "rpm", "age"]
      - path: "results/ch7/7.3.5/data/step02_group_descriptives.csv"
        description: "Descriptive statistics per calibration group"
        columns: ["group", "n", "theta_mean", "theta_sd", "confidence_mean", "confidence_sd", "education_mean", "rpm_mean", "age_mean"]
    
    parameters:
      formula: "confidence_theta ~ theta_all"
      grouping_method: "residual_sd"
      cutoff_sd: 0.5
      min_group_size: 15
      group_labels: ["Well-calibrated", "Overconfident", "Underconfident"]
      
    validation_call:
      module: "tools.validation"
      function: "validate_model_convergence"
      signature: "validate_model_convergence(lmm_result: Any) -> Dict[str, Any]"
    
    log_file: "results/ch7/7.3.5/logs/step02_create_groups.log"

  - name: "step03_anova_comparisons"
    step_number: 3
    description: "Compare calibration groups on cognitive reserve indicators using one-way ANOVA"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_stats"
      function: "one_way_anova_d068"
      signature: "one_way_anova_d068(data: pd.DataFrame, group_col: str, value_col: str, correction_method: str = 'bonferroni', n_comparisons: int = None, post_hoc: bool = True) -> Dict"
    
    input_files:
      - path: "results/ch7/7.3.5/data/step02_calibration_groups.csv"
        description: "Calibration groups with cognitive reserve data"
        required_columns: ["group", "education", "rpm", "age"]
    
    output_files:
      - path: "results/ch7/7.3.5/data/step03_anova_results.csv"
        description: "ANOVA results with dual p-values per Decision D068"
        columns: ["DV", "F_stat", "p_uncorrected", "p_bonferroni", "eta_squared", "eta_ci_lower", "eta_ci_upper"]
      - path: "results/ch7/7.3.5/data/step03_assumption_checks.csv"
        description: "ANOVA assumption test results"
        columns: ["DV", "test", "statistic", "p_value", "assumption", "status"]
      - path: "results/ch7/7.3.5/data/step03_posthoc_comparisons.csv"
        description: "Tukey HSD post-hoc pairwise comparisons"
        columns: ["DV", "comparison", "mean_diff", "se", "t_stat", "p_uncorrected", "p_tukey", "sig_uncorrected", "sig_tukey"]
    
    parameters:
      dependent_variables: ["education", "rpm", "age"]
      group_col: "group"
      correction_method: "bonferroni"
      n_comparisons: 6
      post_hoc: true
      alpha: 0.05
      assumption_checks: ["normality", "homoscedasticity"]
      
    validation_call:
      module: "tools.validation"
      function: "validate_hypothesis_test_dual_pvalues"
      signature: "validate_hypothesis_test_dual_pvalues(interaction_df: pd.DataFrame, required_terms: List[str], alpha_bonferroni: float = 0.05) -> Dict[str, Any]"
    
    log_file: "results/ch7/7.3.5/logs/step03_anova_comparisons.log"

  - name: "step04_correlations_bootstrap"
    step_number: 4
    description: "Correlate continuous calibration quality with cognitive reserve indicators"
    
    analysis_call:
      type: "catalogued"
      module: "tools.bootstrap"
      function: "bootstrap_correlation_ci"
      signature: "bootstrap_correlation_ci(x: Union[np.ndarray, pd.Series], y: Union[np.ndarray, pd.Series], n_bootstrap: int = 1000, confidence_level: float = 0.95, method: str = 'pearson', random_state: int = None) -> Dict"
    
    input_files:
      - path: "results/ch7/7.3.5/data/step02_calibration_groups.csv"
        description: "Calibration residuals and cognitive reserve data"
        required_columns: ["residual", "education", "rpm", "age"]
    
    output_files:
      - path: "results/ch7/7.3.5/data/step04_correlations.csv"
        description: "Correlations between calibration residuals and cognitive reserve with bootstrap CIs"
        columns: ["variable_pair", "r", "p_uncorrected", "p_bonferroni", "ci_lower", "ci_upper", "n_boot", "effect_size"]
      - path: "results/ch7/7.3.5/data/step04_bootstrap_distributions.csv"
        description: "Full bootstrap distributions for correlation CIs"
        columns: ["variable_pair", "iteration", "r_bootstrap"]
    
    parameters:
      correlations:
        - variables: ["residual", "education"]
        - variables: ["residual", "rpm"]
        - variables: ["residual", "age"]
      n_bootstrap: 1000
      confidence_level: 0.95
      method: "pearson"
      random_state: 42
      correction_method: "bonferroni"
      n_comparisons: 6
      
    validation_call:
      module: "tools.validation"
      function: "validate_correlation_test_d068"
      signature: "validate_correlation_test_d068(correlation_df: pd.DataFrame, required_cols: List[str] = None) -> Dict[str, Any]"
    
    log_file: "results/ch7/7.3.5/logs/step04_correlations_bootstrap.log"

  - name: "step05_effect_sizes_power"
    step_number: 5
    description: "Compute effect sizes and post-hoc power analysis for group comparisons"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_cohens_f2"
      signature: "compute_cohens_f2(r2_full: float, r2_reduced: float) -> float"
    
    input_files:
      - path: "results/ch7/7.3.5/data/step03_anova_results.csv"
        description: "ANOVA F-statistics for effect size computation"
        required_columns: ["DV", "F_stat", "eta_squared"]
      - path: "results/ch7/7.3.5/data/step04_correlations.csv"
        description: "Correlation coefficients for effect size computation"
        required_columns: ["variable_pair", "r"]
    
    output_files:
      - path: "results/ch7/7.3.5/data/step05_effect_sizes.csv"
        description: "Cohen's d for all pairwise group comparisons"
        columns: ["comparison", "dv", "cohens_d", "d_ci_lower", "d_ci_upper", "classification", "n1", "n2"]
      - path: "results/ch7/7.3.5/data/step05_power_analysis.csv"
        description: "Post-hoc power analysis for ANOVAs and correlations"
        columns: ["test_type", "effect", "alpha_corrected", "achieved_power", "effect_size", "n"]
    
    parameters:
      alpha_corrected: 0.0083
      effect_size_thresholds:
        small: 0.2
        medium: 0.5
        large: 0.8
      power_threshold: 0.80
      
    validation_call:
      module: "tools.validation"
      function: "validate_effect_sizes"
      signature: "validate_effect_sizes(effect_sizes_df: pd.DataFrame, f2_column: str = 'cohens_f2') -> Dict[str, Any]"
    
    log_file: "results/ch7/7.3.5/logs/step05_effect_sizes_power.log"

  - name: "step06_sensitivity_analysis"
    step_number: 6
    description: "Test robustness through outlier exclusion and alternative grouping methods"
    
    analysis_call:
      type: "catalogued"
      module: "tools.bootstrap"
      function: "bootstrap_statistic"
      signature: "bootstrap_statistic(data: Union[np.ndarray, pd.DataFrame], statistic_func: Callable, n_bootstrap: int = 1000, confidence_level: float = 0.95, method: str = 'percentile', random_state: int = None) -> Dict"
    
    input_files:
      - path: "results/ch7/7.3.5/data/step01_merged_data.csv"
        description: "Original merged data for sensitivity testing"
        required_columns: ["UID", "theta_all", "confidence_theta", "education", "rpm", "age"]
    
    output_files:
      - path: "results/ch7/7.3.5/data/step06_outlier_analysis.csv"
        description: "Outlier detection and exclusion analysis"
        columns: ["variable", "outlier_method", "outlier_count", "cooks_d_threshold", "excluded_uids"]
      - path: "results/ch7/7.3.5/data/step06_tertile_reanalysis.csv"
        description: "ANOVA results using tertile grouping method"
        columns: ["DV", "F_stat", "p_uncorrected", "p_bonferroni", "eta_squared", "method"]
      - path: "results/ch7/7.3.5/data/step06_robustness_summary.csv"
        description: "Summary of robustness across analysis methods"
        columns: ["analysis", "original_result", "outliers_excluded", "tertile_method", "effect_size_change", "robustness"]
    
    parameters:
      outlier_methods: ["cooks_distance", "mahalanobis"]
      alternative_grouping: "tertiles"
      bootstrap_stability_n: 100
      random_state: 42
      
    validation_call:
      module: "tools.validation"
      function: "validate_bootstrap_stability"
      signature: "validate_bootstrap_stability(jaccard_values: Union[np.ndarray, List[float]], min_jaccard_threshold: float = 0.75) -> Dict[str, Any]"
    
    log_file: "results/ch7/7.3.5/logs/step06_sensitivity_analysis.log"

# ============================================================================
# ANALYSIS SPECIFICATIONS
# ============================================================================

analysis_specifications:
  total_steps: 7
  estimated_runtime: "~45 minutes"
  
  cross_rq_dependencies:
    ch5_dependency:
      source: "results/ch5/5.1.1/data/step03_theta_scores.csv"
      content: "UID, theta_all (overall episodic memory ability)"
      required_for: "accuracy measure in calibration analysis"
    ch6_dependency:
      source: "results/ch6/6.1.1/data/step03_theta_confidence.csv"
      content: "UID, theta_confidence (confidence on IRT scale)"
      required_for: "confidence measure in calibration analysis"
    source_data:
      critical_v530_rule: "Ch7 NEVER uses master.xlsx - ALL data from dfnonvr.csv"
      source: "data/dfnonvr.csv"
      exact_columns: ["UID", "rpm-score", "age", "education"]
      note: "NART not available in dfnonvr.csv (nart-score column exists but may have missing values)"
  
  statistical_specifications:
    correction_method: "bonferroni"
    family_size: 6
    alpha_corrected: 0.0083
    bootstrap_iterations: 1000
    bootstrap_seed: 42
    decision_d068: "dual p-value reporting (uncorrected and corrected)"
    
  path_organization:
    rule: "ALL output paths MUST be hierarchical"
    pattern: "results/ch7/7.3.5/{folder}/{filename}"
    folders: ["data", "logs", "plots", "code", "results"]
    critical: "NEVER use flat paths like data/step01_... or logs/step01_..."
    
  validation_coverage:
    requirement: "100% validation coverage"
    pattern: "Every analysis step MUST have validation_call"
    post_analysis: "validation tools run after each analysis tool"

