error_handling:
  circuit_breakers:
    expectations_error: true
    step_error: true
    tool_error: true
    clarity_error: true
    scope_error: true
    
  on_validation_failure:
    action: "raise_exception"
    invoke: "g_debug"
    log_to: "logs/step{N}_{step_name}.log"
    
  data_quality_thresholds:
    min_participants: 95
    max_missing_percent: 5
    min_false_negatives: 3
    max_false_negatives: 15

