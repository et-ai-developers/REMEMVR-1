metadata:
  rq_id: "ch7/7.5.4"
  verification_level: "deep_v5.3.0"
  data_source_corrections: 3
  module_path_corrections: 5
  column_name_corrections: 4
  dependency_corrections: 1
  
  critical_corrections_applied:
    - "NEVER use master.xlsx in Ch7 - using dfvr.csv per v5.3.0"
    - "Sleep columns: hours-slept-night-before, sleep-quality--1=bad-1=good"
    - "Module tools.analysis_lmm for LMM functions, not invalid modules"
    - "Cross-validation using actual function cross_validate_lmm from tools.analysis_extensions"
    - "All paths hierarchical: results/ch7/7.5.4/data/"

steps:
  - name: "step00_validate_data_availability"
    step_number: 0
    description: "Validate dfvr.csv data availability and sleep variable completeness"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      
    input_files:
      - path: "data/dfvr.csv"
        required_columns: ["UID", "TEST", "hours-slept-night-before", "sleep-quality--1=bad-1=good"]
        expected_rows: 400
        data_types:
          UID: "string participant identifier"
          TEST: "int (1-4)"
          "hours-slept-night-before": "float sleep hours"
          "sleep-quality--1=bad-1=good": "float sleep quality rating"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step00_data_validation.csv"
        columns: ["validation_result", "missing_columns", "row_count", "sleep_completeness"]
        description: "Data availability validation results"
    
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, expected_format: Dict) -> Dict[str, Any]"
    
    parameters:
      required_columns: ["UID", "TEST", "hours-slept-night-before", "sleep-quality--1=bad-1=good"]
      expected_rows: 400
      missing_data_threshold: 0.10

  - name: "step01_extract_sleep_data"
    step_number: 1
    description: "Extract and clean per-test sleep data from dfvr.csv"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_sleep_per_test"
      signature: "extract_sleep_per_test(df: pd.DataFrame) -> pd.DataFrame"
      
    input_files:
      - path: "data/dfvr.csv"
        required_columns: ["UID", "TEST", "hours-slept-night-before", "sleep-quality--1=bad-1=good"]
        expected_rows: 400
        data_types:
          UID: "string"
          TEST: "int"
          "hours-slept-night-before": "float"
          "sleep-quality--1=bad-1=good": "float"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step01_sleep_data.csv"
        columns: ["UID", "TEST", "Sleep_Hours", "Sleep_Quality"]
        description: "Cleaned sleep data per test session"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: np.ndarray, min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
    
    parameters:
      sleep_hour_range: [0, 24]
      sleep_quality_range: [-1, 1] 
      outlier_threshold: 3.0
      min_tests_per_uid: 3

  - name: "step02_create_person_centered_variables"
    step_number: 2
    description: "Create person-mean and within-person centered sleep variables"
    
    analysis_call:
      type: "direct"
      library: "pandas"
      operation: "groupby and centering"
      
    input_files:
      - path: "results/ch7/7.5.4/data/step01_sleep_data.csv"
        required_columns: ["UID", "TEST", "Sleep_Hours", "Sleep_Quality"]
        expected_rows: "~400"
        data_types:
          UID: "string"
          TEST: "int"
          Sleep_Hours: "float"
          Sleep_Quality: "float"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step02_sleep_centered.csv"
        columns: ["UID", "TEST", "Sleep_Hours", "Sleep_Quality", "Sleep_Hours_PM", "Sleep_Quality_PM", "Sleep_Hours_WP", "Sleep_Quality_WP"]
        description: "Sleep data with person-mean and within-person variables"
    
    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(data: pd.DataFrame, group_var: str, centered_vars: List[str]) -> Dict[str, Any]"
    
    parameters:
      group_var: "UID"
      center_vars: ["Sleep_Hours", "Sleep_Quality"]
      centering_tolerance: 0.01

  - name: "step03_extract_vr_performance_scores" 
    step_number: 3
    description: "Extract episodic memory performance scores from dfvr.csv as outcome variable"
    
    analysis_call:
      type: "direct"
      library: "pandas"
      operation: "column selection and aggregation"
      
    input_files:
      - path: "data/dfvr.csv"
        required_columns: ["UID", "TEST", "TQ_RFR-N-OBJ1", "TQ_RFR-N-OBJ2", "TQ_RFR-N-OBJ3", "TQ_RFR-N-OBJ4", "TQ_RFR-N-STRA", "TQ_RFR-N-PORT", "TQ_RFR-N-LAND"]
        expected_rows: 400
        data_types:
          accuracy_items: "float (0-1)"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step03_memory_scores.csv"
        columns: ["UID", "TEST", "Memory_Score"]
        description: "Episodic memory performance per test session"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: np.ndarray, min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
    
    parameters:
      score_range: [0, 1]
      aggregation_method: "mean"
      memory_paradigms: ["RFR-N", "IFR-N", "RRE-N", "IRE-N"]

  - name: "step04_merge_sleep_memory_data"
    step_number: 4
    description: "Merge sleep and memory data for multilevel analysis"
    
    analysis_call:
      type: "direct"
      library: "pandas"
      operation: "merge on UID and TEST"
      
    input_files:
      - path: "results/ch7/7.5.4/data/step02_sleep_centered.csv"
        required_columns: ["UID", "TEST", "Sleep_Hours_WP", "Sleep_Quality_WP", "Sleep_Hours_PM", "Sleep_Quality_PM"]
        expected_rows: "~400"
        data_types:
          centered_vars: "float"
      - path: "results/ch7/7.5.4/data/step03_memory_scores.csv"
        required_columns: ["UID", "TEST", "Memory_Score"]
        expected_rows: "~400"
        data_types:
          Memory_Score: "float"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step04_analysis_dataset.csv"
        columns: ["UID", "TEST", "Memory_Score", "Sleep_Hours_WP", "Sleep_Quality_WP", "Sleep_Hours_PM", "Sleep_Quality_PM"]
        description: "Complete dataset for multilevel analysis"
    
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
    
    parameters:
      merge_keys: ["UID", "TEST"]
      expected_final_rows: 400
      completeness_threshold: 0.95

  - name: "step05_fit_multilevel_models"
    step_number: 5
    description: "Fit linear mixed-effects models for within-person sleep effects"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_lmm"
      function: "fit_lmm_trajectory"
      signature: "fit_lmm_trajectory(theta_scores: pd.DataFrame, config: Dict) -> MixedLMResults"
      
    input_files:
      - path: "results/ch7/7.5.4/data/step04_analysis_dataset.csv"
        required_columns: ["UID", "TEST", "Memory_Score", "Sleep_Hours_WP", "Sleep_Quality_WP", "Sleep_Hours_PM", "Sleep_Quality_PM"]
        expected_rows: 400
        data_types:
          Memory_Score: "float"
          sleep_vars: "float"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step05_lmm_results.pkl"
        columns: ["model_object"]
        description: "Fitted LMM model object"
      - path: "results/ch7/7.5.4/data/step05_fixed_effects.csv"
        columns: ["parameter", "estimate", "std_error", "z_value", "p_uncorrected", "p_bonferroni"]
        description: "Fixed effects results with dual p-values"
    
    validation_call:
      module: "tools.validation"
      function: "validate_lmm_convergence"
      signature: "validate_lmm_convergence(lmm_result) -> Dict[str, Any]"
    
    parameters:
      formula: "Memory_Score ~ Sleep_Hours_WP + Sleep_Quality_WP + Sleep_Hours_PM + Sleep_Quality_PM + TEST"
      groups: "UID"
      re_formula: "1"
      bonferroni_correction: 4
      reml: true

  - name: "step06_model_diagnostics"
    step_number: 6
    description: "Validate LMM assumptions with comprehensive diagnostics"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_lmm_assumptions_comprehensive"
      signature: "validate_lmm_assumptions_comprehensive(lmm_result: MixedLMResults, data: pd.DataFrame, output_dir: Path, alpha: float = 0.05) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch7/7.5.4/data/step05_lmm_results.pkl"
        required_columns: ["model_object"]
        expected_rows: "model file"
        data_types:
          model: "MixedLMResults object"
      - path: "results/ch7/7.5.4/data/step04_analysis_dataset.csv"
        required_columns: ["UID", "TEST", "Memory_Score"]
        expected_rows: 400
        data_types:
          Memory_Score: "float"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step06_diagnostics.csv"
        columns: ["diagnostic_test", "statistic", "p_value", "passed", "interpretation"]
        description: "LMM assumption validation results"
    
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_columns: List[str]) -> Dict[str, Any]"
    
    parameters:
      alpha: 0.05
      tests: ["normality", "homoscedasticity", "random_effects_normality", "multicollinearity"]
      output_dir: "results/ch7/7.5.4/"

  - name: "step07_cross_validation_bootstrap"
    step_number: 7
    description: "Cross-validation and bootstrap confidence intervals for model generalizability"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_extensions"
      function: "cross_validate_lmm"
      signature: "cross_validate_lmm(data: pd.DataFrame, formula: str, groups_col: str, n_folds: int = 5) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch7/7.5.4/data/step04_analysis_dataset.csv"
        required_columns: ["UID", "TEST", "Memory_Score", "Sleep_Hours_WP", "Sleep_Quality_WP"]
        expected_rows: 400
        data_types:
          outcome: "float"
          predictors: "float"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step07_cross_validation.csv"
        columns: ["fold", "r2_marginal", "r2_conditional", "rmse"]
        description: "Cross-validation performance metrics"
      - path: "results/ch7/7.5.4/data/step07_bootstrap_cis.csv"
        columns: ["parameter", "estimate", "ci_lower", "ci_upper", "se_bootstrap"]
        description: "Bootstrap confidence intervals"
    
    validation_call:
      module: "tools.validation"
      function: "validate_bootstrap_stability"
      signature: "validate_bootstrap_stability(bootstrap_results: Dict, cv_results: Dict) -> Dict[str, Any]"
    
    parameters:
      n_folds: 5
      bootstrap_iterations: 1000
      random_state: 42
      groups_col: "UID"
      formula: "Memory_Score ~ Sleep_Hours_WP + Sleep_Quality_WP + Sleep_Hours_PM + Sleep_Quality_PM + TEST"

  - name: "step08_power_effect_sizes"
    step_number: 8
    description: "Post-hoc power analysis and effect size interpretation"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_post_hoc_power"
      signature: "compute_post_hoc_power(n: int, k: int, r2: float, alpha: float = 0.05) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch7/7.5.4/data/step05_fixed_effects.csv"
        required_columns: ["parameter", "estimate", "std_error", "p_uncorrected"]
        expected_rows: "fixed effects"
        data_types:
          estimate: "float"
          p_value: "float"
      - path: "results/ch7/7.5.4/data/step07_bootstrap_cis.csv"
        required_columns: ["parameter", "ci_lower", "ci_upper"]
        expected_rows: "parameter estimates"
        data_types:
          confidence_intervals: "float"
    
    output_files:
      - path: "results/ch7/7.5.4/data/step08_power_effect_sizes.csv"
        columns: ["parameter", "effect_size", "power", "practical_interpretation", "cohen_d"]
        description: "Power analysis and effect size interpretations"
    
    validation_call:
      module: "tools.validation"
      function: "validate_effect_sizes"
      signature: "validate_effect_sizes(effect_sizes: pd.DataFrame) -> Dict[str, Any]"
    
    parameters:
      n: 400
      n_level2: 100
      k: 5
      alpha_bonferroni: 0.0125
      effect_size_thresholds: [0.05, 0.10, 0.20]
      practical_significance_threshold: 0.05

summary:
  total_steps: 9  # Steps 0-8
  primary_analysis: "Within-person sleep effects on episodic memory"
  data_source: "dfvr.csv (per v5.3.0 requirement - NO master.xlsx)"
  statistical_method: "Linear Mixed-Effects Models"
  corrections_applied: 13
  
  column_mappings:
    sleep_hours: "hours-slept-night-before"
    sleep_quality: "sleep-quality--1=bad-1=good"
    test_session: "TEST"
    participant_id: "UID"
  
  validation_coverage: "100% - all 9 steps validated"
  decision_compliance:
    D068: "Dual p-values (uncorrected + Bonferroni)"
    hierarchical_paths: "All outputs in results/ch7/7.5.4/"
    no_master_xlsx: "Using dfvr.csv exclusively"

critical_warnings:
  - "NART data unavailable in dfvr.csv per DATA_DICTIONARY.md"
  - "Sleep quality scale is -1 to 1, not 1 to 10 as in some documentation" 
  - "Ch5 dependency removed - using direct VR memory scores from dfvr.csv"
  - "All theta score references removed - using raw accuracy scores"