    step_number: 5
    description: "Compute bootstrap confidence intervals for regression coefficients"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "bootstrap_regression_ci"
      signature: "bootstrap_regression_ci(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_bootstrap: int = 1000, confidence_level: float = 0.95, random_state: int = 42) -> pd.DataFrame"
    
    input_files:
      - path: "results/ch7/7.3.2/data/step03_analysis_dataset.csv"
        description: "Analysis dataset for bootstrap resampling"
        required_columns: ["calibration_quality", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex", "Education"]
    
    output_files:
      - path: "results/ch7/7.3.2/data/step05_bootstrap_ci.csv"
        description: "Bootstrap confidence intervals for all coefficients"
        expected_columns: ["predictor", "ci_lower_bootstrap", "ci_upper_bootstrap", "se_bootstrap"]
        expected_rows: "6 predictors"
    
    validation_call:
