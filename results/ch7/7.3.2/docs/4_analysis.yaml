    output_files:
      - path: "results/ch7/7.3.2/data/step03_analysis_dataset.csv"
        description: "Complete analysis dataset with merged data"
        expected_columns: ["UID", "calibration_quality", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex", "Education"]
        expected_rows: "80-100 complete cases"
      - path: "results/ch7/7.3.2/data/step03_assumption_checks.csv"
