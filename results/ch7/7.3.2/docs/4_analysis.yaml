    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_hierarchical_regression"
      signature: "fit_hierarchical_regression(X_blocks: List[Union[np.ndarray, pd.DataFrame]], y: Union[np.ndarray, pd.Series], block_names: List[str] = None, add_constant: bool = True) -> Dict[str, Any]"
      parameters:
        blocks:
          - name: "Demographics"
            variables: ["age", "sex", "education"]
          - name: "Full_Model" 
            variables: ["age", "sex", "education", "RAVLT_T", "BVMT_T", "RPM_T"]
        dependent_variable: "calibration_quality"
        add_constant: true
        
    post_processing_call:
      module: "tools.analysis_regression"
      function: "bootstrap_regression_ci"
      signature: "bootstrap_regression_ci(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_bootstrap: int = 1000, confidence_level: float = 0.95, random_state: int = 42) -> pd.DataFrame"
      parameters:
        n_bootstrap: 1000
        confidence_level: 0.95
        random_state: 42
        # Decision D068: Dual p-values
        correction_methods:
          bonferroni_alpha: 0.000597  # 0.05/28 RQs/3 cognitive tests
          fdr_method: "benjamini_hochberg"
    
    validation_call:
