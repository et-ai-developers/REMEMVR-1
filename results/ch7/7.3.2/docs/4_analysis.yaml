    parameters:
      calibration_path: "results/ch7/7.3.2/data/step01_calibration_metrics.csv"
      participant_path: "results/ch7/7.3.2/data/step02_cognitive_tests.csv"
      include_interactions: false
      min_sample_size: 80
      correlation_threshold: 0.80
    
    expected_behavior_on_failure:
