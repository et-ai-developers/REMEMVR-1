      parameters:
        return_dataframe: true
        diagnostic_thresholds:
          vif_threshold: 5.0
          cooks_d_threshold: 0.04  # 4/n for ~100 participants
          leverage_threshold: 0.12  # 2(k+1)/n for 6 predictors
        
    validation_call:
      module: "tools.analysis_extensions"  # CORRECTED MODULE
