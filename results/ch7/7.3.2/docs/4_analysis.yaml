        description: "Cross-validation results by fold"
        expected_columns: ["fold", "train_r2", "test_r2", "rmse", "mae", "n_train", "n_test"]
        expected_rows: "5 folds"
      - path: "results/ch7/7.3.2/data/step07_overfitting_assessment.csv"
        description: "Overfitting assessment and model stability"
        expected_columns: ["metric", "train_mean", "test_mean", "gap", "overfitting_flag"]
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
    
    parameters:
      n_folds: 5
      random_state: 42
      scoring_metrics: ["mse", "r2", "mae"]
      stratification_variable: "calibration_quality"  # Quantile-based if skewed
      shuffle: true
      overfitting_threshold: 0.10  # Train R² - Test R² gap
    
    expected_behavior_on_failure:
      action: "Raise ValueError with specific CV issue"
      log_to: "results/ch7/7.3.2/logs/step07_cross_validation.log"
      invoke: "g_debug"

  - name: "step08_power_analysis_effect_sizes"
    step_number: 8
    description: "Perform post-hoc power analysis and interpret effect sizes"
    
    analysis_call:
      type: "catalogued" 
      module: "tools.analysis_regression"
      function: "compute_post_hoc_power"
      signature: "compute_post_hoc_power(n: int, k: int, r2: float, alpha: float = 0.05) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.2/data/step04_regression_results.csv"
        description: "Regression coefficients for effect size calculation"
      - path: "results/ch7/7.3.2/data/step07_cross_validation.csv"
        description: "CV results for sample size and R² estimates"
    
    output_files:
      - path: "results/ch7/7.3.2/data/step08_power_analysis.csv"
        description: "Post-hoc power analysis and effect size interpretation"
        expected_columns: ["analysis", "n", "k", "r2", "alpha", "power", "f2", "interpretation"]
        expected_rows: "2-3 analyses (overall model, R² increment, sensitivity)"
      - path: "results/ch7/7.3.2/data/step08_effect_sizes.csv"
        description: "Effect size interpretations with practical significance"
        expected_columns: ["predictor", "sr_squared", "f2", "cohens_convention", "practical_significance"]
        expected_rows: "6 predictors"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
    
    parameters:
      # Post-hoc power analysis parameters
      alpha_corrected: 0.000597  # Bonferroni for 3 cognitive tests
      alpha_uncorrected: 0.05
      k_predictors: 6  # Total predictors in full model
      effect_size_conventions:
        f2_small: 0.02
        f2_medium: 0.15
        f2_large: 0.35
      power_target: 0.80
      # Optional comparison to RQ 7.1.1 accuracy prediction
      comparison_rq: "results/ch7/7.1.1/data/step04_regression_results.csv"
      comparison_required: false  # May not exist yet
    
    expected_behavior_on_failure:
      action: "Raise ValueError with specific power analysis issue"
      log_to: "results/ch7/7.3.2/logs/step08_power_analysis.log"
      acceptable_warnings: ["7.1.1 comparison: data not found"]

