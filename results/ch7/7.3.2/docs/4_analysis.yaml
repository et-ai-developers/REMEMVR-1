      signature: "validate_bootstrap_stability(jaccard_values: Union[np.ndarray, List[float]], min_jaccard_threshold: float = 0.75) -> Dict[str, Any]"
      parameters:
        min_jaccard_threshold: 0.75
    
    input_files:
      - path: "results/ch7/7.3.2/data/step03_analysis_dataset.csv"
        description: "Complete analysis dataset from step 3"
        required_columns: ["UID", "calibration_quality", "RAVLT_T", "BVMT_T", "RPM_T", "age", "sex", "education"]
        
    output_files:
      - path: "results/ch7/7.3.2/data/step04_regression_results.csv"
        description: "Hierarchical regression coefficients with bootstrap CIs and dual p-values"
        expected_columns: ["predictor", "beta", "se", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni", "p_fdr", "sr_squared", "vif"]
      - path: "results/ch7/7.3.2/data/step04_model_comparison.csv"
