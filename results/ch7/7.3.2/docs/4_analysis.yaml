        description: "Comprehensive regression diagnostics with remedial actions"
        expected_columns: ["test", "statistic", "p_value", "threshold", "result", "remedial_action"]
        expected_rows: "5-8 assumption tests"
      - path: "results/ch7/7.3.2/data/step06_outliers.csv"
        description: "Outlier and influential point analysis"
        expected_columns: ["observation", "cooks_d", "leverage", "studentized_residual", "outlier_flag"]
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
    
    parameters:
      diagnostic_tests:
        - "normality"  # Shapiro-Wilk on residuals
        - "homoscedasticity"  # Breusch-Pagan test
        - "multicollinearity"  # VIF for each predictor
        - "linearity"  # Rainbow test
        - "independence"  # Durbin-Watson
      thresholds:
        shapiro_alpha: 0.05
        breusch_pagan_alpha: 0.05
        vif_threshold: 5.0
        durbin_watson_range: [1.5, 2.5]
        cooks_d_threshold: 0.04
        leverage_threshold: 0.12
      return_dataframe: true
    
    expected_behavior_on_failure:
      action: "Log warnings, continue analysis with remedial actions"
      log_to: "results/ch7/7.3.2/logs/step06_diagnostics.log"
      remedial_actions: "Document and implement appropriate corrections"

