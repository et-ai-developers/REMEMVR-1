        description: "T-scored cognitive tests with demographics"
        expected_columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex", "Education"]
        expected_rows: "~100 participants"
    
    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(standardized_scores: pd.DataFrame, target_mean: float = 50.0, target_sd: float = 10.0, tolerance: float = 2.0) -> Dict[str, Any]"
    
    parameters:
      # Column name mappings for dfnonvr.csv (v5.3.0 requirement)
      ravlt_columns: ["RAVLT trial 1 score", "RAVLT trial 2 score", "RAVLT trial 3 score", "RAVLT trial 4 score", "RAVLT trial 5 score"]
      bvmt_columns: ["BVMT trial 1 score", "BVMT trial 2 score", "BVMT trial 3 score", "BVMT delayed recall score"] 
      rpm_column: "RPM Score"
      # NOTE: NART not available in dfnonvr.csv as per v5.3.0
      age_column: "Age in years"
      sex_column: "Sex 0=female 1=male"
      education_column: "Education level ( High school (Year 9 or lower)"
      t_score_conversion: true
      target_mean: 50.0
      target_sd: 10.0
    
    expected_behavior_on_failure:
      action: "Raise ValueError with specific cognitive test issue"
      log_to: "results/ch7/7.3.2/logs/step02_extract_cognitive.log"
      invoke: "g_debug"

  - name: "step03_merge_data_check_assumptions"
    step_number: 3
    description: "Create analysis dataset and perform comprehensive assumption testing"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "prepare_regression_data"
      signature: "prepare_regression_data(participant_path: str = None, test_path: str = None, theta_path: str = None, include_interactions: bool = False) -> pd.DataFrame"
    
    input_files:
