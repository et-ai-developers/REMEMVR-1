      module: "tools.data"
      function: "extract_cognitive_tests"
      signature: "extract_cognitive_tests(df: pd.DataFrame, tests: List[str] = None) -> pd.DataFrame"
      parameters:
        # CRITICAL: Use exact column names from dfnonvr.csv
        cognitive_tests:
          RAVLT: ['ravlt-trial-1-score', 'ravlt-trial-2-score', 'ravlt-trial-3-score', 
                  'ravlt-trial-4-score', 'ravlt-trial-5-score']
          BVMT: ['bvmt-trial-1-score', 'bvmt-trial-2-score', 'bvmt-trial-3-score', 
                 'bvmt-delayed-recall-score']
          RPM: 'rpm-score'
        demographics: ['age', 'sex', 'education']
        t_score_conversion: true
        
    post_processing_call:
      module: "tools.data"
      function: "standardize_to_t_scores" 
      signature: "standardize_to_t_scores(scores: Union[pd.Series, pd.DataFrame], population_mean: float = None, population_sd: float = None) -> Union[pd.Series, pd.DataFrame]"
      parameters:
        # Convert to T-scores: M=50, SD=10
        target_mean: 50
        target_sd: 10
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
      parameters:
        range_checks:
          RAVLT_T: [20, 80]  # T-score range (±3 SD)
          BVMT_T: [20, 80] 
          RPM_T: [20, 80]
    
    input_files:
      - path: "data/dfnonvr.csv"  # CRITICAL: Ch7 uses dfnonvr.csv NOT master.xlsx
        description: "Cognitive test and demographic data for Ch7"
        required_columns: ["UID", "ravlt-trial-1-score", "bvmt-trial-1-score", "rpm-score", "age", "sex", "education"]
        warning: "NART data (nart-score column) available but not used in cognitive predictors analysis"
        
    output_files:
      - path: "results/ch7/7.3.2/data/step02_cognitive_tests.csv"
        description: "T-scored cognitive tests with demographics" 
        expected_columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "age", "sex", "education"]
        
    expected_runtime_minutes: 8

  - name: "step03_merge_and_check_assumptions"
    step_number: 3
    description: "Merge calibration and cognitive data, check regression assumptions"
    verification_status:
