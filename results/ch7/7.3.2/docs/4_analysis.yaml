steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Verify Ch6 calibration data and dfnonvr.csv accessibility"
    verification_status:
      module_verified: true
      function_exists: true  # Using basic file check, not specialized function
      file_formats_compatible: true
      paths_hierarchical: true
    
    analysis_call:
      type: "standard_library"
      description: "Check Ch6 calibration files and dfnonvr.csv exist"
      implementation: |
        # Standard library implementation for dependency checking
        import os
        import glob
        import pandas as pd
        
        def validate_dependencies():
            results = []
            
            # Check Ch6 calibration data
            ch6_patterns = [
                'results/ch6/*/data/*calibration*.csv',
                'results/ch6/*/data/*resolution*.csv', 
                'results/ch6/*/data/*brier*.csv'
            ]
            
            ch6_found = False
            ch6_source = None
            for pattern in ch6_patterns:
                files = glob.glob(pattern)
                if files:
                    ch6_found = True
                    ch6_source = files[0]
                    results.append(f"Ch6 calibration source: {ch6_source}")
                    break
            
            if not ch6_found:
                results.append("Ch6 calibration source: NOT FOUND")
                
            # Check dfnonvr.csv (Ch7 uses this, NOT master.xlsx)
            dfnonvr_path = 'data/dfnonvr.csv'
            if os.path.exists(dfnonvr_path):
                results.append(f"dfnonvr.csv: ACCESSIBLE")
                # Verify cognitive test columns exist
                df = pd.read_csv(dfnonvr_path, nrows=1)
                required_cols = ['ravlt-trial-1-score', 'bvmt-trial-1-score', 'rpm-score']
                missing_cols = [col for col in required_cols if col not in df.columns]
                if missing_cols:
                    results.append(f"Missing columns: {missing_cols}")
                else:
                    results.append("Cognitive test columns: VERIFIED")
            else:
                results.append("dfnonvr.csv: NOT FOUND")
            
            # Summary
            if ch6_found and os.path.exists(dfnonvr_path):
                results.append("Dependency validation: PASS")
            else:
                results.append("Dependency validation: FAIL")
            
            return results
    
    validation_call:
      type: "standard_library"
      description: "Verify dependency validation completed"
      implementation: |
        # Check that dependency validation file exists and contains required patterns
        def validate_dependency_check(file_path):
            if not os.path.exists(file_path):
                return {"valid": False, "message": "Dependency validation file missing"}
            
            with open(file_path, 'r') as f:
                content = f.read()
            
            required_patterns = ["Ch6 calibration source", "dfnonvr.csv: ACCESSIBLE", "Dependency validation: PASS"]
            missing_patterns = [p for p in required_patterns if p not in content]
            
            if missing_patterns:
                return {"valid": False, "message": f"Missing patterns: {missing_patterns}"}
            
            return {"valid": True, "message": "All dependencies validated"}
    
    input_files: []
    
    output_files:
      - path: "results/ch7/7.3.2/data/step00_dependency_validation.txt"
        description: "Dependency validation log with Ch6 and dfnonvr.csv status"
        
    expected_runtime_minutes: 2

  - name: "step01_extract_calibration_metrics"
    step_number: 1
    description: "Extract calibration quality metrics from Ch6 outputs"
    verification_status:
      module_verified: true
      function_exists: true  # Using standard pandas, no custom function needed
      file_formats_compatible: true
      paths_hierarchical: true
    
    analysis_call:
      type: "standard_library" 
      description: "Load Ch6 calibration data and extract per-participant metrics"
      implementation: |
        # Standard library implementation for calibration data extraction
        import pandas as pd
        import numpy as np
        import glob
        
        def extract_calibration_metrics():
            # Find Ch6 calibration file (from step 0)
            ch6_patterns = [
                'results/ch6/*/data/*calibration*.csv',
                'results/ch6/*/data/*resolution*.csv',
                'results/ch6/*/data/*brier*.csv'
            ]
            
            calibration_file = None
            for pattern in ch6_patterns:
                files = glob.glob(pattern)
                if files:
                    calibration_file = files[0]
                    break
            
            if not calibration_file:
                raise FileNotFoundError("No Ch6 calibration data found")
            
            # Load calibration data
            df = pd.read_csv(calibration_file)
            
            # Extract per-participant calibration quality
            # Standardize column names (calibration_score, calibration_quality, resolution, etc.)
            metric_cols = [col for col in df.columns if any(term in col.lower() 
                          for term in ['calibration', 'resolution', 'brier'])]
            
            if not metric_cols:
                raise ValueError("No calibration metric columns found")
            
            # Use first available calibration metric
            metric_col = metric_cols[0] 
            
            # Create standardized output
            output_df = df[['UID', metric_col]].copy()
            output_df.columns = ['UID', 'calibration_quality']
            
            # Remove missing data
            output_df = output_df.dropna()
            
            return output_df
    
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      parameters:
        required_columns: ["UID", "calibration_quality"]
    
    input_files:
      - path: "results/ch6/*/data/*calibration*.csv"
        description: "Ch6 calibration analysis output (discovered in step 0)"
        required_columns: ["UID", "calibration_metric"]
        
    output_files:
      - path: "results/ch7/7.3.2/data/step01_calibration_metrics.csv"
        description: "Per-participant calibration quality metrics from Ch6"
        expected_columns: ["UID", "calibration_quality"]
        
    expected_runtime_minutes: 5

