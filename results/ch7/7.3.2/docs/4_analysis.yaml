  - name: "step04_hierarchical_regression"
    step_number: 4
    description: "Fit hierarchical regression models to test cognitive predictors of calibration quality"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_hierarchical_regression"
      signature: "fit_hierarchical_regression(X_blocks: List[Union[np.ndarray, pd.DataFrame]], y: Union[np.ndarray, pd.Series], block_names: List[str] = None, add_constant: bool = True) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.2/data/step03_analysis_dataset.csv"
        description: "Complete analysis dataset from step 3"
        required_columns: ["calibration_quality", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex", "Education"]
    
    output_files:
      - path: "results/ch7/7.3.2/data/step04_regression_results.csv"
        description: "Hierarchical regression coefficients with dual p-values (Decision D068)"
        expected_columns: ["predictor", "beta", "se", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni", "p_fdr", "sr_squared", "vif"]
        expected_rows: "6 predictors (Age, Sex, Education, RAVLT_T, BVMT_T, RPM_T)"
      - path: "results/ch7/7.3.2/data/step04_model_comparison.csv"
        description: "Model comparison statistics for hierarchical blocks"
        expected_columns: ["model", "r2", "adj_r2", "delta_r2", "f_change", "p_value", "aic", "bic"]
        expected_rows: "2 models (Demographics, Full_Model)"
    
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
    
    parameters:
      # Hierarchical blocks for regression
      block_1_variables: ["Age", "Sex", "Education"]
      block_2_variables: ["Age", "Sex", "Education", "RAVLT_T", "BVMT_T", "RPM_T"]
      block_names: ["Demographics", "Full_Model"]
      dependent_variable: "calibration_quality"
      add_constant: true
      # Bonferroni correction for 3 cognitive tests within RQ (v5.3.0)
      alpha_uncorrected: 0.05
      alpha_bonferroni: 0.000597  # 0.00179 / 3 tests
      bootstrap_ci: true
      n_bootstrap: 1000
      random_state: 42
    
    expected_behavior_on_failure:
      action: "Raise ValueError with specific regression issue"
      log_to: "results/ch7/7.3.2/logs/step04_regression.log"
      invoke: "g_debug"

