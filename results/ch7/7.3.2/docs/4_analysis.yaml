    step_number: 2
    description: "Extract and T-score cognitive test data from dfnonvr.csv"
    verification_status:
      module_verified: true
      function_exists: true  # tools.data.extract_cognitive_tests verified
      file_formats_compatible: true
      paths_hierarchical: true
      data_source_corrected: true  # dfnonvr.csv not master.xlsx
      column_names_corrected: true  # exact dfnonvr.csv column names
      
    analysis_call:
