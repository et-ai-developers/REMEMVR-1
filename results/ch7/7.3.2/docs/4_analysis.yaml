  - name: "step01_extract_calibration_metrics"
    step_number: 1
    description: "Extract per-participant calibration quality metrics from Ch6 outputs"
    
    analysis_call:
      type: "stdlib"
      implementation: |
        import pandas as pd
        
        # Load Ch6 calibration data - verified file exists
        df_cal = pd.read_csv("results/ch6/6.2.1/data/step02_calibration_scores.csv")
        
        # Extract per-participant calibration scores
        # Group by UID and compute mean calibration across tests
        cal_metrics = df_cal.groupby('UID')['calibration'].mean().reset_index()
        cal_metrics.columns = ['UID', 'calibration_quality']
        
        # Save calibration metrics
        cal_metrics.to_csv("results/ch7/7.3.2/data/step01_calibration_metrics.csv", index=False)
        
        print(f"Calibration data loaded: N={len(cal_metrics)} participants")
        print(f"Calibration range: [{cal_metrics['calibration_quality'].min():.3f}, {cal_metrics['calibration_quality'].max():.3f}]")
    
    input_files:
      - path: "results/ch6/6.2.1/data/step02_calibration_scores.csv"
        description: "Ch6 calibration analysis outputs - verified to exist"
        required_columns: ["UID", "calibration"]
        expected_rows: "~400 rows (100 participants x 4 tests)"
    
    output_files:
      - path: "results/ch7/7.3.2/data/step01_calibration_metrics.csv"
        description: "Per-participant calibration quality metrics"
        expected_columns: ["UID", "calibration_quality"]
        expected_rows: "~100 participants"
    
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
    
    parameters:
      required_columns: ["UID", "calibration_quality"]
      min_participants: 90
      max_participants: 110
    
    expected_behavior_on_failure:
      action: "Raise ValueError with specific data quality issue"
      log_to: "results/ch7/7.3.2/logs/step01_extract_calibration.log"
      invoke: "g_debug"

  - name: "step02_extract_cognitive_tests"
    step_number: 2
    description: "Extract and standardize cognitive test scores from dfnonvr.csv"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_cognitive_tests"
      signature: "extract_cognitive_tests(df: pd.DataFrame, tests: List[str] = None, t_score_conversion: bool = True) -> pd.DataFrame"
    
    input_files:
      - path: "data/dfnonvr.csv"
        description: "Master cognitive test data - CRITICAL: Ch7 uses dfnonvr.csv, NOT master.xlsx"
        required_columns: [
          "UID", 
          "RAVLT trial 1 score", "RAVLT trial 2 score", "RAVLT trial 3 score", "RAVLT trial 4 score", "RAVLT trial 5 score",
          "BVMT trial 1 score", "BVMT trial 2 score", "BVMT trial 3 score", "BVMT delayed recall score",
          "RPM Score",
          "Age in years", "Sex 0=female 1=male", "Education level ( High school (Year 9 or lower)"
        ]
        expected_rows: "~100 participants"
      - path: "results/ch7/7.3.2/data/step01_calibration_metrics.csv"
        description: "For participant matching"
    
    output_files:
