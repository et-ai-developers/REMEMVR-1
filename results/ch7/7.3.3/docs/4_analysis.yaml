#   - Data source corrected: master.xlsx → dfnonvr.csv (Ch7 rule)
#   - Column names verified from actual dfnonvr.csv file
#   - HCE dependency confirmed: Ch6 6.6.1 participant-level rates
#   - All paths converted to hierarchical structure
#   - Function signatures verified from actual tools/*.py files
