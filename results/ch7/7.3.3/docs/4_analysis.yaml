# Generated: 2026-01-05T14:30:00Z  
# RQ: ch7/7.3.3 - Cognitive Predictors of High-Confidence Errors
# Agent: rq_analysis v5.3.0 with CRITICAL column name corrections
# 
# CRITICAL v5.3.0 CORRECTIONS APPLIED:
#   - Column names: FIXED to exact dfnonvr.csv format (lowercase with hyphens)
#   - Data source: NEVER use master.xlsx for Ch7 - dfnonvr.csv contains all data
#   - Module paths: Verified from actual tools/*.py files
#   - Function signatures: Extracted from actual code
#   - Hierarchical paths: ALL outputs use results/ch7/7.3.3/ structure
#   - Validator matching: Regression validators only (no LMM)
# ============================================================================

metadata:
  rq_id: "ch7/7.3.3"
  title: "Cognitive Predictors of High-Confidence Errors"
  analysis_type: "hierarchical_multiple_regression"
  verification_level: "deep_v5.3.0"
  
  # CRITICAL CORRECTIONS APPLIED:
  corrections_applied:
    - "COLUMN NAMES: Fixed 'RAVLT trial X score' → 'ravlt-trial-X-score'"
    - "COLUMN NAMES: Fixed 'BVMT delayed recall score' → 'bvmt-delayed-recall-score'"
    - "COLUMN NAMES: Fixed 'RPM Score' → 'rpm-score'"
    - "COLUMN NAMES: Fixed 'Age in years' → 'age'"
    - "COLUMN NAMES: Fixed 'Sex 0=female 1=male' → 'sex'"
    - "COLUMN NAMES: Fixed 'Education level' → 'education'"
    - "Data source: Ch7 NEVER uses master.xlsx - all data in dfnonvr.csv"
    - "Module paths: Verified tools.data.extract_cognitive_tests exists"
    - "Function signatures: Extracted from actual tools/*.py code"
    - "Path organization: ALL outputs hierarchical"
    - "Validators: Only regression-appropriate validators"
  
  dependencies:
    external_data:
      - path: "data/dfnonvr.csv"
        source: "Root data file with ALL Ch7 cognitive data"
        variables: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score", "bvmt-delayed-recall-score", "rpm-score", "age", "sex", "education"]
        critical: true
        note: "Ch7 NEVER uses master.xlsx - dfnonvr.csv has all required data"
    
    cross_rq_data:
      - path: "results/ch6/6.6.1/data/step01_hce_rates.csv" 
        source: "Ch6 HCE analysis"
        variables: ["UID", "HCE_rate"]
        critical: true
        description: "High-confidence error rates per participant"

steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Validate Ch6 HCE data and dfnonvr.csv accessibility with correct column names"
    
    dependencies: []
    
    analysis_call:
      type: "standard_library"
      operations:
        - "import os"
        - "import pandas as pd"
        - "Check os.path.exists('results/ch6/6.6.1/data/step01_hce_rates.csv')"
        - "Check os.path.exists('data/dfnonvr.csv')"
        - "Verify HCE data format: columns ['UID', 'HCE_rate'] presence"
        - "Verify exact column names in dfnonvr.csv: ravlt-trial-X-score format"
        - "Log all validation results"
    
    input_files:
      - path: "results/ch6/6.6.1/data/step01_hce_rates.csv"
        required_columns: ["UID", "HCE_rate"]
        description: "Ch6 HCE rates per participant"
        critical: true
      
      - path: "data/dfnonvr.csv"
        required_columns: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score", "bvmt-delayed-recall-score", "rpm-score", "age", "sex", "education"]
        description: "Cognitive test scores and demographics in correct hyphenated format"
        critical: true
        note: "Column names MUST be lowercase with hyphens, NOT space-separated with capitals"
    
    output_files:
      - path: "results/ch7/7.3.3/data/step00_dependency_validation.txt"
        description: "Validation results with exact column name verification"
        expected_content: ["File paths checked", "Exact column names verified", "Data dimensions"]
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step00_validate_dependencies.log"
        
    validation_call:
      type: "none"
      rationale: "Validation step itself - no validation needed"
  
  - name: "step01_extract_cognitive_tests"
    step_number: 1
    description: "Extract cognitive test scores from dfnonvr.csv using correct column names"
    
    dependencies: ["step00"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_cognitive_tests"
      signature: "extract_cognitive_tests(uid_list: Optional[List[str]] = None, data_path: str = './data/dfnonvr.csv') -> pd.DataFrame"
    
    input_files:
      - path: "data/dfnonvr.csv"
        required_columns: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score", "bvmt-delayed-recall-score", "rpm-score", "age", "sex", "education"]
        description: "Raw cognitive test scores with exact hyphenated column names"
    
    output_files:
      - path: "results/ch7/7.3.3/data/step01_cognitive_tests.csv"
        columns: ["uid", "ravlt_total", "bvmt_total", "nart_iq", "rpm_score", "age", "sex", "education"]
        description: "Processed cognitive test data ready for analysis (note: nart_iq may be NULL if not available)"
        expected_rows: "~100"
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step01_extract_cognitive_tests.log"
    
    parameters:
      uid_list: null
      data_path: "data/dfnonvr.csv"
      
      # Column mapping from dfnonvr.csv (hyphenated) to processing variables
      ravlt_columns: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score"]
      bvmt_columns: ["bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score", "bvmt-delayed-recall-score"]
      rpm_column: "rpm-score"
      age_column: "age"
      sex_column: "sex"
      education_column: "education"
      nart_column: "nart-iq"  # May not exist in dfnonvr.csv
      
      # Calculate totals
      ravlt_total: "sum(ravlt-trial-1-score through ravlt-trial-5-score)"
      bvmt_total: "sum(bvmt-trial-1-score, bvmt-trial-2-score, bvmt-trial-3-score, bvmt-delayed-recall-score)"
      rpm_total: "rpm-score (already total)"
      
      # Demographics processing
      sex_recode: "keep as numeric 0/1"
      age_units: "years"
      
      # NART handling
      nart_available: false
      nart_warning: "NART data may not be available in dfnonvr.csv prepared data"
    
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      parameters:
        required_columns: ["uid", "ravlt_total", "bvmt_total", "rpm_score", "age", "sex"]

  - name: "step02_extract_hce_rates"
    step_number: 2
    description: "Load and prepare HCE rates from Ch6 analysis"
    
    dependencies: ["step00"]
    
    analysis_call:
      type: "standard_library"
      operations:
        - "Load results/ch6/6.6.1/data/step01_hce_rates.csv using pandas"
        - "Group by UID if multiple tests per participant"
        - "Compute mean HCE_rate across tests for participant-level rates"
        - "Validate HCE rates in [0,1] range"
        - "Check for missing participants"
        - "Compute descriptive statistics"
    
    input_files:
      - path: "results/ch6/6.6.1/data/step01_hce_rates.csv"
        required_columns: ["UID", "HCE_rate"]
        description: "HCE rates by test from Ch6 analysis"
        
    output_files:
      - path: "results/ch7/7.3.3/data/step02_hce_rates.csv"
        columns: ["UID", "hce_rate"]
        description: "Participant-level HCE rates (mean across tests)"
        expected_rows: "~100"
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step02_extract_hce_rates.log"
    
    parameters:
      input_format: "test_level"
      aggregation: "mean"
      exclude_missing: true
      range_check: "[0, 1]"
    
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      parameters:
        required_columns: ["UID", "hce_rate"]

  - name: "step03_merge_analysis_dataset"
    step_number: 3
    description: "Merge cognitive tests and HCE rates into analysis dataset with centered predictors"
    
    dependencies: ["step01", "step02"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "merge_theta_cognitive"
      signature: "merge_theta_cognitive(theta_df: pd.DataFrame, cognitive_df: pd.DataFrame, how: str = 'inner') -> pd.DataFrame"
    
    input_files:
      - path: "results/ch7/7.3.3/data/step01_cognitive_tests.csv"
        required_columns: ["uid", "ravlt_total", "bvmt_total", "rpm_score", "age", "sex", "education"]
        description: "Cognitive test predictors"
        
      - path: "results/ch7/7.3.3/data/step02_hce_rates.csv"
        required_columns: ["UID", "hce_rate"]
        description: "HCE rate outcome variable"
    
    output_files:
      - path: "results/ch7/7.3.3/data/step03_analysis_dataset.csv"
        columns: ["uid", "hce_rate", "ravlt_total", "bvmt_total", "rpm_score", "age", "sex", "education", "ravlt_c", "bvmt_c", "rpm_c", "age_c"]
        description: "Merged analysis dataset with centered predictors"
        expected_rows: "~100"
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step03_merge_analysis_dataset.log"
    
    parameters:
      how: "inner"
      merge_on: "UID"  # Note: function will handle uid vs UID column naming
      center_predictors: true
      center_values:
        age: "sample_mean"
        ravlt_total: "sample_mean"
        bvmt_total: "sample_mean"  
        rpm_score: "sample_mean"
      suffix_pattern: "_c"
    
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      parameters:
        required_columns: ["uid", "hce_rate", "ravlt_c", "bvmt_c", "rpm_c", "age_c", "sex"]

  - name: "step04_hierarchical_regression"
    step_number: 4
    description: "Fit hierarchical regression testing incremental validity of cognitive predictors"
    
    dependencies: ["step03"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_hierarchical_regression"
      signature: "fit_hierarchical_regression(X_blocks: List[np.ndarray], y: Union[np.ndarray, pd.Series], block_names: List[str]) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.3/data/step03_analysis_dataset.csv"
        required_columns: ["hce_rate", "age_c", "sex", "education", "ravlt_c", "bvmt_c", "rpm_c"]
        description: "Analysis dataset with centered predictors"
    
    output_files:
      - path: "results/ch7/7.3.3/data/step04_regression_results.csv"
        columns: ["model", "predictor", "beta", "se", "t_stat", "p_uncorrected", "p_bonferroni", "p_fdr", "ci_lower", "ci_upper"]
        description: "Hierarchical regression results with dual p-value reporting"
        
      - path: "results/ch7/7.3.3/data/step04_model_comparison.csv"
        columns: ["model", "R2", "R2_adj", "F_stat", "p_value", "AIC", "delta_R2", "F_change"]
        description: "Model comparison statistics"
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step04_hierarchical_regression.log"
    
    parameters:
      X_blocks:
        - name: "Demographics"
          predictors: ["age_c", "sex", "education"]
        - name: "Cognitive"
          predictors: ["age_c", "sex", "education", "ravlt_c", "bvmt_c", "rpm_c"]
      
      block_names: ["Demographics", "Full_Model"]
      outcome: "hce_rate"
      
      # Multiple comparison corrections
      alpha_family: 0.00179  # Ch7 family-wise correction
      alpha_bonferroni: 0.000448  # Within-RQ correction (0.00179/4)
      fdr_method: "benjamini_hochberg"
      
      # Bootstrap parameters
      bootstrap_iterations: 1000
      bootstrap_seed: 42
      bootstrap_method: "participant_resampling"
      ci_method: "percentile"
      ci_alpha: 0.05
      
      # Robust standard errors
      robust_se: "HC3"
    
    validation_call:
      type: "catalogued"
      module: "tools.analysis_extensions"
      function: "validate_regression_assumptions"
      signature: "validate_regression_assumptions(residuals: np.ndarray, X: np.ndarray, significance_level: float = 0.05) -> Dict[str, Dict[str, Any]]"
      parameters:
        significance_level: 0.05

  - name: "step05_model_diagnostics" 
    step_number: 5
    description: "Comprehensive model diagnostics and assumption checking"
    
    dependencies: ["step04"]
    
    analysis_call:
      type: "standard_library"
      operations:
        - "Load regression results from step04"
        - "Refit model to extract residuals and fitted values"
        - "Compute multicollinearity (VIF)"
        - "Test normality (Shapiro-Wilk)"
        - "Test homoscedasticity (Breusch-Pagan)" 
        - "Identify outliers (Cook's distance)"
        - "Generate diagnostic plot data"
        - "Apply remedial actions for violations"
    
    input_files:
      - path: "results/ch7/7.3.3/data/step04_regression_results.csv"
        required_columns: ["model", "predictor", "beta"]
        description: "Fitted model results"
        
      - path: "results/ch7/7.3.3/data/step03_analysis_dataset.csv"
        required_columns: ["hce_rate", "age_c", "sex", "education", "ravlt_c", "bvmt_c", "rpm_c"]
        description: "Analysis dataset for residual analysis"
    
    output_files:
      - path: "results/ch7/7.3.3/data/step05_model_diagnostics.csv"
        columns: ["assumption", "test_statistic", "p_value", "interpretation", "remedial_action"]
        description: "Regression assumption test results"
        
      - path: "results/ch7/7.3.3/data/step05_diagnostic_plot_data.csv"
        columns: ["observation", "fitted", "residuals", "standardized_residuals", "cooks_distance", "leverage"]
        description: "Plot coordinates for diagnostic visualizations"
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step05_model_diagnostics.log"
    
    parameters:
      assumptions_to_check: ["multicollinearity", "normality", "homoscedasticity", "linearity", "outliers"]
      
      # Diagnostic thresholds
      vif_threshold: 5.0
      cooks_threshold: 0.04  # 4/n for N=100
      leverage_threshold: 0.18  # 3*k/n for k=6 predictors
      shapiro_alpha: 0.05
      breusch_pagan_alpha: 0.05
      
      # Remedial actions
      remedial_actions:
        normality_violation: "use_bootstrap_cis"
        heteroscedasticity_violation: "use_robust_se"
        multicollinearity_violation: "document_and_proceed"
        outliers_detected: "sensitivity_analysis"
    
    validation_call:
      type: "catalogued"
      module: "tools.analysis_extensions"
      function: "validate_regression_assumptions"
      signature: "validate_regression_assumptions(residuals: np.ndarray, X: np.ndarray, significance_level: float = 0.05) -> Dict[str, Dict[str, Any]]"
      parameters:
        significance_level: 0.05

  - name: "step06_effect_sizes"
    step_number: 6
    description: "Compute comprehensive effect sizes with bootstrap confidence intervals"
    
    dependencies: ["step04"]
    
    analysis_call:
      type: "standard_library"
      operations:
        - "Load model comparison results"
        - "Compute Cohen's f² for overall model"
        - "Compute incremental f² for cognitive block"
        - "Compute individual predictor f² values"
        - "Bootstrap effect size confidence intervals"
        - "Relative importance analysis"
        - "Context-specific interpretation for HCE research"
    
    input_files:
      - path: "results/ch7/7.3.3/data/step04_model_comparison.csv"
        required_columns: ["model", "R2", "R2_adj"]
        description: "Model R² values for effect size calculation"
    
    output_files:
      - path: "results/ch7/7.3.3/data/step06_effect_sizes.csv"
        columns: ["effect_type", "value", "interpretation", "cohen_classification", "practical_significance"]
        description: "Cohen's f² and relative importance measures"
        
      - path: "results/ch7/7.3.3/data/step06_effect_size_cis.csv"
        columns: ["effect", "f2", "ci_lower", "ci_upper", "bootstrap_iterations"]
        description: "Bootstrap confidence intervals for effect sizes"
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step06_effect_sizes.log"
    
    parameters:
      effect_types:
        - "overall_model_f2"
        - "incremental_f2_cognitive"
        - "individual_predictor_f2"
      
      # Effect size thresholds (Cohen's conventions)
      effect_size_thresholds:
        small: 0.02
        medium: 0.15
        large: 0.35
      
      # Context-specific thresholds for HCE research
      practical_thresholds:
        minimal: 0.01
        meaningful: 0.02
        substantial: 0.05
      
      # Bootstrap parameters  
      bootstrap_iterations: 1000
      bootstrap_seed: 42
      ci_method: "percentile"
      ci_alpha: 0.05
      
      # Relative importance analysis
      relative_weights: true
      dominance_analysis: true
    
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(values: Union[pd.Series, np.ndarray, List], min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
      parameters:
        min_val: 0.0
        max_val: 5.0
        allow_none: false
        description: "Cohen's f² values should be non-negative"

  - name: "step07_cross_validation"
    step_number: 7
    description: "5-fold cross-validation to assess model generalizability"
    
    dependencies: ["step03"]
    
    analysis_call:
      type: "standard_library"
      operations:
        - "Load analysis dataset"
        - "Set up 5-fold cross-validation with shuffle"
        - "For each fold: fit model on train, evaluate on test"
        - "Compute R², RMSE, MAE per fold"
        - "Calculate generalization gap (train R² - test R²)"
        - "Aggregate metrics across folds"
        - "Flag overfitting if gap > threshold"
    
    input_files:
      - path: "results/ch7/7.3.3/data/step03_analysis_dataset.csv"
        required_columns: ["hce_rate", "age_c", "sex", "education", "ravlt_c", "bvmt_c", "rpm_c"]
        description: "Full analysis dataset for cross-validation"
    
    output_files:
      - path: "results/ch7/7.3.3/data/step07_cross_validation.csv"
        columns: ["fold", "train_r2", "test_r2", "rmse", "mae", "generalization_gap"]
        description: "Cross-validation performance metrics per fold"
        
      - path: "results/ch7/7.3.3/data/step07_cv_summary.csv"
        columns: ["metric", "mean", "std", "min", "max", "overfitting_flag"]
        description: "Aggregated cross-validation performance"
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step07_cross_validation.log"
    
    parameters:
      cv_folds: 5
      random_state: 42
      shuffle: true
      stratify: false  # Regression - no stratification needed
      
      # Model specification for CV
      model_formula: "hce_rate ~ age_c + sex + education + ravlt_c + bvmt_c + rpm_c"
      
      # Performance metrics
      metrics: ["r2", "rmse", "mae"]
      
      # Overfitting detection
      overfitting_threshold: 0.10  # Train-test R² gap
      generalization_warning_threshold: 0.05
    
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(values: Union[pd.Series, np.ndarray, List], min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
      parameters:
        min_val: 0.0
        max_val: 1.0
        allow_none: false
        description: "R² values should be in [0,1] range"

  - name: "step08_power_analysis"
    step_number: 8
    description: "Post-hoc power analysis and sensitivity testing for observed effects"
    
    dependencies: ["step04", "step06"]
    
    analysis_call:
      type: "standard_library"
      operations:
        - "Load model statistics and effect sizes"
        - "Compute achieved power for overall F-test"
        - "Compute power for incremental F-change test"
        - "Compute power for individual predictors"
        - "Calculate minimum detectable effects with 80% power"
        - "Sensitivity analysis for RPM hypothesis"
        - "Power interpretation and recommendations"
    
    input_files:
      - path: "results/ch7/7.3.3/data/step04_model_comparison.csv"
        required_columns: ["model", "R2", "F_stat", "p_value"]
        description: "Model statistics for power calculation"
        
      - path: "results/ch7/7.3.3/data/step06_effect_sizes.csv"
        required_columns: ["effect_type", "value"]
        description: "Observed effect sizes"
    
    output_files:
      - path: "results/ch7/7.3.3/data/step08_power_analysis.csv"
        columns: ["test_type", "effect_size", "alpha", "power", "interpretation"]
        description: "Post-hoc power calculations for observed effects"
        
      - path: "results/ch7/7.3.3/data/step08_sensitivity.csv"
        columns: ["test", "min_detectable_f2", "min_detectable_r2", "power_threshold"]
        description: "Minimum detectable effects with 80% power"
    
    output_logs:
      - path: "results/ch7/7.3.3/logs/step08_power_analysis.log"
    
    parameters:
      n: 100  # Sample size
      n_predictors: 6  # Full model predictors (excluding intercept)
      
      # Alpha levels
      alpha_uncorrected: 0.05
      alpha_corrected: 0.000448  # Bonferroni within-RQ correction
      
      # Power thresholds
      power_threshold: 0.80
      high_power_threshold: 0.95
      
      # Sensitivity analysis
      sensitivity_analysis: true
      min_detectable_effects: true
      
      # Tests to analyze
      tests:
        - "overall_model"
        - "incremental_cognitive"
        - "individual_predictors"
        - "rpm_hypothesis"  # Primary hypothesis
    
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(values: Union[pd.Series, np.ndarray, List], min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
      parameters:
        min_val: 0.0
        max_val: 1.0
        allow_none: false
        description: "Power values should be in [0,1] range"

# ============================================================================
# ANALYSIS SUMMARY v5.3.0
# ============================================================================

summary:
  total_steps: 9
  analysis_steps: 8
  validation_steps: 1
  
  verification_report:
    version: "v5.3.0"
    
    # CRITICAL COLUMN NAME CORRECTIONS:
    column_name_corrections:
      - "RAVLT trial 1 score → ravlt-trial-1-score"
      - "RAVLT trial 2 score → ravlt-trial-2-score" 
      - "RAVLT trial 3 score → ravlt-trial-3-score"
      - "RAVLT trial 4 score → ravlt-trial-4-score"
      - "RAVLT trial 5 score → ravlt-trial-5-score"
      - "BVMT trial 1 score → bvmt-trial-1-score"
      - "BVMT trial 2 score → bvmt-trial-2-score"
      - "BVMT trial 3 score → bvmt-trial-3-score"
      - "BVMT delayed recall score → bvmt-delayed-recall-score"
      - "RPM Score → rpm-score"
      - "Age in years → age"
      - "Sex 0=female 1=male → sex"
