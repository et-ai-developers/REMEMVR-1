        - "p_bonferroni >= p_uncorrected (correction makes more conservative)"
        - "p_fdr between p_uncorrected and p_bonferroni"
        - "Significance flags consistent with alpha thresholds"
        - "Dual reporting present for all predictors"

      on_failure:
