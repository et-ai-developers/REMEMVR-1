  # --------------------------------------------------------------------------
  - name: "step06_multiple_comparisons"
    step_number: "06"
    description: "Apply Bonferroni correction for multiple predictors and implement dual p-value reporting"

    analysis_call:
      type: "stdlib"
      operations:
        - "Load regression results from step05"
        - "Apply within-RQ Bonferroni: alpha = 0.05/4 = 0.0125 per predictor"
        - "Apply Chapter-level Bonferroni: alpha = 0.05/28 = 0.00179"
        - "Compute FDR-adjusted p-values using Benjamini-Hochberg procedure"
        - "Implement Decision D068: Report BOTH uncorrected AND corrected p-values"
        - "Test specific hypotheses: Overall model significance, individual predictors"
        - "Format results with dual p-value reporting"

      input_files:
        - path: "results/ch7/7.1.1/data/step05_regression_results.csv"
          required_columns: ["predictor", "beta", "se", "t_stat", "p_value", "ci_lower", "ci_upper"]
          variable_name: "regression_results"
          source: "step05 output"

      parameters:
        alpha_uncorrected: 0.05
        alpha_bonferroni_within: 0.0125  # 0.05/4 predictors
        alpha_chapter: 0.00179  # 0.05/28 tests in Chapter 7
        correction_methods: ["bonferroni", "fdr_bh"]

      outputs:
        corrected_results:
          path: "results/ch7/7.1.1/data/step06_corrected_results.csv"
          variable_name: "corrected_results"
          description: "P-values with multiple comparison corrections"
