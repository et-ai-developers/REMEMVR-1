  # --------------------------------------------------------------------------
  # STEP 8: Sensitivity Analysis and Effect Size Computation
  # --------------------------------------------------------------------------
  - name: "step08_sensitivity_analysis"
    step_number: "08"
    description: "Conduct sensitivity analyses and compute comprehensive effect sizes"

    analysis_call:
      type: "stdlib"
      operations:
        - "Fit sensitivity model excluding NART: theta_mean ~ RAVLT_T + BVMT_T + RPM_T"
        - "Compare R² with and without NART (expect minimal change if NART weak)"
        - "Compute Cohen's f² = R²/(1-R²) for effect size interpretation"
        - "Calculate semi-partial correlations (sr²) for unique variance per predictor"
        - "Rank predictors by |standardized_beta| magnitude"
        - "Test hypothesis: RAVLT_beta > RPM_beta (episodic > intelligence)"
        - "Compute post-hoc power analysis using statsmodels.stats.power"

      input_files:
        - path: "results/ch7/7.1.1/data/step03_analysis_dataset.csv"
          required_columns: ["RAVLT_T", "BVMT_T", "NART_T", "RPM_T", "theta_mean"]
