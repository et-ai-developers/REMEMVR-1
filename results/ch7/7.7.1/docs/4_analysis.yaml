    - "results/ch7/7.7.1/logs/step04_bidirectional_comparison.log"
    - "results/ch7/7.7.1/logs/step05_effect_sizes.log"
    - "results/ch7/7.7.1/logs/step06_diagnostics.log"
    - "results/ch7/7.7.1/logs/step07_cross_validation.log"
