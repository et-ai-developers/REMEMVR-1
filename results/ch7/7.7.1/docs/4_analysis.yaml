metadata:
  rq_id: "ch7/7.7.1"
  verification_level: "deep_v5.3.0"
  module_corrections: 8
  validator_corrections: 4  
  format_corrections: 2
  path_corrections: 15
  critical_data_source_fix: "master.xlsx -> dfnonvr.csv (Ch7 rule)"
  
analysis_type: "Multiple Linear Regression (Reverse Prediction)"
description: "Bidirectional analysis: REMEMVR predicting cognitive tests vs traditional direction"

steps:
  - name: "step00_validate_dependencies" 
    step_number: 0
    description: "Verify Ch5 5.1.1 theta outputs and dfnonvr.csv accessibility"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: Union[str, Path], min_size_bytes: int = 0) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch5/5.1.1/status.yaml"
        description: "Ch5 completion status"
        required: true
      - path: "results/ch5/5.1.1/data/step03_theta_scores.csv" 
        description: "Theta_All scores from omnibus IRT"
        required: true
      - path: "data/dfnonvr.csv"
        description: "Participant cognitive test data - NEVER master.xlsx in Ch7"
        required: true
        
    output_files:
      - path: "results/ch7/7.7.1/data/step00_dependency_validation.txt"
        description: "Dependency check results with pass/fail status"
        
    parameters:
      files_to_check:
        - "results/ch5/5.1.1/status.yaml"
        - "results/ch5/5.1.1/data/step03_theta_scores.csv"
        - "data/dfnonvr.csv"
      min_size_bytes: 500
      
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"

  - name: "step01_extract_and_merge_data"
    step_number: 1  
    description: "Extract theta_All and cognitive scores, merge by UID"
    
    analysis_call:
      type: "stdlib_operations"
      operations:
        - operation: "load_theta_data"
          function: "pd.read_csv"
          params: 
            filepath_or_buffer: "results/ch5/5.1.1/data/step03_theta_scores.csv"
          description: "Load theta scores (test-level data)"
          
        - operation: "aggregate_theta"
          function: "groupby_mean"  
          params:
            by: "UID"
            columns: ["Theta_All"]
          description: "Average theta across 4 tests per participant"
          
        - operation: "load_cognitive_data"
          function: "pd.read_csv"
          params:
            filepath_or_buffer: "data/dfnonvr.csv"
          description: "Load participant cognitive data from dfnonvr.csv"
          
        - operation: "extract_cognitive_scores"
          function: "calculate_totals"
          params:
            ravlt_columns: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score"]
            bvmt_columns: ["bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score"]
          description: "Compute RAVLT total (sum trials 1-5) and BVMT total (sum trials 1-3)"
          
        - operation: "merge_datasets"
          function: "pd.merge"
          params:
            on: "UID"
            how: "inner"
          description: "Merge theta and cognitive data by participant UID"
          
    input_files:
      - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
        required_columns: ["UID", "test", "Theta_All"]
        description: "Test-level theta scores from Ch5 5.1.1"
      - path: "data/dfnonvr.csv"
        required_columns: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score"]
        description: "Participant cognitive test data - exact column names from DATA_DICTIONARY.md"
        
    output_files:
      - path: "results/ch7/7.7.1/data/step01_merged_dataset.csv"
        columns: ["UID", "theta_all_mean", "ravlt_total", "bvmt_total"]
        description: "Merged theta and cognitive scores by UID"
        
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"

  - name: "step02_standardize_variables"
    step_number: 2
    description: "Convert all variables to T-scores (M=50, SD=10) for meaningful comparison"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "standardize_to_t_scores"
      signature: "standardize_to_t_scores(scores: Union[np.ndarray, pd.Series], population_mean: float, population_sd: float) -> Union[np.ndarray, pd.Series]"
      
    input_files:
      - path: "results/ch7/7.7.1/data/step01_merged_dataset.csv"
        required_columns: ["UID", "theta_all_mean", "ravlt_total", "bvmt_total"]
        description: "Merged raw scores"
        
    output_files:
      - path: "results/ch7/7.7.1/data/step02_standardized_data.csv"
        columns: ["UID", "REMEMVR_T", "RAVLT_T", "BVMT_T"]
        description: "T-score transformed variables (M=50, SD=10)"
        
    parameters:
      target_mean: 50.0
      target_sd: 10.0
      columns_to_transform: ["theta_all_mean", "ravlt_total", "bvmt_total"]
      new_column_names: ["REMEMVR_T", "RAVLT_T", "BVMT_T"]
      
    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(df: pd.DataFrame, column_names: List[str], target_mean: float = 50.0, target_sd: float = 10.0) -> Dict[str, Any]"

  - name: "step03_fit_reverse_models"
    step_number: 3
    description: "Fit reverse regression models (cognitive ~ REMEMVR) with bootstrap CIs"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], feature_names: Optional[List[str]] = None) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch7/7.7.1/data/step02_standardized_data.csv"
        required_columns: ["UID", "REMEMVR_T", "RAVLT_T", "BVMT_T"]
        description: "T-scored variables"
        
    output_files:
      - path: "results/ch7/7.7.1/data/step03_reverse_models.csv"
        columns: ["model", "outcome", "predictor", "R2", "adj_R2", "beta", "se", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni"]
        description: "Reverse regression results with bootstrap CIs and dual p-values"
        
    parameters:
      models:
        - outcome: "RAVLT_T"
          predictor: "REMEMVR_T"
          name: "RAVLT_reverse"
        - outcome: "BVMT_T"
          predictor: "REMEMVR_T"
          name: "BVMT_reverse"
      bootstrap_iterations: 1000
      random_seed: 42
      confidence_level: 0.95
      bonferroni_alpha: 0.025  # 0.05/2 models
      
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float) -> Dict[str, Any]"

  - name: "step04_extract_forward_results" 
    step_number: 4
    description: "Extract forward prediction results from RQ 7.1.1 for bidirectional comparison"
    
    analysis_call:
      type: "stdlib_operations"
      operations:
        - operation: "check_forward_availability"
          function: "os.path.exists"
          params:
            path: "results/ch7/7.1.1/data/step03_forward_models.csv"
          description: "Check if RQ 7.1.1 forward results available"
          
        - operation: "load_forward_if_available"
          function: "pd.read_csv"
          params:
            filepath_or_buffer: "results/ch7/7.1.1/data/step03_forward_models.csv"
            if_missing: "proceed_reverse_only"
          description: "Load forward results if available"
          
        - operation: "compute_asymmetry_ratios"
          function: "calculate_ratios"
          params:
            ratio_formula: "forward_R2 / reverse_R2"
          description: "Compute bidirectional asymmetry ratios"
          
    input_files:
      - path: "results/ch7/7.7.1/data/step03_reverse_models.csv"
        required_columns: ["model", "R2"]
        description: "Reverse prediction R-squared values"
      - path: "results/ch7/7.1.1/data/step03_forward_models.csv"
        required_columns: ["model", "R2"]
        description: "Forward prediction results (optional)"
        required: false
        
    output_files:
      - path: "results/ch7/7.7.1/data/step04_bidirectional_comparison.csv"
        columns: ["test", "forward_R2", "reverse_R2", "asymmetry_ratio", "williams_t", "williams_p"]
        description: "Forward vs reverse prediction comparison"
        
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range" 
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float) -> Dict[str, Any]"

  - name: "step05_compute_effect_sizes"
    step_number: 5
    description: "Compute Cohen's f² effect sizes with bootstrap confidence intervals"
    
    analysis_call:
      type: "stdlib_operations"
      operations:
        - operation: "compute_cohens_f2"
          function: "calculate_effect_size"
          params:
            formula: "R2 / (1 - R2)"
            effect_size_type: "cohens_f2"
          description: "Cohen's f² calculation from R-squared values"
          
        - operation: "bootstrap_effect_sizes"
          function: "bootstrap_statistic"
          params:
            statistic: "cohens_f2"
            n_bootstrap: 1000
            random_seed: 42
            confidence_level: 0.95
          description: "Bootstrap confidence intervals for effect sizes"
          
        - operation: "interpret_effect_sizes"
          function: "apply_cohen_criteria"
          params:
            thresholds:
              small: 0.02
              medium: 0.15
              large: 0.35
          description: "Effect size interpretation using Cohen's benchmarks"
          
    input_files:
      - path: "results/ch7/7.7.1/data/step03_reverse_models.csv"
        required_columns: ["model", "R2"]
        description: "Regression results for effect size computation"
      - path: "results/ch7/7.7.1/data/step02_standardized_data.csv"
        required_columns: ["REMEMVR_T", "RAVLT_T", "BVMT_T"]
        description: "Data for bootstrap resampling"
        
    output_files:
      - path: "results/ch7/7.7.1/data/step05_effect_sizes.csv"
        columns: ["model", "cohens_f2", "f2_ci_lower", "f2_ci_upper", "semipartial_r", "sr_ci_lower", "sr_ci_upper", "effect_interpretation"]
        description: "Cohen's f² and semi-partial correlations with CIs"
        
    validation_call:
      module: "tools.validation"
      function: "validate_effect_sizes"
      signature: "validate_effect_sizes(effect_sizes_df: pd.DataFrame, f2_column: str = 'cohens_f2') -> Dict[str, Any]"

  - name: "step06_model_diagnostics"
    step_number: 6
    description: "Comprehensive regression assumption validation with remedial actions"
    
    analysis_call:
      type: "stdlib_operations"
      operations:
        - operation: "test_normality"
          function: "scipy.stats.shapiro"
          params:
            alpha: 0.05
          description: "Shapiro-Wilk test for residual normality"
          
        - operation: "test_homoscedasticity"
          function: "scipy.stats.breusch_pagan"
          params:
            alpha: 0.05
          description: "Breusch-Pagan test for homoscedasticity"
          
        - operation: "detect_outliers"
          function: "compute_cooks_distance"
          params:
            threshold: 0.042  # 4/n where n~95
          description: "Cook's distance for influential observations"
          
        - operation: "apply_remedial_actions"
          function: "handle_violations"
          params:
            normality_violation: "report_bootstrap_CIs_primary"
            heteroscedasticity_violation: "compute_HC3_robust_SE"
            outliers_detected: "sensitivity_analysis_with_without"
          description: "Remedial actions for assumption violations"
          
    input_files:
      - path: "results/ch7/7.7.1/data/step02_standardized_data.csv"
        required_columns: ["REMEMVR_T", "RAVLT_T", "BVMT_T"]
        description: "Data for residual analysis"
        
    output_files:
      - path: "results/ch7/7.7.1/data/step06_model_diagnostics.csv"
        columns: ["model", "normality_p", "bp_test_p", "max_cooks_d", "outlier_count", "assumptions_met", "remedial_action"]
        description: "Assumption test results with remedial actions"
        
    validation_call:
      module: "tools.validation"
      function: "validate_model_convergence"
      signature: "validate_model_convergence(lmm_result: Any) -> Dict"

  - name: "step07_cross_validation"
    step_number: 7
    description: "5-fold cross-validation to assess model generalizability and overfitting"
    
    analysis_call:
      type: "stdlib_operations"
      operations:
        - operation: "setup_cv"
          function: "sklearn.model_selection.KFold"
          params:
            n_splits: 5
            shuffle: true
            random_state: 42
          description: "Setup 5-fold cross-validation"
          
        - operation: "perform_cv"
          function: "cross_validate_models"
          params:
            scoring: ["r2", "neg_mean_squared_error", "neg_mean_absolute_error"]
            return_train_score: true
          description: "Cross-validation with multiple metrics"
          
        - operation: "assess_overfitting"
          function: "compare_train_test"
          params:
            overfitting_threshold: 0.10
          description: "Detect overfitting (train-test R² gap > 0.10)"
          
    input_files:
      - path: "results/ch7/7.7.1/data/step02_standardized_data.csv"
        required_columns: ["REMEMVR_T", "RAVLT_T", "BVMT_T"]
        description: "Data for cross-validation"
        
    output_files:
      - path: "results/ch7/7.7.1/data/step07_cross_validation.csv"
        columns: ["model", "mean_test_R2", "sd_test_R2", "train_R2", "generalization_gap", "rmse_mean", "mae_mean", "overfitting_flag"]
        description: "CV metrics and overfitting assessment"
        
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float) -> Dict[str, Any]"

  - name: "step08_significance_power"
    step_number: 8
    description: "Multiple comparison corrections and post-hoc power analysis"
    
    analysis_call:
      type: "stdlib_operations"
      operations:
        - operation: "apply_corrections"
          function: "multiple_comparison_corrections"
          params:
            family_alpha: 0.05
            within_rq_tests: 2  # RAVLT and BVMT models
            bonferroni_alpha: 0.025  # 0.05/2
            chapter_alpha: 0.00179  # 0.05/28 for Ch7 context
          description: "Multiple comparison corrections (Decision D068)"
          
        - operation: "compute_power"
          function: "statsmodels.stats.power.FTestAnovaPower"
          params:
            effect_size_type: "cohens_f2"
            alpha_levels: [0.05, 0.025, 0.00179]
            sample_size: 100
            predictors: 1
          description: "Post-hoc power analysis for observed effect sizes"
          
        - operation: "sensitivity_analysis"
          function: "minimum_detectable_effect"
          params:
            power: 0.80
            alpha: 0.05
          description: "Minimum detectable f² at 80% power"
          
    input_files:
      - path: "results/ch7/7.7.1/data/step03_reverse_models.csv"
        required_columns: ["model", "p_uncorrected"]
        description: "Uncorrected p-values for correction"
      - path: "results/ch7/7.7.1/data/step05_effect_sizes.csv"
        required_columns: ["model", "cohens_f2"]
        description: "Observed effect sizes for power analysis"
        
    output_files:
      - path: "results/ch7/7.7.1/data/step08_significance_power.csv"
        columns: ["model", "p_uncorrected", "p_bonferroni", "p_chapter", "p_fdr", "achieved_power", "min_detectable_f2", "power_adequate"]
        description: "Corrected p-values and power analysis results"
        
    validation_call:
      module: "tools.validation"
      function: "validate_correlation_test_d068"
      signature: "validate_correlation_test_d068(correlation_df: pd.DataFrame, required_cols: Optional[List[str]] = None) -> Dict[str, Any]"

# Expected outputs summary
expected_outputs:
  data_files:
    - "results/ch7/7.7.1/data/step00_dependency_validation.txt"
    - "results/ch7/7.7.1/data/step01_merged_dataset.csv" 
