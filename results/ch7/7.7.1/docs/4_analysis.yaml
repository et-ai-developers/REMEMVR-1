  cognitive_columns:
    ravlt_total: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score"]
    bvmt_total: ["bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score"]
  note: "Column names use lowercase with hyphens as per DATA_DICTIONARY.md"

