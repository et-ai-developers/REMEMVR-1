        description: "Group assignments for all participants"
        expected_columns: ["UID", "Discrepancy", "Group"]
      - path: "results/ch7/7.7.2/data/step03_group_descriptives.csv"  # CORRECTED: Hierarchical path
        description: "Descriptive statistics by group"
        expected_columns: ["Group", "n", "mean", "std", "min", "max"]
      - path: "results/ch7/7.7.2/data/step03_sensitivity_analysis.csv"  # CORRECTED: Hierarchical path
        description: "Group sizes under alternative cutoffs"
        
    parameters:
      cutoff_sd: 1.0
      alternative_cutoffs: [0.75, 1.25]
      min_group_size: 10
      
    validation_call:
