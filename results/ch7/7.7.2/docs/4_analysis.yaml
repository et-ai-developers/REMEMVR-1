  - name: "step01_extract_and_standardize_scores"
    step_number: 1
    description: "Load theta scores from Ch5 and RAVLT scores from dfnonvr.csv, standardize both to z-scores"
    dependencies: ["step00_validate_dependencies"]
    
    analysis_call:
      type: "stdlib"
      # CORRECTED: Use existing standardize_scores function with proper module
      operation: "load_merge_standardize"
      imports:
        - "import pandas as pd"
        - "import numpy as np"
        - "from scipy import stats"
        - "from tools.analysis_extensions import standardize_scores"  # VERIFIED: Function exists here
      
      code_template: |
        # Load validation results to get file paths
        with open("results/ch7/7.7.2/data/step00_dependency_validation.txt", 'r') as f:
            validation_text = f.read()
        
        # Extract theta file path from validation
        import re
        theta_match = re.search(r'theta_file[:\s]+([^\n\s]+)', validation_text)
        theta_path = theta_match.group(1) if theta_match else "results/ch5/5.1.1/data/step03_theta_scores.csv"
        
        # Load Ch5 theta scores
        theta_df = pd.read_csv(theta_path)
        
        # Find theta column (may be named differently)
        theta_col = None
        for col in theta_df.columns:
            if 'theta' in col.lower() and ('omnibus' in col.lower() or 'all' in col.lower()):
                theta_col = col
                break
        if theta_col is None:
            theta_col = [c for c in theta_df.columns if 'theta' in c.lower()][0]
        
        # Load dfnonvr.csv for RAVLT data (CRITICAL: Using prepared CSV data)
        dfnonvr = pd.read_csv("data/dfnonvr.csv")
        
        # Calculate RAVLT total from individual trials using exact column names
        ravlt_cols = [
            "ravlt-trial-1-score",
            "ravlt-trial-2-score", 
            "ravlt-trial-3-score",
            "ravlt-trial-4-score",
            "ravlt-trial-5-score"
        ]
        
        # Check if RAVLT columns exist
        missing_ravlt = [col for col in ravlt_cols if col not in dfnonvr.columns]
        if missing_ravlt:
            raise ValueError(f"Missing RAVLT columns in dfnonvr.csv: {missing_ravlt}")
        
        dfnonvr['RAVLT_Total'] = dfnonvr[ravlt_cols].sum(axis=1)
        
        # Merge on UID
        merged = theta_df[['UID', theta_col]].merge(
            dfnonvr[['UID', 'RAVLT_Total']], 
            on='UID', 
            how='inner'
        )
        
        # Rename theta column for clarity
        merged = merged.rename(columns={theta_col: 'theta_raw'})
        merged['RAVLT_raw'] = merged['RAVLT_Total']
        
        # Standardize both measures using sample statistics
        merged['REMEMVR_z'] = stats.zscore(merged['theta_raw'])
        merged['RAVLT_z'] = stats.zscore(merged['RAVLT_raw'])
        
        # Bootstrap 95% CIs for standardization parameters
        n_iterations = 1000
        np.random.seed(42)
        
        rememvr_means = []
        rememvr_sds = []
        ravlt_means = []
        ravlt_sds = []
        
        for i in range(n_iterations):
            # Resample participants with replacement
            boot_indices = np.random.choice(len(merged), size=len(merged), replace=True)
            boot_sample = merged.iloc[boot_indices]
            
            rememvr_means.append(boot_sample['theta_raw'].mean())
            rememvr_sds.append(boot_sample['theta_raw'].std())
            ravlt_means.append(boot_sample['RAVLT_raw'].mean()) 
            ravlt_sds.append(boot_sample['RAVLT_raw'].std())
        
        # Calculate percentile CIs
        rememvr_mean_ci = np.percentile(rememvr_means, [2.5, 97.5])
        rememvr_sd_ci = np.percentile(rememvr_sds, [2.5, 97.5])
        ravlt_mean_ci = np.percentile(ravlt_means, [2.5, 97.5])
        ravlt_sd_ci = np.percentile(ravlt_sds, [2.5, 97.5])
        
        # Create standardization statistics
        stats_df = pd.DataFrame({
            'measure': ['REMEMVR', 'RAVLT'],
            'mean': [merged['theta_raw'].mean(), merged['RAVLT_raw'].mean()],
            'sd': [merged['theta_raw'].std(), merged['RAVLT_raw'].std()],
            'mean_ci_lower': [rememvr_mean_ci[0], ravlt_mean_ci[0]], 
            'mean_ci_upper': [rememvr_mean_ci[1], ravlt_mean_ci[1]],
            'sd_ci_lower': [rememvr_sd_ci[0], ravlt_sd_ci[0]],
            'sd_ci_upper': [rememvr_sd_ci[1], ravlt_sd_ci[1]]
        })
        
        # Check normality
        shapiro_rememvr = stats.shapiro(merged['REMEMVR_z'])
        shapiro_ravlt = stats.shapiro(merged['RAVLT_z'])
        
        # Final dataset with required columns
        final_df = merged[['UID', 'theta_raw', 'RAVLT_raw', 'REMEMVR_z', 'RAVLT_z']]
    
    input_files:
