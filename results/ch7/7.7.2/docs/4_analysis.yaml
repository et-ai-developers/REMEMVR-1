  - name: "step03_create_discrepancy_groups"
    step_number: 3
    description: "Classify participants into three groups based on ±1 SD discrepancy cutoffs"
    dependencies: ["step02_compute_discrepancy_scores"]
    
    analysis_call:
      type: "stdlib"
      # CORRECTED: Function doesn't exist, use stdlib implementation
      operation: "group_by_cutoffs"
      imports:
        - "import pandas as pd"
        - "import numpy as np"
      
      code_template: |
        # Load discrepancy scores
        df = pd.read_csv("results/ch7/7.7.2/data/step02_discrepancy_scores.csv")
        
        # Calculate cutoffs based on sample SD
        discrepancy_mean = df['Discrepancy'].mean()
        discrepancy_sd = df['Discrepancy'].std()
        
        upper_cutoff = discrepancy_mean + 1.0 * discrepancy_sd  # +1 SD
        lower_cutoff = discrepancy_mean - 1.0 * discrepancy_sd  # -1 SD
        
        # Assign groups
        def assign_group(discrepancy):
            if discrepancy > upper_cutoff:
                return "VR-favored"
            elif discrepancy < lower_cutoff:
                return "RAVLT-favored"
            else:
                return "Concordant"
        
        df['Group'] = df['Discrepancy'].apply(assign_group)
        
        # Calculate group descriptives
        group_desc = df.groupby('Group')['Discrepancy'].agg([
            'count', 'mean', 'std', 'min', 'max'
        ]).rename(columns={'count': 'n'}).reset_index()
        
        # Sensitivity analysis with alternative cutoffs
        alt_cutoffs = [0.75, 1.25]
        sensitivity_results = []
        
        for cutoff_sd in alt_cutoffs:
            alt_upper = discrepancy_mean + cutoff_sd * discrepancy_sd
            alt_lower = discrepancy_mean - cutoff_sd * discrepancy_sd
            
            alt_groups = df['Discrepancy'].apply(
                lambda x: "VR-favored" if x > alt_upper 
                         else "RAVLT-favored" if x < alt_lower 
                         else "Concordant"
            )
            
            group_counts = alt_groups.value_counts()
            
            sensitivity_results.append({
                'cutoff_sd': cutoff_sd,
                'vr_favored_n': group_counts.get('VR-favored', 0),
                'ravlt_favored_n': group_counts.get('RAVLT-favored', 0), 
                'concordant_n': group_counts.get('Concordant', 0)
            })
        
        # Add primary analysis results
        primary_counts = df['Group'].value_counts()
        sensitivity_results.insert(0, {
            'cutoff_sd': 1.0,
            'vr_favored_n': primary_counts.get('VR-favored', 0),
            'ravlt_favored_n': primary_counts.get('RAVLT-favored', 0),
            'concordant_n': primary_counts.get('Concordant', 0)
        })
        
        sensitivity_df = pd.DataFrame(sensitivity_results)
        
        # Check minimum group sizes
        min_group_size = 10
        for group in ['VR-favored', 'RAVLT-favored', 'Concordant']:
            group_n = primary_counts.get(group, 0)
            if group_n < min_group_size:
                print(f"WARNING: {group} group has only {group_n} participants (< {min_group_size})")
    
    input_files:
      - path: "results/ch7/7.7.2/data/step02_discrepancy_scores.csv"  # CORRECTED: Hierarchical path
        description: "Discrepancy scores from step 2"
        
    output_files:
