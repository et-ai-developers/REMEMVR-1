  - name: "step04_extract_demographic_predictors"
    step_number: 4
    description: "Extract demographic variables from dfnonvr.csv and merge with group assignments"
    dependencies: ["step03_create_discrepancy_groups"]
    
    analysis_call:
      type: "stdlib"
      # CORRECTED: Function doesn't exist, use stdlib with exact column names
      operation: "extract_and_merge_demographics" 
      imports:
        - "import pandas as pd"
        - "import numpy as np"
      
      code_template: |
        # Load group assignments
        groups_df = pd.read_csv("results/ch7/7.7.2/data/step03_group_assignments.csv")
        
        # Load dfnonvr.csv with exact column names from DATA_DICTIONARY.md
        dfnonvr = pd.read_csv("data/dfnonvr.csv")
        
        # Extract required variables with exact column names
        demographic_vars = {
            'Age': 'age',  # Exact column name in dfnonvr.csv
            'Education': 'education',  # Exact column name 
            'VR_Experience': 'vr-exposure',  # Exact column name in dfnonvr.csv
            'NART': 'nart-score',  # Exact column name - WARNING: May have missing values
            'BVMT': 'bvmt-total-recall',  # Exact column name in dfnonvr.csv
        }
        
        # Check which columns actually exist
        available_vars = {}
        missing_vars = []
        
        for var_name, col_name in demographic_vars.items():
            if col_name in dfnonvr.columns:
                available_vars[var_name] = col_name
            else:
                missing_vars.append(f"{var_name} (expected column: {col_name})")
        
        if missing_vars:
            print(f"WARNING: Missing variables in dfnonvr.csv: {missing_vars}")
        
        # Extract available demographic data
        demo_cols = ['UID'] + list(available_vars.values())
        demo_df = dfnonvr[demo_cols].copy()
        
        # Rename columns to standard names
        rename_map = {v: k for k, v in available_vars.items()}
        demo_df = demo_df.rename(columns=rename_map)
        
        # Merge with group assignments
        merged_df = groups_df.merge(demo_df, on='UID', how='left')
        
        # Check for missing data
        missing_report = []
        for var in available_vars.keys():
            if var in merged_df.columns:
                n_missing = merged_df[var].isna().sum()
                percent_missing = (n_missing / len(merged_df)) * 100
                missing_report.append({
                    'variable': var,
                    'n_missing': n_missing,
                    'percent_missing': percent_missing,
                    'pattern': 'random' if n_missing > 0 else 'complete'
                })
        
        missing_df = pd.DataFrame(missing_report)
        
        # Exclude variables with >15% missing data
        valid_vars = []
        for var in available_vars.keys():
            if var in merged_df.columns:
                missing_pct = (merged_df[var].isna().sum() / len(merged_df)) * 100
                if missing_pct <= 15.0:
                    valid_vars.append(var)
                else:
                    print(f"WARNING: Excluding {var} due to {missing_pct:.1f}% missing data")
        
        # Final demographic data with valid variables only
        final_cols = ['UID', 'Group', 'Discrepancy'] + valid_vars
        final_df = merged_df[final_cols].copy()
        
        # Compute by-group descriptive statistics for valid variables
        descriptive_results = []
        for var in valid_vars:
            group_stats = final_df.groupby('Group')[var].agg([
                'count', 'mean', 'std', 'median', 
                lambda x: x.quantile(0.25), lambda x: x.quantile(0.75)
            ]).rename(columns={'<lambda_0>': 'q1', '<lambda_1>': 'q3'})
            group_stats['variable'] = var
            group_stats['iqr'] = group_stats['q3'] - group_stats['q1']
            descriptive_results.append(group_stats.reset_index())
        
        if descriptive_results:
            descriptives_df = pd.concat(descriptive_results, ignore_index=True)
            descriptives_df = descriptives_df[['Group', 'variable', 'count', 'mean', 'std', 'median', 'q1', 'q3', 'iqr']]
            descriptives_df = descriptives_df.rename(columns={'count': 'n'})
        else:
            # Create empty descriptives if no valid variables
            descriptives_df = pd.DataFrame(columns=['Group', 'variable', 'n', 'mean', 'std', 'median', 'q1', 'q3', 'iqr'])
    
    input_files:
      - path: "results/ch7/7.7.2/data/step03_group_assignments.csv"  # CORRECTED: Hierarchical path
        description: "Group classifications from step 3"
      - path: "data/dfnonvr.csv"  # CORRECTED: Use prepared CSV data
        description: "Participant demographics with exact column names"
        required_columns: ["UID", "age", "education", "vr-exposure"]  # Using exact dfnonvr.csv column names
        
    output_files:
