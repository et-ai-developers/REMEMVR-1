        - "Extract individual predictor p-values (RAVLT_T, BVMT_T, RPM_T)"
        - "Apply Bonferroni correction: alpha = 0.05/6 (3 predictors × 2 outcomes)"
        - "Create significance flags for both uncorrected and corrected p-values"
        - "Generate effect interpretation (direction and magnitude)"

      input_files:
        - path: "results/ch7/7.1.2/data/step03_intercept_predictions.csv"
