          row_count: 6
          variable_name: "predictor_significance"
          description: "Individual predictor significance with dual p-values per Decision D068"

    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_hypothesis_test_dual_pvalues"
      signature: "validate_hypothesis_test_dual_pvalues(interaction_df: DataFrame, required_terms: List[str], alpha_bonferroni: float = 0.05) -> Dict[str, Any]"

      input_files:
        - path: "results/ch7/7.1.2/data/step06_predictor_significance.csv"
          variable_name: "predictor_significance"
          source: "pandas analysis (dual p-value computation)"

      parameters:
        interaction_df: "predictor_significance"
        required_terms: ["RAVLT_T", "BVMT_T", "RPM_T"]
        alpha_bonferroni: 0.0083

      criteria:
        - "All 6 predictor-outcome combinations present"
        - "Dual p-value reporting: p_uncorrected AND p_bonferroni"
        - "Bonferroni correction factor = 6 (3 predictors × 2 outcomes)"
        - "Significance flags correctly computed"
        - "Effect interpretations provided for all predictors"

      on_failure:
        action: "raise ValueError(validation_result['message'])"
        log_to: "results/ch7/7.1.2/logs/step06_test_predictor_significance.log"

    log_file: "results/ch7/7.1.2/logs/step06_test_predictor_significance.log"

  # --------------------------------------------------------------------------
  # STEP 7: Create Model Diagnostics Summary
  # --------------------------------------------------------------------------
  - name: "step07_model_diagnostics"
    step_number: "07"
    description: "Comprehensive regression diagnostics and assumption testing"

    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_regression_diagnostics"
      signature: "compute_regression_diagnostics(model: sm.regression.linear_model.RegressionResultsWrapper, X: Union[np.ndarray, pd.DataFrame], return_dataframe: bool = True) -> Dict[str, Any]"

      input_files:
        - path: "results/ch7/7.1.2/data/step02_regression_input.csv"
          required_columns: ["intercept", "slope", "RAVLT_T", "BVMT_T", "RPM_T"]
          variable_name: "regression_input"
          source: "step02 merge output (for residuals analysis)"

      output_files:
        - path: "results/ch7/7.1.2/data/step07_model_diagnostics.csv"
          format: "CSV with UTF-8 encoding"
          columns:
            - {name: "model", type: "str", description: "Model type (intercept or slope)"}
            - {name: "test", type: "str", description: "Diagnostic test name"}
            - {name: "statistic", type: "float64", description: "Test statistic value"}
            - {name: "p_value", type: "float64", description: "Diagnostic test p-value"}
            - {name: "assumption_met", type: "int", description: "Binary assumption pass/fail"}
            - {name: "remedial_action", type: "str", description: "Recommended action if assumption violated"}
          row_count: 12
          variable_name: "diagnostics_summary"
          description: "Comprehensive regression diagnostics for both models"

      parameters:
        model: "fitted_models"
        X: "regression_input[['RAVLT_T', 'BVMT_T', 'RPM_T']]"
        return_dataframe: true

    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: np.ndarray or pd.Series, min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"

      input_files:
        - path: "results/ch7/7.1.2/data/step07_model_diagnostics.csv"
          variable_name: "diagnostics_summary"
          source: "analysis call output (compute_regression_diagnostics)"

      parameters:
        data: "diagnostics_summary['p_value']"
        min_val: 0.0
        max_val: 1.0
        column_name: "p_value"

      criteria:
        - "All diagnostic test p-values in range [0, 1]"
        - "Both models represented (intercept and slope)"
        - "Key tests present: normality, homoscedasticity, VIF, Cook's D"
        - "Assumption flags correctly computed"
        - "Remedial actions provided for violations"

      on_failure:
        action: "raise ValueError(validation_result['message'])"
        log_to: "results/ch7/7.1.2/logs/step07_model_diagnostics.log"

    log_file: "results/ch7/7.1.2/logs/step07_model_diagnostics.log"

