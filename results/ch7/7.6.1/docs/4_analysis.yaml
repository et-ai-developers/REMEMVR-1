# ============================================================================
# ANALYSIS RECIPE - DEEPLY VERIFIED AND COMPLETE v5.3.0
# ============================================================================
# Generated: 2026-01-05T13:00:00Z
# RQ: ch7/7.6.1 - Cognitive Tests Predicting Individual Differences in Forgetting Rate
# Agent: rq_analysis v5.3.0
# 
# v5.3.0 Deep Verification Summary:
#   ✅ Module paths corrected and verified (2 corrections)
#   ✅ Data sources corrected to dfnonvr.csv (CRITICAL: NO master.xlsx)
#   ✅ Column names mapped to exact DATA_DICTIONARY.md specifications
#   ✅ All paths converted to hierarchical structure
#   ✅ Ch5 5.1.4 dependency verified (step04_random_effects.csv exists)
#   ✅ All function signatures verified against actual code
# ============================================================================

metadata:
  rq_id: "ch7/7.6.1"
  verification_level: "deep_v5.3.0"
  corrections_applied:
    module_corrections: 2
    data_source_corrections: 1
    path_corrections: 20
  critical_decisions:
    - "D068: Dual p-value reporting (uncorrected + corrected)"
    - "v5.3.0: dfnonvr.csv ONLY for Ch7 cognitive data"
    - "v5.3.0: Exact column name mapping from DATA_DICTIONARY.md"

# ============================================================================
# ANALYSIS STEPS - SEQUENTIAL EXECUTION
# ============================================================================

steps:

  # ==========================================================================
  # STEP 0: Validate Cross-RQ Dependencies  
  # ==========================================================================
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Verify Ch5 5.1.4 slope outputs and dfnonvr.csv cognitive data availability"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: Union[str, Path], min_size_bytes: int = 0) -> Dict[str, Any]"
      
    parameters:
      files_to_check:
        - file_path: "results/ch5/5.1.4/status.yaml"
          min_size_bytes: 100
          check_content: "rq_results: success"
        - file_path: "results/ch5/5.1.4/data/step04_random_effects.csv" 
          min_size_bytes: 1000
          expected_columns: ["UID", "random_slope"]
        - file_path: "data/dfnonvr.csv"
          min_size_bytes: 10000
          expected_columns: ["UID", "ravlt-trial-1-score", "bvmt-trial-1-score", "rpm-score"]
    
    input_files: []
    
    output_files:
      - path: "results/ch7/7.6.1/data/step00_dependency_validation.txt"
        description: "Text report of dependency validation results"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
    
    log_file: "results/ch7/7.6.1/logs/step00_validate_dependencies.log"

  # ==========================================================================
  # STEP 1: Extract Cognitive Test Data from dfnonvr.csv
  # ==========================================================================
  - name: "step01_extract_cognitive_tests"  
    step_number: 1
    description: "Extract cognitive test scores from dfnonvr.csv and convert to composite scores"
    dependencies: ["step00_validate_dependencies"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_cognitive_tests"
      signature: "extract_cognitive_tests(df: pd.DataFrame, tests: List[str] = None) -> pd.DataFrame"
      
    parameters:
      # v5.3.0 CRITICAL: Use exact column names from DATA_DICTIONARY.md
      cognitive_test_mapping:
        RAVLT:
          columns: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", 
                   "ravlt-trial-4-score", "ravlt-trial-5-score"]
          composite: "sum"  # Sum of learning trials 1-5
        BVMT:
          columns: ["bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score"]
          composite: "sum"  # Sum of learning trials 1-3
        RPM:
          columns: ["rpm-score"]
          composite: "direct"  # Use raw score directly
      demographic_columns: ["age", "sex", "education"]
      t_score_conversion: true
      sex_coding: {"M": 0, "F": 1}  # Recode if needed
    
    input_files:
      - path: "data/dfnonvr.csv"
        required_columns: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score",
                          "ravlt-trial-4-score", "ravlt-trial-5-score", "bvmt-trial-1-score", 
                          "bvmt-trial-2-score", "bvmt-trial-3-score", "rpm-score", "age", "sex", "education"]
    
    output_files:
      - path: "results/ch7/7.6.1/data/step01_cognitive_tests.csv"
        columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "age", "sex", "education", "missing_data_count"]
        description: "Cognitive test T-scores with demographics"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      parameters:
        t_score_range: [20, 80]
        expected_participants: 100
    
    log_file: "results/ch7/7.6.1/logs/step01_extract_cognitive_tests.log"

  # ==========================================================================
  # STEP 2: Extract Individual Slope Estimates from Ch5
  # ==========================================================================
  - name: "step02_extract_slopes"
    step_number: 2
    description: "Extract per-participant slope estimates from Ch5 5.1.4 model-averaged results"
    dependencies: ["step01_extract_cognitive_tests"]
    
    analysis_call:
      type: "custom_extraction"  
      operation: "pandas_csv_read"
      description: "Direct CSV read and column selection for slope data"
      
    parameters:
      source_file: "results/ch5/5.1.4/data/step04_random_effects.csv"
      columns_to_extract: ["UID", "random_slope"]
      rename_columns:
        random_slope: "slope"
      validation_checks:
        slope_range: [-0.5, 0.1]  # Forgetting rates (negative expected)
        required_participants: 100
    
    input_files:
      - path: "results/ch5/5.1.4/data/step04_random_effects.csv"
        required_columns: ["UID", "random_slope"]
    
    output_files:
      - path: "results/ch7/7.6.1/data/step02_slopes_extracted.csv"
        columns: ["UID", "slope"]
        description: "Individual slope estimates from Ch5 5.1.4"
    
    validation_call:
      module: "tools.validation" 
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      parameters:
        slope_range: [-0.5, 0.1]
        expected_participants: 100
    
    log_file: "results/ch7/7.6.1/logs/step02_extract_slopes.log"

  # ==========================================================================
  # STEP 3: Merge Datasets and Standardize Predictors
  # ==========================================================================
  - name: "step03_merge_and_standardize"
    step_number: 3
    description: "Merge cognitive tests with slopes and standardize continuous predictors"
    dependencies: ["step01_extract_cognitive_tests", "step02_extract_slopes"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_extensions"
      function: "standardize_scores"
      signature: "standardize_scores(scores: Union[pd.Series, pd.DataFrame], reference_mean: float = None, reference_sd: float = None) -> Union[pd.Series, pd.DataFrame]"
      
    parameters:
      merge_on: "UID"
      merge_how: "inner"  # Keep only participants in both datasets
      standardize_columns: ["age", "education", "RAVLT_T", "BVMT_T", "RPM_T"]
      exclude_from_standardization: ["sex"]  # Binary variable
      standardization_method: "z_score"  # mean=0, SD=1
      
    input_files:
      - path: "results/ch7/7.6.1/data/step01_cognitive_tests.csv"
        required_columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "age", "sex", "education"]
      - path: "results/ch7/7.6.1/data/step02_slopes_extracted.csv"
        required_columns: ["UID", "slope"]
    
    output_files:
      - path: "results/ch7/7.6.1/data/step03_analysis_input.csv"
        columns: ["UID", "slope", "age_std", "sex", "education_std", "RAVLT_T_std", "BVMT_T_std", "RPM_T_std"]
        description: "Merged and standardized dataset ready for regression"
    
    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(data: pd.DataFrame, standardized_columns: List[str], tolerance: float = 0.01) -> Dict[str, Any]"
      parameters:
        expected_means: 0.0
        expected_sds: 1.0
        tolerance: 0.01
        
    log_file: "results/ch7/7.6.1/logs/step03_merge_datasets.log"

  # ==========================================================================
  # STEP 4: Hierarchical Multiple Regression Analysis
  # ==========================================================================
  - name: "step04_hierarchical_regression"
    step_number: 4
    description: "Fit hierarchical regression with demographics + cognitive predictors"
    dependencies: ["step03_merge_and_standardize"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_hierarchical_regression"
      signature: "fit_hierarchical_regression(X_blocks: List[Union[np.ndarray, pd.DataFrame]], y: Union[np.ndarray, pd.Series], block_names: List[str] = None, add_constant: bool = True) -> Dict"
      
    parameters:
      response_variable: "slope"
      predictor_blocks:
        demographics: ["age_std", "sex", "education_std"]
        cognitive: ["RAVLT_T_std", "BVMT_T_std", "RPM_T_std"]
      block_names: ["Demographics", "Cognitive"]
      include_constant: true
      # Decision D068: Dual p-value reporting
      alpha_levels:
        standard: 0.05
        bonferroni: 0.0167  # 0.05/3 cognitive predictors
        chapter_correction: 0.00179  # Ch7 global correction
      compute_semi_partial_r2: true
      
    input_files:
      - path: "results/ch7/7.6.1/data/step03_analysis_input.csv"
        required_columns: ["UID", "slope", "age_std", "sex", "education_std", "RAVLT_T_std", "BVMT_T_std", "RPM_T_std"]
    
    output_files:
      - path: "results/ch7/7.6.1/data/step04_regression_results.csv"
        columns: ["predictor", "beta", "se", "ci_lower", "ci_upper", "t_stat", "p_uncorrected", 
                 "p_bonferroni", "p_chapter", "sr_squared", "model"]
        description: "Hierarchical regression with dual p-values per D068"
    
    validation_call:
      module: "tools.analysis_extensions"
      function: "validate_regression_assumptions"
      signature: "validate_regression_assumptions(model: RegressionResultsWrapper, X: pd.DataFrame, return_plots: bool = False) -> Dict"
      parameters:
        check_linearity: true
        check_normality: true
        check_homoscedasticity: true
        check_multicollinearity: true
        
    log_file: "results/ch7/7.6.1/logs/step04_hierarchical_regression.log"

  # ==========================================================================
  # STEP 5: Bootstrap Confidence Intervals
  # ==========================================================================
  - name: "step05_bootstrap_ci"
    step_number: 5
    description: "Compute robust bootstrap confidence intervals for regression coefficients"
    dependencies: ["step04_hierarchical_regression"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "bootstrap_regression_ci"
      signature: "bootstrap_regression_ci(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_bootstrap: int = 1000, confidence_level: float = 0.95, random_state: int = 42) -> pd.DataFrame"
      
    parameters:
      n_bootstrap: 1000
      confidence_level: 0.95
      random_state: 42  # Reproducibility
      sampling_method: "participant_resampling"
      predictor_columns: ["age_std", "sex", "education_std", "RAVLT_T_std", "BVMT_T_std", "RPM_T_std"]
      response_column: "slope"
      
    input_files:
      - path: "results/ch7/7.6.1/data/step03_analysis_input.csv"
        required_columns: ["age_std", "sex", "education_std", "RAVLT_T_std", "BVMT_T_std", "RPM_T_std", "slope"]
    
    output_files:
      - path: "results/ch7/7.6.1/data/step05_bootstrap_ci.csv"
        columns: ["coefficient", "mean", "std", "ci_lower", "ci_upper"]
        description: "Bootstrap confidence intervals for all coefficients"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      parameters:
        validate_ci_ordering: true  # ci_lower < mean < ci_upper
        bootstrap_iterations: 1000
        
    log_file: "results/ch7/7.6.1/logs/step05_bootstrap_ci.log"

  # ==========================================================================
  # STEP 6: Model Diagnostics and Assumption Validation
  # ==========================================================================
  - name: "step06_model_diagnostics"
    step_number: 6
    description: "Comprehensive regression diagnostics and assumption checking"
    dependencies: ["step04_hierarchical_regression", "step05_bootstrap_ci"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_regression_diagnostics"
      signature: "compute_regression_diagnostics(model: sm.regression.linear_model.RegressionResultsWrapper, X: Union[np.ndarray, pd.DataFrame], return_dataframe: bool = True) -> Dict"
      
    parameters:
      diagnostic_tests:
        multicollinearity:
          method: "vif"
          threshold: 10.0
        normality:
          method: "shapiro_wilk"
          alpha: 0.05
        homoscedasticity:
          method: "breusch_pagan"
          alpha: 0.05
        outliers:
          cooks_d_threshold: 0.04  # 4/n for n=100
          leverage_threshold: 0.12  # 2p/n for p=6, n=100
          
    input_files:
      - path: "results/ch7/7.6.1/data/step04_regression_results.csv"
        required_columns: ["predictor", "beta", "se"]
      - path: "results/ch7/7.6.1/data/step03_analysis_input.csv"
        required_columns: ["age_std", "sex", "education_std", "RAVLT_T_std", "BVMT_T_std", "RPM_T_std", "slope"]
    
    output_files:
      - path: "results/ch7/7.6.1/data/step06_model_diagnostics.csv"
        columns: ["predictor", "vif", "normality_p", "bp_test_p", "cooks_d_max", "leverage_max"]
        description: "Comprehensive diagnostic statistics"
      - path: "results/ch7/7.6.1/data/step06_diagnostic_plots_data.csv"
        columns: ["fitted", "residuals", "standardized_residuals", "cooks_d", "leverage"]
        description: "Data for diagnostic plot generation"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      parameters:
        vif_range: [1.0, 15.0]
        p_value_range: [0, 1]
        
    log_file: "results/ch7/7.6.1/logs/step06_model_diagnostics.log"

  # ==========================================================================
  # STEP 7: Cross-Validation Analysis
  # ==========================================================================
  - name: "step07_cross_validation"
    step_number: 7
    description: "5-fold cross-validation for generalizability assessment"
    dependencies: ["step06_model_diagnostics"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "cross_validate_regression"
      signature: "cross_validate_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_folds: int = 5, random_state: int = 42, scoring_metrics: List[str] = ['mse', 'r2']) -> Dict"
      
    parameters:
      n_folds: 5
      random_state: 42  # Reproducibility
      shuffle: true
      scoring_metrics: ["r2", "mse", "mae"]
      overfitting_threshold: 0.10  # Flag if train-test R² gap > 0.10
      predictor_columns: ["age_std", "sex", "education_std", "RAVLT_T_std", "BVMT_T_std", "RPM_T_std"]
      response_column: "slope"
      
    input_files:
      - path: "results/ch7/7.6.1/data/step03_analysis_input.csv"
        required_columns: ["age_std", "sex", "education_std", "RAVLT_T_std", "BVMT_T_std", "RPM_T_std", "slope"]
    
    output_files:
      - path: "results/ch7/7.6.1/data/step07_cross_validation.csv"
        columns: ["fold", "train_r2", "test_r2", "rmse", "mae", "n_train", "n_test", "overfitting_flag"]
        description: "Cross-validation performance metrics with overfitting assessment"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      parameters:
        r2_range: [0, 1]
        n_folds_expected: 5
        
    log_file: "results/ch7/7.6.1/logs/step07_cross_validation.log"

  # ==========================================================================
  # STEP 8: Power Analysis and Effect Size Assessment
  # ==========================================================================
  - name: "step08_power_analysis"
    step_number: 8
    description: "Post-hoc power analysis with effect size interpretation"
    dependencies: ["step04_hierarchical_regression", "step07_cross_validation"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_post_hoc_power"
      signature: "compute_post_hoc_power(n: int, k: int, r2: float, alpha: float = 0.05) -> Dict"
      
    parameters:
      sample_size: 100
      n_predictors: 6  # Total predictors in full model
      alpha_levels:
        standard: 0.05
        corrected: 0.00179  # Ch7 chapter correction
      target_power: 0.80
      effect_size_benchmarks:
        small: 0.02
        medium: 0.15
        large: 0.35
      analyses:
        - type: "overall_model"
          description: "Power for full model R²"
        - type: "incremental_cognitive"
          description: "Power for incremental R² from cognitive predictors"
        - type: "sensitivity"
          description: "Minimum detectable effect sizes"
          
    input_files:
      - path: "results/ch7/7.6.1/data/step04_regression_results.csv"
        required_columns: ["model", "r2", "f_statistic", "p_value"]
    
    output_files:
      - path: "results/ch7/7.6.1/data/step08_power_analysis.csv"
        columns: ["analysis_type", "effect_size_f2", "power_standard", "power_corrected", 
                 "min_detectable_f2", "interpretation", "adequate_power", "sample_size_needed"]
        description: "Comprehensive power analysis with effect size interpretations"
      - path: "results/ch7/7.6.1/data/step08_effect_sizes.csv"  
        columns: ["comparison", "r2_full", "r2_reduced", "delta_r2", "cohens_f2", "interpretation"]
        description: "Effect size calculations for hierarchical comparisons"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      parameters:
        power_range: [0, 1]
        effect_size_range: [0, 1]
        
    log_file: "results/ch7/7.6.1/logs/step08_power_analysis.log"

# ============================================================================
# ANALYSIS SUMMARY AND METADATA
# ============================================================================

analysis_summary:
  total_steps: 9  # Step 0 + Steps 1-8
  estimated_runtime_minutes: 45
  
  primary_hypothesis: "Cognitive tests (RAVLT, BVMT, RPM) should NOT significantly predict individual differences in REMEMVR forgetting slopes"
  
  expected_results:
    - "Hierarchical regression: Model R² < 0.10"
    - "Cognitive block: non-significant after Bonferroni correction"  
    - "Individual predictors: p > 0.00179 (Ch7 corrected alpha)"
    - "Effect sizes: small Cohen's f² < 0.02"
    
  statistical_methods:
    - "Hierarchical multiple regression"
    - "Bootstrap confidence intervals (n=1000, seed=42)"
    - "5-fold cross-validation (seed=42)"
    - "Post-hoc power analysis"
    - "Multiple comparison corrections (Bonferroni + Chapter-wide)"
    
  data_sources:
    cognitive_tests: "data/dfnonvr.csv (columns: ravlt-trial-X-score, bvmt-trial-X-score, rpm-score)"
    forgetting_slopes: "results/ch5/5.1.4/data/step04_random_effects.csv (column: random_slope)"
    sample_size: 100

cross_rq_dependencies:
  required:
    - rq_id: "ch5/5.1.4"
      status_required: "rq_results: success"
      files_required:
        - "results/ch5/5.1.4/data/step04_random_effects.csv"
      description: "Individual slope estimates from model-averaged LMM"
      
data_quality_requirements:
  cognitive_tests:
    completeness: ">90% per test"
    range_validation: "T-scores [20, 80]"
    standardization: "z-scores (mean=0, SD=1)"
  
  slopes:
    range_expected: "[-0.5, 0.1] per day"
    distribution: "approximately normal"
    sample_size: "100 participants"
    
output_specifications:
  data_files: 9  # step00 through step08
  log_files: 9  # One per step
  plot_data_files: 1  # step06_diagnostic_plots_data.csv
  
  hierarchical_paths_enforced: true
  all_paths_prefix: "results/ch7/7.6.1/"
  
validation_coverage:
  steps_with_validation: 9  # 100% coverage
  validation_types: ["file_existence", "numeric_range", "standardization", "regression_assumptions", "bootstrap_validity"]
  mandatory_4_layer_validation: true

