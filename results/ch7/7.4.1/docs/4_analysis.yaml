execution:
  total_steps: 6  # Steps 0-5
  estimated_runtime: "10-15 minutes"
  dependencies:
    external:
      - "ch5/5.3.1 must be completed (provides paradigm theta scores)"
    internal: 
      - "Steps must run in order 0→1→2→3→4→5"
      - "Each step validates before proceeding to next"
      
  critical_requirements:
    - "NEVER use master.xlsx - all Ch7 data from dfnonvr.csv"
    - "Use exact column names from DATA_DICTIONARY.md"
    - "All output paths must be hierarchical (results/ch7/7.4.1/...)"
    - "Bootstrap seed=42 for reproducibility"
    - "Chapter-level alpha=0.00179 for significance testing"
    - "Decision D068: Dual p-value reporting (uncorrected + Bonferroni)"

