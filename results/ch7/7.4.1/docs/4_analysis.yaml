metadata:
  rq_id: "ch7/7.4.1"
  title: "RAVLT Free Recall vs Recognition Process-Specific Prediction"
  created: "2026-01-05T20:00:00Z"
  agent: "rq_analysis"
  version: "v5.3.0"
  verification_level: "deep_v5.3.0"
  
  corrections_applied:
    - "CRITICAL: Fixed data source from master.xlsx to dfnonvr.csv (Ch7 requirement)"
    - "Module: tools.bootstrap.compare_correlations_dependent -> tools.bootstrap.bootstrap_correlation_ci"  
    - "Paths: All output paths converted to hierarchical structure"
    - "Columns: Updated to exact names from DATA_DICTIONARY.md"
    - "Validation: Fixed validator-analysis type mismatches"
    
  ch5_dependency:
    required: true
    source_rq: "ch5/5.3.1"  # Paradigm-specific IRT analysis
    files_needed:
      - "results/ch5/5.3.1/data/step03_theta_scores.csv"
    paradigms_required: ["IFR", "IRE"]  # Free Recall, Recognition
    
steps:
  - step_number: 0
    name: "extract_cognitive_tests"
    description: "Extract RAVLT cognitive test scores from dfnonvr.csv"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_cognitive_tests" 
      signature: "extract_cognitive_tests(uid_list: Optional[List[str]] = None, data_path: str = './data/dfnonvr.csv') -> pd.DataFrame"
      
    parameters:
      uid_list: null  # Extract all 100 participants
      data_path: "data/dfnonvr.csv"  # NEVER master.xlsx for Ch7
      
    input_files:
      - path: "data/dfnonvr.csv"
        description: "Participant-level non-VR data with cognitive test scores"
        required_columns:
          - "uid"  # Participant identifier
          - "ravlt-trial-1-score"  # RAVLT trial 1
          - "ravlt-trial-2-score"  # RAVLT trial 2  
          - "ravlt-trial-3-score"  # RAVLT trial 3
          - "ravlt-trial-4-score"  # RAVLT trial 4
          - "ravlt-trial-5-score"  # RAVLT trial 5
        expected_rows: 100
        note: "Column names from DATA_DICTIONARY.md - lowercase with hyphens"
        
    output_files:
      - path: "results/ch7/7.4.1/data/step00_cognitive_tests.csv"
        description: "RAVLT scores with computed total"
        columns: 
          - "uid"
          - "ravlt_total"  # Sum of 5 trials
        expected_rows: 100
        
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"
      
    validation_parameters:
      df: "{{output_dataframe}}"
      required_cols: ["uid", "ravlt_total"]
      
    success_criteria:
      - "100 participants with RAVLT data"
      - "RAVLT_total in range [0, 75]" 
      - "No missing values"
      - "RAVLT_total = sum of 5 trials"
      
    logs_to: "results/ch7/7.4.1/logs/step00_extract_cognitive_tests.log"

  - step_number: 1
    name: "extract_paradigm_theta_scores"
    description: "Load paradigm-specific theta scores from Ch5 5.3.1 results"
    
    analysis_call:
      type: "custom"  # Not in tools catalog - custom extraction from Ch5
      operation: "load_and_aggregate_paradigm_theta"
      
    parameters:
      source_path: "results/ch5/5.3.1/data/step03_theta_scores.csv"
      paradigms_needed: ["IFR", "IRE"]  # Free Recall, Recognition
      domains: ["What", "Where", "When"]  # Aggregate across all domains
      
    input_files:
      - path: "results/ch5/5.3.1/data/step03_theta_scores.csv"
        description: "IRT theta scores from Ch5 paradigm analysis"
        required_columns:
          - "uid"
          - "paradigm"  # Should contain IFR, IRE
          - "theta"     # IRT ability estimates
        dependency: "ch5/5.3.1 must be completed first"
        
    processing_steps:
      - "Filter to IFR (Free Recall) and IRE (Recognition) paradigms only"
      - "Aggregate theta scores across What/Where/When domains within paradigm" 
      - "Compute mean theta per participant per paradigm across all 4 tests"
      - "Reshape to wide format: UID, Theta_FreeRecall, Theta_Recognition"
      
    output_files:
      - path: "results/ch7/7.4.1/data/step01_paradigm_theta.csv"
        description: "Paradigm-specific theta scores (Free Recall vs Recognition)"
        columns:
          - "uid" 
          - "theta_free_recall"  # Mean theta for IFR paradigm
          - "theta_recognition"  # Mean theta for IRE paradigm
        expected_rows: 100
        
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      
    validation_parameters:
      data: "{{output_dataframe.theta_free_recall}}"
      min_val: -3.0
      max_val: 3.0
      column_name: "theta_free_recall"
      
    success_criteria:
      - "100 participants with theta scores"
      - "Theta values in IRT range [-3, 3]"
      - "Both paradigms represented (Free Recall and Recognition)"
      - "No missing values after aggregation"
      
    logs_to: "results/ch7/7.4.1/logs/step01_extract_paradigm_theta.log"

  - step_number: 2  
    name: "merge_datasets"
    description: "Merge RAVLT scores with paradigm theta scores"
    
    analysis_call:
      type: "custom"  # Simple pandas merge
      operation: "inner_join_on_uid"
      
    parameters:
      left_file: "results/ch7/7.4.1/data/step00_cognitive_tests.csv"
      right_file: "results/ch7/7.4.1/data/step01_paradigm_theta.csv" 
      join_key: "uid"
      join_type: "inner"
      
    input_files:
      - path: "results/ch7/7.4.1/data/step00_cognitive_tests.csv"
        source: "step00 output"
      - path: "results/ch7/7.4.1/data/step01_paradigm_theta.csv" 
        source: "step01 output"
        
    processing_steps:
      - "Load both datasets"
      - "Inner join on UID to keep only participants with both RAVLT and theta data"
      - "Validate no data loss (expect 100 participants maintained)"
      - "Create correlation input dataset"
      
    output_files:
      - path: "results/ch7/7.4.1/data/step02_correlation_input.csv"
        description: "Unified analysis dataset for correlation analysis"
        columns:
          - "uid"
          - "ravlt_total"
          - "theta_free_recall" 
          - "theta_recognition"
        expected_rows: 100
        
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_rows: Union[int, Tuple[int, int]], expected_columns: List[str], column_types: Optional[Dict[str, type]]) -> Dict[str, Any]"
      
    validation_parameters:
      df: "{{output_dataframe}}"
      expected_rows: 100
      expected_columns: ["uid", "ravlt_total", "theta_free_recall", "theta_recognition"]
      column_types:
        uid: "object"
        ravlt_total: "int64"
        theta_free_recall: "float64" 
        theta_recognition: "float64"
        
    success_criteria:
      - "No data loss from merge (100 participants maintained)"
      - "All required columns present"
      - "No missing values after merge"
      - "Variable ranges maintained"
      
    logs_to: "results/ch7/7.4.1/logs/step02_merge_datasets.log"

  - step_number: 3
    name: "compute_correlations_with_bootstrap_ci"
    description: "Compute r(RAVLT, FreeRecall) and r(RAVLT, Recognition) with bootstrap CIs"
    
    analysis_call:
      type: "catalogued"
      module: "tools.bootstrap"
      function: "bootstrap_correlation_ci"
      signature: "bootstrap_correlation_ci(x: np.ndarray, y: np.ndarray, n_bootstrap: int = 1000, confidence: float = 0.95, method: str = 'pearson', seed: Optional[int] = None) -> Dict"
      
    parameters:
      # Will be called twice - once for each correlation
      n_bootstrap: 1000
      confidence: 0.95
      method: "pearson"
      seed: 42
      
    input_files:
      - path: "results/ch7/7.4.1/data/step02_correlation_input.csv"
        source: "step02 output"
        required_columns: ["ravlt_total", "theta_free_recall", "theta_recognition"]
        
    processing_steps:
      - "Compute r1 = correlation(ravlt_total, theta_free_recall) with bootstrap CI"
      - "Compute r2 = correlation(ravlt_total, theta_recognition) with bootstrap CI" 
      - "Calculate both uncorrected and Bonferroni-corrected p-values (Decision D068)"
      - "Store both correlation results with confidence intervals"
      
    output_files:
      - path: "results/ch7/7.4.1/data/step03_correlation_results.csv"
        description: "Bivariate correlations with bootstrap confidence intervals"
        columns:
          - "correlation_pair"    # "RAVLT-FreeRecall" or "RAVLT-Recognition" 
          - "r_value"            # Pearson correlation coefficient
          - "ci_lower"           # Bootstrap CI lower bound
          - "ci_upper"           # Bootstrap CI upper bound  
          - "p_uncorrected"      # Uncorrected p-value
          - "p_bonferroni"       # Bonferroni corrected p-value
          - "n_obs"              # Sample size (100)
        expected_rows: 2  # One row for each correlation
        
    validation_call:
      module: "tools.validation"  
      function: "validate_correlation_test_d068"
      signature: "validate_correlation_test_d068(correlation_df: pd.DataFrame, required_cols: List[str] = None) -> Dict[str, Any]"
      
    validation_parameters:
      correlation_df: "{{output_dataframe}}"
      required_cols: ["correlation_pair", "r_value", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni"]
      
    success_criteria:
      - "Exactly 2 correlations computed"
      - "Correlation values in range [-1, 1]"
      - "Bootstrap CIs properly computed (ci_lower < r_value < ci_upper)"
      - "Dual p-values present (Decision D068 compliance)"
      - "Bootstrap parameters correct (n=1000, seed=42)"
      
    logs_to: "results/ch7/7.4.1/logs/step03_compute_correlations.log"

  - step_number: 4
    name: "steiger_z_test" 
    description: "Test process-specificity: r(RAVLT, FreeRecall) > r(RAVLT, Recognition)"
    
    analysis_call:
      type: "custom"  # Need to implement Steiger's Z-test
      operation: "steiger_dependent_correlations_test"
      
    parameters:
      alpha_threshold: 0.00179  # Chapter-level Bonferroni correction
      hypothesis: "r1_greater_than_r2"  # Directional test
      
    input_files:
      - path: "results/ch7/7.4.1/data/step03_correlation_results.csv"
        source: "step03 output"
        description: "r12 and r13 values"
      - path: "results/ch7/7.4.1/data/step02_correlation_input.csv" 
        source: "step02 output"
        description: "Raw data to compute r23 = correlation(theta_free_recall, theta_recognition)"
        
    processing_steps:
      - "Extract r12 = correlation(RAVLT, FreeRecall) from step03 results"
      - "Extract r13 = correlation(RAVLT, Recognition) from step03 results"
      - "Compute r23 = correlation(FreeRecall, Recognition) from raw data"
      - "Apply Steiger's Z-test formula for dependent correlations"
      - "Test H1: r12 > r13 with alpha = 0.00179"
      - "Compute effect size = r12 - r13"
      
    output_files:
      - path: "results/ch7/7.4.1/data/step04_steiger_test.csv"
        description: "Steiger's Z-test results for process-specificity hypothesis"
        columns:
          - "z_statistic"       # Steiger's Z test statistic
          - "p_value"          # Two-tailed p-value  
          - "r_difference"     # r1 - r2 (effect size)
          - "significant"      # Boolean: p < 0.00179
          - "interpretation"   # Human-readable result
          - "alpha_threshold"  # 0.00179 (chapter-level)
        expected_rows: 1
        
    validation_call:
      module: "tools.validation"
      function: "validate_hypothesis_test_dual_pvalues" 
      signature: "validate_hypothesis_test_dual_pvalues(interaction_df: pd.DataFrame, required_terms: List[str], alpha_bonferroni: float = 0.05) -> Dict[str, Any]"
      
    validation_parameters:
      interaction_df: "{{output_dataframe}}"
      required_terms: ["process_specificity"]
      alpha_bonferroni: 0.00179
      
    success_criteria:
      - "Single test result (1 row)" 
      - "Z-statistic and p-value computed"
      - "Alpha threshold = 0.00179 (chapter-level correction)"
      - "Significance determination consistent (p < alpha)"
      - "Effect size (correlation difference) computed"
      
    logs_to: "results/ch7/7.4.1/logs/step04_steiger_test.log"

  - step_number: 5
    name: "bootstrap_sensitivity_analysis"
    description: "Bootstrap confidence intervals for correlation difference as sensitivity analysis"
    
    analysis_call:
      type: "custom"  # Bootstrap difference of correlations
      operation: "bootstrap_correlation_difference"
      
    parameters:
      n_bootstrap: 1000
      seed: 42
      confidence_level: 0.95
      
    input_files:
      - path: "results/ch7/7.4.1/data/step02_correlation_input.csv"
        source: "step02 output"
        required_columns: ["ravlt_total", "theta_free_recall", "theta_recognition"]
        
    processing_steps:
      - "Bootstrap sampling with replacement (1000 iterations, seed=42)"
      - "For each bootstrap sample:"
      - "  - Compute r1_boot = correlation(RAVLT, FreeRecall)"
      - "  - Compute r2_boot = correlation(RAVLT, Recognition)"
      - "  - Compute diff_boot = r1_boot - r2_boot"
      - "Compute 95% confidence interval for correlation difference"
      - "Check if CI excludes zero (sensitivity validation)"
      - "Compare with Steiger's Z-test for consistency"
      
    output_files:
      - path: "results/ch7/7.4.1/data/step05_bootstrap_sensitivity.csv"
        description: "Bootstrap sensitivity analysis for correlation difference"
        columns:
          - "statistic"        # "correlation_difference"
          - "value"           # Mean difference (r1 - r2)
          - "ci_lower"        # Bootstrap CI lower bound
          - "ci_upper"        # Bootstrap CI upper bound
          - "excludes_zero"   # Boolean: CI excludes zero
          - "n_bootstrap"     # 1000
          - "seed"           # 42
        expected_rows: 1
        
    validation_call:
      module: "tools.validation"
      function: "validate_bootstrap_stability"
      signature: "validate_bootstrap_stability(bootstrap_results: Dict, n_bootstrap: int, confidence_level: float) -> Dict[str, Any]"
      
    validation_parameters:
      bootstrap_results: "{{bootstrap_output}}"
      n_bootstrap: 1000
      confidence_level: 0.95
      
    success_criteria:
      - "Bootstrap parameters correct (n=1000, seed=42)"
      - "Confidence interval properly computed"  
      - "Zero exclusion determination correct"
      - "Consistency with Steiger test results"
      - "Single sensitivity result (1 row)"
      
    logs_to: "results/ch7/7.4.1/logs/step05_bootstrap_sensitivity.log"

