      module: "tools.validation"
      function: "validate_data_format"
      verified: true
      signature: "validate_data_format(df: DataFrame, required_cols: List[str]) -> Dict[str, Any]"

  # ==========================================================================
  # Step 1: Extract and Merge Data
  # ==========================================================================
  - name: "step01_extract_merge_data" 
    verification_notes: "All data extraction functions verified in tools.data"
    
    analysis_call:
      type: "stdlib"
      operations:
        # SPECIFIC FUNCTION CALLS - no vague descriptions
        - "import pandas as pd"
        - "import numpy as np"
        - "# Load theta_all scores from Ch5 5.1.1"
        - "theta_df = pd.read_csv('results/ch5/5.1.1/data/step03_theta_scores.csv')"
        - "# Extract theta_all column (IRT ability estimates)"
        - "theta_clean = theta_df[['UID', 'theta_all', 'SE']].copy()"
        - "# Load cognitive tests from dfnonvr.csv (Ch7 mandate - NO master.xlsx)"
        - "cognitive_df = pd.read_csv('data/dfnonvr.csv')"
        - "# Extract required cognitive tests and demographics"
        - "cognitive_clean = cognitive_df[['UID', 'RAVLT_T', 'BVMT_T', 'RPM_T', 'Age']].copy()"
        - "# Verify 100 participants in both datasets"
        - "assert len(theta_clean) == 100, f'Expected 100 theta scores, got {len(theta_clean)}'"
        - "assert len(cognitive_clean) == 100, f'Expected 100 cognitive scores, got {len(cognitive_clean)}'"
        - "# Merge on UID with inner join"
        - "merged_df = pd.merge(theta_clean, cognitive_clean, on='UID', how='inner')"
        - "# Check for missing data - require complete data"
        - "missing_count = merged_df.isnull().sum().sum()"
        - "assert missing_count == 0, f'Missing data detected: {missing_count} values'"
        - "# Create standardized versions of predictors (mean=0, sd=1)" 
        - "from scipy.stats import zscore"
        - "merged_df['Age_std'] = zscore(merged_df['Age'])"
        - "merged_df['RAVLT_T_std'] = zscore(merged_df['RAVLT_T'])"
        - "merged_df['BVMT_T_std'] = zscore(merged_df['BVMT_T'])"
        - "merged_df['RPM_T_std'] = zscore(merged_df['RPM_T'])"
        - "# Save merged analysis dataset"
        - "merged_df.to_csv('results/ch7/7.2.1/data/step01_analysis_dataset.csv', index=False)"
        
      input_files:
        - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
          columns: ["UID", "theta_all", "SE"]
        - path: "data/dfnonvr.csv"  # Ch7 corrected path
          columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "Age"]
          
      outputs:
