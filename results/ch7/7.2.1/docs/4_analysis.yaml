          - block_2: ["Age_std", "RAVLT_T_std", "BVMT_T_std", "RPM_T_std"]  # Model 2: Age + cognitive tests
        y: "theta_all"
        block_names: ["Model_1_Age_Only", "Model_2_Age_Plus_Cognitive"]
        add_constant: true
        
