          columns: ["model", "beta_Age"]
          
      parameters:
        n_bootstrap: 1000
        confidence_level: 0.95
        random_state: 42
        
      additional_processing:
        # Formal mediation calculations as stdlib operations
        - "# Extract beta coefficients from hierarchical models"
        - "beta_total = model_1_results['beta_Age']  # c path (total effect)"
        - "beta_direct = model_2_results['beta_Age']  # c' path (direct effect)"
        - "# Calculate mediation effect and proportion mediated"
        - "mediation_effect = beta_total - beta_direct"
        - "proportion_mediated = mediation_effect / beta_total if beta_total != 0 else 0"
        - "# Bootstrap significance test for proportion mediated"
        - "# For each bootstrap iteration: fit both models, compute proportion"
        - "# 95% CI using percentile method (2.5th, 97.5th percentiles)"
        - "# Effect size interpretation: <0.25 small, 0.25-0.75 medium, >0.75 large"
        
      outputs:
