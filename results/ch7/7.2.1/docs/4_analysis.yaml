        variables_to_correlate:
          - "Age"
          - "theta_all" 
          - "RAVLT_T"
          - "BVMT_T"
          - "RPM_T"
        n_bootstrap: 1000
        confidence_level: 0.95
        method: "pearson"
        random_state: 42  # Reproducibility
        
      additional_processing:
        # Multiple comparison correction as stdlib operations
        - "from statsmodels.stats.multitest import multipletests"
        - "# Bonferroni correction for within-step tests (6 correlations with theta_all)"
        - "alpha_bonferroni = 0.05 / 6  # 0.0083"
        - "# FDR correction using Benjamini-Hochberg"
        - "reject_fdr, pvals_fdr, alpha_sidak, alpha_bonf = multipletests(p_values, method='fdr_bh')"
        
      outputs:
        # CORRECTED PATH - hierarchical organization 
        correlations:
          path: "results/ch7/7.2.1/data/step02_correlations.csv"
          columns: ["Variable1", "Variable2", "r", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni", "p_fdr"]
          
