      parameters:
        n: 100  # Sample size
        k: 4    # Number of predictors in Model 2
        alpha: 0.0125  # Bonferroni corrected alpha (0.05/4)
        
      additional_processing:
        # Power calculations as stdlib operations
        - "from statsmodels.stats.power import FTestAnovaPower"
        - "# Calculate achieved power for observed effect sizes (Cohen's f²)" 
        - "# Sensitivity analysis: minimum detectable f² at 80% power"
        - "# Power for model comparison (F-test for ΔR²)"
        - "# Mediation power assessment: N=100 limitations"
