      module: "tools.validation"
      function: "validate_hypothesis_test_dual_pvalues"  # D068 specific validator
      verified: true
      signature: "validate_hypothesis_test_dual_pvalues(test_results_df: pd.DataFrame) -> Dict[str, Any]"

