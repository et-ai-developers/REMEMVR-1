metadata:
  rq_id: "ch7/7.8.1"
  verification_level: "deep_v5.3.0"
  module_corrections: 2
  data_source_corrections: 1
  format_corrections: 1
  path_corrections: 12
  
  # CRITICAL Ch7 Data Source Rule (v5.3.0)
  data_sources:
    cognitive_tests: "data/dfnonvr.csv"  # ALL cognitive test data here
    participant_data: "data/dfnonvr.csv"  # Demographics, DASS, etc.
    note: "Ch7 MUST NEVER reference master.xlsx - all data in dfnonvr.csv"
  
  column_mappings_dfnonvr:
    # Cognitive test columns (exact names from DATA_DICTIONARY.md)
    nart: "nart-score"
    rpm: "rpm-score" 
    ravlt_trials: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score"]
    bvmt_trials: ["bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score"]
    bvmt_delayed: "bvmt-delayed-recall-score"
    age: "age"
    dass_anxiety: "total-dass-anxiety-items"
    dass_stress: "total-dass-stress-items"
    dass_depression: "total-dass-depression-items"

steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Verify Ch5 domain-specific theta scores exist before proceeding with LPA analysis"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: str, min_size_bytes: int = 0) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch5/5.2.1/data/step03_theta_scores.csv"
        description: "What domain theta scores from Ch5 5.2.1"
        required_columns: ["UID"]
        format: "csv"
      - path: "results/ch5/5.2.2/data/step03_theta_scores.csv"
        description: "Where domain theta scores from Ch5 5.2.2"
        required_columns: ["UID"]
        format: "csv"
      - path: "results/ch5/5.2.3/data/step03_theta_scores.csv"
        description: "When domain theta scores from Ch5 5.2.3"
        required_columns: ["UID"]
        format: "csv"
      - path: "data/dfnonvr.csv"  # CORRECTED: was master.xlsx
        description: "Participant data for external validation (Age, cognitive tests)"
        required_columns: ["UID", "age", "nart-score", "rpm-score"]
        format: "csv"
        
    output_files:
      - path: "results/ch7/7.8.1/data/step00_dependency_validation.txt"
        description: "Validation results for all dependency files"
        format: "txt"
        
    parameters:
      files_to_check:
        - "results/ch5/5.2.1/data/step03_theta_scores.csv"
        - "results/ch5/5.2.2/data/step03_theta_scores.csv"
        - "results/ch5/5.2.3/data/step03_theta_scores.csv"
        - "data/dfnonvr.csv"  # CORRECTED: was master.xlsx
      min_size_bytes: 1000
      
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"
      
    log_file: "results/ch7/7.8.1/logs/step00_validate_dependencies.log"

  - name: "step01_extract_domain_theta_scores"
    step_number: 1
    description: "Extract and standardize domain-specific theta scores into analysis-ready dataset"
    dependencies: ["step00_validate_dependencies"]
    
    analysis_call:
      type: "catalogued" 
      module: "tools.data"  # CORRECTED: was tools.analysis_merge
      function: "merge_theta_cognitive"  # CORRECTED: was merge_multiple_datasets
      signature: "merge_theta_cognitive(theta_df: pd.DataFrame, cognitive_df: pd.DataFrame, how: str = 'inner') -> pd.DataFrame"
      
    input_files:
      - path: "results/ch5/5.2.1/data/step03_theta_scores.csv"
        description: "What domain theta scores"
        required_columns: ["UID"]
        format: "csv"
      - path: "results/ch5/5.2.2/data/step03_theta_scores.csv" 
        description: "Where domain theta scores"
        required_columns: ["UID"]
        format: "csv"
      - path: "results/ch5/5.2.3/data/step03_theta_scores.csv"
        description: "When domain theta scores"
        required_columns: ["UID"]
        format: "csv"
        
    output_files:
      - path: "results/ch7/7.8.1/data/step01_domain_theta_scores.csv"
        description: "Standardized theta scores for What/Where/When domains"
        columns: ["UID", "theta_What", "theta_Where", "theta_When"]
        format: "csv"
        
    parameters:
      merge_on: "UID"
      how: "inner"
      standardize: true
      standardization_method: "z_score"
      expected_participants: 100
      
    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(df: pd.DataFrame, column_names: List[str], tolerance: float = 0.01) -> Dict[str, Any]"
      
    log_file: "results/ch7/7.8.1/logs/step01_extract_domain_theta_scores.log"

  - name: "step02_fit_lpa_models"
    step_number: 2
    description: "Fit LPA models for K=1,2,3,4 profiles with convergence diagnostics"
    dependencies: ["step01_extract_domain_theta_scores"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_lpa"
      function: "fit_lpa_models" 
      signature: "fit_lpa_models(X: Union[np.ndarray, pd.DataFrame], k_range: List[int], seed: int = 42, covariance_type: str = 'full', max_iter: int = 100, n_init: int = 10) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch7/7.8.1/data/step01_domain_theta_scores.csv"
        description: "Standardized domain theta scores for LPA input"
        required_columns: ["theta_What", "theta_Where", "theta_When"]
        format: "csv"
        
    output_files:
      - path: "results/ch7/7.8.1/data/step02_lpa_fitted_models.pkl"  # CORRECTED: was .rds
        description: "Fitted LPA models for K=1,2,3,4"
        format: "pkl"
      - path: "results/ch7/7.8.1/data/step02_lpa_convergence_diagnostics.txt"
        description: "Convergence diagnostics for all models"
        format: "txt"
        
    parameters:
      k_range: [1, 2, 3, 4]
      seed: 42
      covariance_type: "full"
      max_iter: 1000
      n_init: 100  # Multiple random starts for stability
      tolerance: 1e-6
      
    validation_call:
      module: "tools.analysis_lpa"
      function: "validate_lpa_solution" 
      signature: "validate_lpa_solution(data: Union[np.ndarray, pd.DataFrame], labels: Union[np.ndarray, pd.Series], metric: str = 'euclidean') -> Dict"
      
    log_file: "results/ch7/7.8.1/logs/step02_fit_lpa_models.log"

  - name: "step03_compare_lpa_models"
    step_number: 3
    description: "Compare LPA models using fit indices and select optimal K solution"
    dependencies: ["step02_fit_lpa_models"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_lpa"
      function: "compare_lpa_models"
      signature: "compare_lpa_models(models: Dict[int, GaussianMixture], data: Union[np.ndarray, pd.DataFrame]) -> pd.DataFrame"
      
    input_files:
      - path: "results/ch7/7.8.1/data/step02_lpa_fitted_models.pkl"
        description: "Fitted LPA models from step 2"
        format: "pkl"
      - path: "results/ch7/7.8.1/data/step01_domain_theta_scores.csv"
        description: "Original domain scores for model comparison"
        format: "csv"
        
    output_files:
      - path: "results/ch7/7.8.1/data/step02_lpa_fit_comparison.csv"  # Standard comparison output
        description: "Model fit comparison indices (BIC, AIC, entropy, LMR-LRT)"
        columns: ["K", "BIC", "AIC", "Entropy", "LMR_LRT_p", "Converged"]
        format: "csv"
        
    parameters:
      compute_entropy: true
      compute_lmr_lrt: true
      selection_criteria:
        - "BIC_minimum"
        - "LMR_LRT_significance"
        - "entropy_threshold_0.80"
        - "minimum_profile_size_20"
        
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"  # CORRECTED: was validate_dataframe_structure
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"
      
    log_file: "results/ch7/7.8.1/logs/step03_compare_lpa_models.log"

  - name: "step04_extract_profile_membership"
    step_number: 4
    description: "Extract optimal profile solution and assign interpretable profile labels"
    dependencies: ["step03_compare_lpa_models"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_lpa"
      function: "extract_profile_membership"
      signature: "extract_profile_membership(model: GaussianMixture, data: Union[np.ndarray, pd.DataFrame], uid_column: str = None) -> pd.DataFrame"
      
    input_files:
      - path: "results/ch7/7.8.1/data/step02_lpa_fit_comparison.csv"
        description: "Model selection results"
        format: "csv"
      - path: "results/ch7/7.8.1/data/step02_lpa_fitted_models.pkl"
        description: "Fitted models for optimal K extraction"
        format: "pkl"
      - path: "results/ch7/7.8.1/data/step01_domain_theta_scores.csv"
        description: "Original data for profile assignment"
        format: "csv"
        
    output_files:
      - path: "results/ch7/7.8.1/data/step03_optimal_profiles.csv"
        description: "Profile assignments for optimal solution"
        columns: ["UID", "Profile", "Max_Posterior_Prob", "Profile_Label"]
        format: "csv"
      - path: "results/ch7/7.8.1/data/step03_model_selection_summary.txt"
        description: "Model selection process summary"
        format: "txt"
        
    parameters:
      uid_column: "UID"
      min_profile_size: 20
      entropy_threshold: 0.80
      labeling_method: "domain_patterns"
      
    validation_call:
      module: "tools.validation" 
      function: "validate_data_format"  # CORRECTED: was validate_cluster_assignment
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"
      
    log_file: "results/ch7/7.8.1/logs/step04_extract_profile_membership.log"

  - name: "step05_characterize_profiles"
    step_number: 5
    description: "Compute profile domain patterns with bootstrap confidence intervals"
    dependencies: ["step04_extract_profile_membership"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_lpa"
      function: "characterize_profiles"
      signature: "characterize_profiles(model: GaussianMixture, data: pd.DataFrame, profile_labels: pd.Series) -> Dict"
      
    input_files:
      - path: "results/ch7/7.8.1/data/step03_optimal_profiles.csv"
        description: "Profile assignments"
        format: "csv"
      - path: "results/ch7/7.8.1/data/step01_domain_theta_scores.csv"
        description: "Domain scores for characterization"
        format: "csv"
        
    output_files:
      - path: "results/ch7/7.8.1/data/step04_profile_characteristics.csv"
        description: "Profile means, SDs, and bootstrap CIs by domain"
        columns: ["Profile", "N", "What_Mean", "What_SD", "What_CI_Low", "What_CI_High", "Where_Mean", "Where_SD", "Where_CI_Low", "Where_CI_High", "When_Mean", "When_SD", "When_CI_Low", "When_CI_High"]
        format: "csv"
      - path: "results/ch7/7.8.1/data/step04_profile_interpretation.txt"
        description: "Interpretable profile descriptions"
        format: "txt"
        
    parameters:
      bootstrap_iterations: 1000
      random_state: 42
      ci_method: "percentile"
      ci_level: 0.95
      domain_cutoffs:
        high: 0.5
        low: -0.5
        
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"  # CORRECTED: was validate_cluster_summary_stats
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"
      
    log_file: "results/ch7/7.8.1/logs/step05_characterize_profiles.log"

  - name: "step06_external_validation"
    step_number: 6
    description: "Validate profile distinctions using external cognitive tests (Decision D068 dual p-values)"
    dependencies: ["step04_extract_profile_membership"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_lpa"
      function: "perform_external_validation"
      signature: "perform_external_validation(profile_labels: pd.Series, external_variables: pd.DataFrame, test_type: str = 'auto') -> pd.DataFrame"
      
    input_files:
      - path: "results/ch7/7.8.1/data/step03_optimal_profiles.csv"
        description: "Profile assignments"
        format: "csv"
      - path: "data/dfnonvr.csv"  # CORRECTED: was data/cache/master.xlsx
        description: "External validation variables (cognitive tests)"
        required_columns: ["UID", "age", "nart-score", "rpm-score", "ravlt-trial-1-score", "bvmt-trial-1-score"]
        format: "csv"
        
    output_files:
      - path: "results/ch7/7.8.1/data/step05_external_validation.csv"
        description: "ANOVA results with dual p-value reporting (D068)"
        columns: ["Variable", "F_stat", "p_uncorrected", "p_bonferroni", "p_fdr", "eta_squared", "Test_Type", "Assumption_Met"]
        format: "csv"
      - path: "results/ch7/7.8.1/data/step05_external_validation_posthoc.csv"
        description: "Post-hoc pairwise comparisons"
        columns: ["Variable", "Comparison", "Mean_Diff", "SE", "t_stat", "p_uncorrected", "p_tukey"]
        format: "csv"
        
    parameters:
      validation_variables:
        - column: "age"
          description: "Age demographic validator"
        - column: "nart-score"  # CORRECTED: exact column name from dfnonvr.csv
          description: "NART score (verbal intelligence)"
        - column: "rpm-score"   # CORRECTED: exact column name from dfnonvr.csv
          description: "Ravens Progressive Matrices (fluid intelligence)"
        - column: "ravlt-trial-5-score"  # CORRECTED: exact column name
          description: "RAVLT trial 5 (verbal memory)"
        - column: "bvmt-trial-3-score"   # CORRECTED: exact column name
          description: "BVMT trial 3 (visual memory)"
      test_type: "anova"
      correction_family: "external_validation"
      alpha_bonferroni: 0.01  # 0.05/5 tests
      fdr_method: "benjamini_hochberg"
      assumption_checks: true
      post_hoc_method: "tukey"
      d068_compliance: true
      
    validation_call:
      module: "tools.validation"
      function: "validate_hypothesis_test_dual_pvalues"
      signature: "validate_hypothesis_test_dual_pvalues(interaction_df: pd.DataFrame, required_terms: List[str], alpha_bonferroni: float = 0.05) -> Dict[str, Any]"
      
    log_file: "results/ch7/7.8.1/logs/step06_external_validation.log"

  - name: "step07_classification_quality"
    step_number: 7  
    description: "Assess LPA classification quality, bootstrap stability, and model diagnostics"
    dependencies: ["step04_extract_profile_membership"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_lpa"
      function: "validate_lpa_solution"
      signature: "validate_lpa_solution(data: Union[np.ndarray, pd.DataFrame], labels: Union[np.ndarray, pd.Series], metric: str = 'euclidean') -> Dict"
      
    input_files:
      - path: "results/ch7/7.8.1/data/step02_lpa_fitted_models.pkl"
        description: "Fitted models for quality assessment"
        format: "pkl"
      - path: "results/ch7/7.8.1/data/step03_optimal_profiles.csv"
        description: "Optimal profile solution"
        format: "csv"
      - path: "results/ch7/7.8.1/data/step01_domain_theta_scores.csv"
        description: "Original input data for quality metrics"
        format: "csv"
        
    output_files:
      - path: "results/ch7/7.8.1/data/step06_classification_quality.csv"
        description: "Classification quality metrics"
        columns: ["Metric", "Value", "Interpretation"]
        format: "csv"
      - path: "results/ch7/7.8.1/data/step06_model_diagnostics.txt"
        description: "Comprehensive model diagnostic report"
        format: "txt"
        
    parameters:
      quality_metrics:
        - "entropy"
        - "silhouette"
        - "davies_bouldin"
        - "calinski_harabasz"
      bootstrap_stability:
        iterations: 100
        random_state: 42
        jaccard_threshold: 0.75
      local_independence_threshold: 0.2
      entropy_threshold: 0.80
      metric: "euclidean"
      
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"  # CORRECTED: was validate_bootstrap_stability
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"
      
    log_file: "results/ch7/7.8.1/logs/step07_classification_quality.log"

