metadata:
  rq_id: "ch7/7.7.3"
  verification_level: "deep_v5.3.0"
  module_corrections: 1
  data_source_corrections: 1  
  column_name_corrections: 7
  validator_corrections: 1
  format_corrections: 0
  path_corrections: 15
  
  critical_corrections_log:
    - "Module: tools.data.validate_regression_assumptions -> tools.analysis_extensions.validate_regression_assumptions"
    - "Data source: data/cache/master.xlsx -> data/dfnonvr.csv (Ch7 requirement)"
    - "RAVLT columns: T1Sc,T2Sc,etc -> ravlt-trial-1-score,ravlt-trial-2-score,etc"
    - "Validator: validate_lmm_convergence -> validate_model_convergence (regression not LMM)"
    - "All output paths: flat -> hierarchical results/ch7/7.7.3/"

steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Verify required Ch5 5.1.1 outputs and dfnonvr.csv accessibility before proceeding"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: str, min_size_bytes: int = 100) -> Dict[str, Any]"
      
      input_files:
        - path: "results/ch5/5.1.1/status.yaml"
          description: "Ch5 5.1.1 completion status verification"
        - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"  
          required_columns: ["UID", "theta_all"]
          description: "Omnibus theta scores from IRT calibration"
        - path: "data/dfnonvr.csv"  # CORRECTED: Use dfnonvr.csv not master.xlsx
          required_columns: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "ravlt-delayed-recall-score", "ravlt-recognition-hits-"]
          description: "RAVLT test scores from prepared data (v5.3.0: Ch7 uses dfnonvr.csv)"
          
      output_files:
        - path: "results/ch7/7.7.3/data/step00_dependency_validation.txt"  # HIERARCHICAL PATH
          description: "Dependency validation report with pass/fail status"
          
      parameters:
        min_file_size: 100
        check_columns: true
        
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_rows: Union[int, Tuple[int, int]], expected_columns: List[str], column_types: Optional[Dict[str, type]] = None) -> Dict[str, Any]"
      
      parameters:
        required_checks: ["Ch5 5.1.1 status: success", "Theta scores file found", "RAVLT columns verified"]
        min_file_size: 500

  - name: "step01_extract_ravlt_scores"
    step_number: 1
    description: "Extract RAVLT test scores from dfnonvr.csv and compute alternative scoring metrics"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_cognitive_tests"
      signature: "extract_cognitive_tests(df: pd.DataFrame, tests: List[str] = None) -> pd.DataFrame"
      
      input_files:
        - path: "data/dfnonvr.csv"  # CORRECTED: Use dfnonvr.csv not master.xlsx
          required_columns: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "ravlt-delayed-recall-score", "ravlt-recognition-hits-"]  # CORRECTED: Exact column names from DATA_DICTIONARY
          description: "RAVLT scores from prepared Ch7 data"
          
      output_files:
        - path: "results/ch7/7.7.3/data/step01_ravlt_scores.csv"  # HIERARCHICAL PATH
          columns: ["UID", "ravlt_trial_1", "ravlt_trial_2", "ravlt_trial_3", "ravlt_trial_4", "ravlt_trial_5", "ravlt_delayed", "ravlt_recognition", "Total", "Learning", "LearningSlope", "Forgetting", "Recognition", "Total_z", "Learning_z", "LearningSlope_z", "Forgetting_z", "Recognition_z"]
          description: "RAVLT raw scores plus computed alternative metrics with standardized versions"
          
      parameters:
        tests: ["RAVLT"]
        compute_derived: true
        standardize: true
        # Column mapping from DATA_DICTIONARY.md names to analysis names:
        column_mapping:
          "ravlt-trial-1-score": "ravlt_trial_1"  
          "ravlt-trial-2-score": "ravlt_trial_2"
          "ravlt-trial-3-score": "ravlt_trial_3"
          "ravlt-trial-4-score": "ravlt_trial_4"
          "ravlt-trial-5-score": "ravlt_trial_5"
          "ravlt-delayed-recall-score": "ravlt_delayed"
          "ravlt-recognition-hits-": "ravlt_recognition"
        
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: np.ndarray, min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      
      parameters:
        ranges:
          ravlt_trials: [0, 15]  # Trial scores 1-5, delayed recall
          ravlt_recognition: [0, 15]  # Recognition hits
          standardized_scores: [-3, 3]  # Z-scores

  - name: "step02_extract_theta_scores"
    step_number: 2
    description: "Load omnibus theta_all scores from Ch5 5.1.1 outputs"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_domain_theta_scores"
      signature: "extract_domain_theta_scores(path: str = None, domains: List[str] = ['What', 'Where', 'When']) -> pd.DataFrame"
      
      input_files:
        - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
          required_columns: ["UID", "theta_all"]
          description: "REMEMVR omnibus theta scores"
          
      output_files:
        - path: "results/ch7/7.7.3/data/step02_theta_scores.csv"  # HIERARCHICAL PATH
          columns: ["UID", "theta_all", "theta_standardized"]
          description: "REMEMVR omnibus theta scores (episodic memory ability estimates)"
          
      parameters:
        path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
        domains: ["All"]
        column_filter: "theta_all"
        
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: np.ndarray, min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      
      parameters:
        ranges:
          theta_scores: [-4, 4]  # IRT ability scale bounds

  - name: "step03_prepare_analysis_dataset"
    step_number: 3
    description: "Merge RAVLT and theta data into analysis-ready dataset with quality checks"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "prepare_regression_data"
      signature: "prepare_regression_data(participant_data: pd.DataFrame, theta_data: pd.DataFrame, merge_on: str = 'UID') -> pd.DataFrame"
      
      input_files:
        - path: "results/ch7/7.7.3/data/step01_ravlt_scores.csv"  # HIERARCHICAL PATH
          required_columns: ["UID", "Total_z", "Learning_z", "LearningSlope_z", "Recognition_z"]
        - path: "results/ch7/7.7.3/data/step02_theta_scores.csv"  # HIERARCHICAL PATH
          required_columns: ["UID", "theta_all"]
          
      output_files:
        - path: "results/ch7/7.7.3/data/step03_analysis_dataset.csv"  # HIERARCHICAL PATH
          columns: ["UID", "Total_z", "Learning_z", "LearningSlope_z", "Recognition_z", "theta_all"]
          description: "Merged analysis-ready dataset with standardized predictors and outcome"
        - path: "results/ch7/7.7.3/data/step03_correlation_matrix.csv"  # HIERARCHICAL PATH
          columns: ["Total_z", "Learning_z", "LearningSlope_z", "Recognition_z"]
          description: "Predictor intercorrelation matrix for multicollinearity screening"
          
      parameters:
        merge_on: "UID"
        compute_correlations: true
        check_multicollinearity: true
        vif_threshold: 5.0
        
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_rows: Union[int, Tuple[int, int]], expected_columns: List[str], column_types: Optional[Dict[str, type]] = None) -> Dict[str, Any]"
      
      parameters:
        expected_participants: [95, 100]
        required_columns: ["UID", "Total_z", "Learning_z", "LearningSlope_z", "Recognition_z", "theta_all"]
        correlation_threshold: 0.9

  - name: "step04_fit_regression_models"
    step_number: 4
    description: "Fit 5 regression models comparing RAVLT scoring methods with bootstrap CIs"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], add_constant: bool = True, return_diagnostics: bool = True) -> Dict"
      
      input_files:
        - path: "results/ch7/7.7.3/data/step03_analysis_dataset.csv"  # HIERARCHICAL PATH
          required_columns: ["UID", "Total_z", "Learning_z", "LearningSlope_z", "Recognition_z", "theta_all"]
          
      output_files:
        - path: "results/ch7/7.7.3/data/step04_model_results.csv"  # HIERARCHICAL PATH
          columns: ["model", "R2", "adj_R2", "F_stat", "p_uncorrected", "p_bonferroni", "AIC", "BIC", "R2_CI_lower", "R2_CI_upper"]
          description: "Regression model statistics with dual p-values per Decision D068"
        - path: "results/ch7/7.7.3/data/step04_regression_coefficients.csv"  # HIERARCHICAL PATH  
          columns: ["model", "predictor", "beta", "se", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni"]
          description: "Standardized coefficients with bootstrap CIs and dual p-values"
          
      parameters:
        models:
          - name: "Model_1"
            predictors: ["Total_z"]
          - name: "Model_2"
            predictors: ["Learning_z"]
          - name: "Model_3"
            predictors: ["LearningSlope_z"]
          - name: "Model_4"
            predictors: ["Recognition_z"]
          - name: "Model_5"
            predictors: ["Total_z", "Learning_z"]
        add_constant: true
        return_diagnostics: true
        bootstrap_ci: true
        bootstrap_iterations: 1000
        random_state: 42
        bonferroni_alpha: 0.000358  # 0.05/28 Chapter 7 tests / 5 models
        
    validation_call:
      module: "tools.validation"
      function: "validate_model_convergence"  # CORRECTED: Use regression validator not LMM validator
      signature: "validate_model_convergence(lmm_result: statsmodels.MixedLMResults) -> Dict[str, Any]"
      
      parameters:
        required_models: 5
        bonferroni_alpha: 0.000358
        bootstrap_iterations: 1000

  - name: "step05_compute_effect_sizes"
    step_number: 5
    description: "Compute effect sizes, AIC weights, and incremental validity tests with bootstrap CIs"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_cohens_f2"
      signature: "compute_cohens_f2(r2_full: float, r2_reduced: float) -> float"
      
      input_files:
        - path: "results/ch7/7.7.3/data/step04_model_results.csv"  # HIERARCHICAL PATH
          required_columns: ["model", "R2"]
          
      output_files:
        - path: "results/ch7/7.7.3/data/step05_effect_sizes.csv"  # HIERARCHICAL PATH
          columns: ["model", "f2", "f2_CI_lower", "f2_CI_upper", "sr2", "sr2_CI_lower", "sr2_CI_upper", "AIC_weight"]
          description: "Effect sizes (Cohen's f², semi-partial r²) with bootstrap CIs and AIC weights"
        - path: "results/ch7/7.7.3/data/step05_incremental_validity.csv"  # HIERARCHICAL PATH
          columns: ["delta_R2", "F_stat", "df1", "df2", "p_uncorrected", "p_bonferroni", "delta_R2_CI"]
          description: "Incremental validity test (Model 5 vs Model 1) with significance tests"
          
      parameters:
        effect_size_metrics: ["cohens_f2", "semi_partial_r2"]
        bootstrap_ci: true
        bootstrap_iterations: 1000
        random_state: 42
        aic_weights: true
        incremental_validity: true
        
    validation_call:
      module: "tools.validation"
      function: "validate_effect_sizes"
      signature: "validate_effect_sizes(effect_sizes_df: pd.DataFrame, f2_column: str = 'cohens_f2') -> Dict[str, Any]"
      
      parameters:
        f2_bounds: [0, 5.0]
        aic_weight_sum: 1.0
        power_range: [0, 1.0]

  - name: "step06_validate_model_assumptions"
    step_number: 6
    description: "Comprehensive assumption checking with remedial actions for violations"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_extensions"  # CORRECTED: From tools.data to tools.analysis_extensions
      function: "validate_regression_assumptions"
      signature: "validate_regression_assumptions(residuals: np.ndarray, X: np.ndarray, significance_level: float = 0.05) -> Dict"
      
      input_files:
        - path: "results/ch7/7.7.3/data/step03_analysis_dataset.csv"  # HIERARCHICAL PATH
          required_columns: ["Total_z", "Learning_z", "LearningSlope_z", "Recognition_z", "theta_all"]
          
      output_files:
        - path: "results/ch7/7.7.3/data/step06_assumption_tests.csv"  # HIERARCHICAL PATH
          columns: ["model", "shapiro_stat", "shapiro_p", "bp_stat", "bp_p", "dw_stat", "max_vif", "outlier_count"]
          description: "Assumption test results (normality, homoscedasticity, independence, multicollinearity)"
        - path: "results/ch7/7.7.3/data/step06_diagnostic_data.csv"  # HIERARCHICAL PATH
          columns: ["model", "fitted", "residuals", "std_residuals", "cooks_d"]
          description: "Diagnostic data for residual plots and outlier detection"
        - path: "results/ch7/7.7.3/data/step06_robust_results.csv"  # HIERARCHICAL PATH
          columns: ["model", "predictor", "beta", "se_robust", "p_robust"]
          description: "HC3 robust standard errors if heteroscedasticity detected"
          
      parameters:
        assumption_tests: ["normality", "homoscedasticity", "multicollinearity", "independence", "outliers"]
        alpha: 0.05
        vif_threshold: 5.0
        cooks_d_threshold: 0.04  # 4/N where N=100
        robust_se: "HC3"
        
    validation_call:
      module: "tools.validation"
      function: "validate_lmm_assumptions_comprehensive"
      signature: "validate_lmm_assumptions_comprehensive(lmm_result: MixedLMResults, data: pd.DataFrame, output_dir: Path, acf_lag1_threshold: float = 0.1, alpha: float = 0.05) -> Dict"
      
      parameters:
        alpha: 0.05
        vif_threshold: 5.0
        outlier_threshold: 0.04
        assumption_tests: ["normality", "homoscedasticity", "independence", "outliers", "multicollinearity"]

  - name: "step07_cross_validation"
    step_number: 7
    description: "5-fold cross-validation to assess model generalizability and overfitting"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "cross_validate_regression"
      signature: "cross_validate_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_folds: int = 5, random_state: int = 42, scoring_metrics: List[str] = ['mse', 'r2']) -> Dict"
      
      input_files:
        - path: "results/ch7/7.7.3/data/step03_analysis_dataset.csv"  # HIERARCHICAL PATH
          required_columns: ["Total_z", "Learning_z", "LearningSlope_z", "Recognition_z", "theta_all"]
          
      output_files:
        - path: "results/ch7/7.7.3/data/step07_cv_results.csv"  # HIERARCHICAL PATH
          columns: ["fold", "model", "train_R2", "test_R2", "RMSE", "MAE"]
          description: "Cross-validation results per fold and model"
        - path: "results/ch7/7.7.3/data/step07_cv_summary.csv"  # HIERARCHICAL PATH
          columns: ["model", "mean_test_R2", "sd_test_R2", "mean_RMSE", "train_test_gap", "shrinkage", "overfitting_flag"]
          description: "Cross-validation performance summary with overfitting detection"
          
      parameters:
        n_folds: 5
        random_state: 42
        scoring_metrics: ["r2", "rmse", "mae"]
        overfitting_threshold: 0.10  # train-test R² gap
        
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_rows: Union[int, Tuple[int, int]], expected_columns: List[str], column_types: Optional[Dict[str, type]] = None) -> Dict[str, Any]"
      
      parameters:
        expected_cv_results: 25  # 5 folds × 5 models
        overfitting_checks: true

  - name: "step08_power_analysis"
    step_number: 8
    description: "Post-hoc power analysis and sensitivity testing for observed and minimal detectable effects"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_post_hoc_power"
      signature: "compute_post_hoc_power(n: int, k: int, r2: float, alpha: float = 0.05) -> Dict"
      
      input_files:
        - path: "results/ch7/7.7.3/data/step04_model_results.csv"  # HIERARCHICAL PATH
          required_columns: ["model", "R2"]
        - path: "results/ch7/7.7.3/data/step05_effect_sizes.csv"  # HIERARCHICAL PATH
          required_columns: ["model", "f2"]
          
      output_files:
        - path: "results/ch7/7.7.3/data/step08_power_analysis.csv"  # HIERARCHICAL PATH
          columns: ["model", "observed_f2", "alpha", "achieved_power", "interpretation", "adequate_power_flag"]
          description: "Post-hoc power analysis for observed effects"
        - path: "results/ch7/7.7.3/data/step08_sensitivity.csv"  # HIERARCHICAL PATH
          columns: ["effect_size", "f2_threshold", "required_N_80pct", "current_N_power"]
          description: "Sensitivity analysis (minimum detectable effects and required sample sizes)"
          
      parameters:
        n: 100
        alpha: 0.000358  # Bonferroni-corrected alpha
        power_target: 0.80
        effect_sizes_tested: [0.02, 0.15, 0.35]  # small, medium, large per Cohen (1988)
        
    validation_call:
      module: "tools.validation"
      function: "validate_effect_sizes"
      signature: "validate_effect_sizes(effect_sizes_df: pd.DataFrame, f2_column: str = 'cohens_f2') -> Dict[str, Any]"
      
      parameters:
        power_range: [0, 1.0]
        effect_size_bounds: [0, 5.0]

