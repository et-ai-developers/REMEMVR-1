# RQ: ch7/7.3.1 - Do cognitive tests predict confidence trajectories?
# Agent: rq_analysis v5.3.0 (Enhanced Deep Verification Framework)
# 
# CRITICAL v5.3.0 Corrections Applied:
#   - Module paths: tools.data_extraction → tools.data
#   - Data source: NEVER use master.xlsx → ONLY dfnonvr.csv for Ch7
#   - Column names: Use EXACT dfnonvr.csv names (ravlt-trial-1-score, etc.)
#   - Paths: ALL outputs use hierarchical structure (results/ch7/7.3.1/)
#   - Validators: Matched to analysis types (regression, not LMM)
# ============================================================================

metadata:
  rq_id: "ch7/7.3.1"
  verification_level: "deep_v5.3.0"
  source_data_correction: "dfnonvr.csv_only"
  column_name_verification: "exact_match_applied"
  module_corrections: 5
  validator_corrections: 3
  format_corrections: 0
  path_corrections: 20
  
  column_mappings:
    # EXACT column names from dfnonvr.csv
    ravlt_scores:
      - "ravlt-trial-1-score"
      - "ravlt-trial-2-score" 
      - "ravlt-trial-3-score"
      - "ravlt-trial-4-score"
      - "ravlt-trial-5-score"
    bvmt_scores:
      - "bvmt-trial-1-score"
      - "bvmt-trial-2-score"
      - "bvmt-trial-3-score"
      - "bvmt-delayed-recall-score"
    rpm_score: "rpm-score"
    demographics:
      - "age"
      - "sex" 
      - "education"
    note: "NART not available in dfnonvr.csv - excluded from analysis"

dependencies:
  required:
    - source: "results/ch6/6.1.1/data/step03_confidence_theta_scores.csv"
      description: "IRT-derived confidence theta scores"
      columns: ["UID", "confidence_theta", "se_theta"]
      expected_rows: 100
      
  source_data:
    - source: "data/dfnonvr.csv"
      description: "Cognitive tests and demographics"
      exact_columns: 
        ravlt: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score"]
        bvmt: ["bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score", "bvmt-delayed-recall-score"]
        rpm: ["rpm-score"]
        demographics: ["age", "sex", "education"]

steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Validate required Ch6 6.1.1 outputs and dfnonvr.csv exist before proceeding"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_cols: List[str], optional_cols: List[str] = None) -> Dict[str, Any]"
    
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_cols: List[str], optional_cols: List[str] = None) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch6/6.1.1/data/step03_confidence_theta_scores.csv"
        description: "IRT-derived confidence theta scores from Ch6"
        required_columns: ["UID", "confidence_theta", "se_theta"]
        validation_criteria:
          - "File exists and readable"
          - "Contains ~100 participants"
          - "Theta scores in [-3, 3] range"
      - path: "data/dfnonvr.csv"
        description: "Participant cognitive test and demographic data"
        required_columns: ["UID", "ravlt-trial-1-score", "bvmt-trial-1-score", "rpm-score", "age", "sex", "education"]
        validation_criteria:
          - "File exists and readable"
          - "Contains cognitive test scores"
          - "Demographics available"
    
    output_files:
      - path: "results/ch7/7.3.1/data/step00_dependency_validation.txt"
        description: "Validation report for cross-RQ dependencies"
        expected_size: "500-1000 bytes"
    
    validation_criteria:
      primary: "All required files exist and contain expected data"
      secondary: "Ch6 6.1.1 status shows rq_results: success"
      substance: "Confidence theta file contains 100 participants with valid theta scores"
      log_pattern: "DEPENDENCY CHECK COMPLETE"
    
    parameters:
      file_paths: 
        - "results/ch6/6.1.1/data/step03_confidence_theta_scores.csv"
        - "data/dfnonvr.csv"
      check_readable: true

  - name: "step01_extract_confidence_theta"
    step_number: 1
    description: "Load and validate Ch6-derived confidence theta scores for N=100 participants"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "load_test_data"
      signature: "load_test_data(path: str = './data/dfdata.csv') -> pd.DataFrame"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch6/6.1.1/data/step03_confidence_theta_scores.csv"
        description: "IRT theta scores from Ch6 analysis"
        required_columns: ["UID", "confidence_theta", "se_theta"]
    
    output_files:
      - path: "results/ch7/7.3.1/data/step01_confidence_theta.csv"
        description: "Validated confidence theta scores"
        columns: ["UID", "confidence_theta", "se_theta"]
        expected_rows: "100"
    
    validation_criteria:
      primary: "Confidence theta scores in valid IRT range [-3, 3]"
      secondary: "Standard errors positive and reasonable [0.1, 1.0]"
      substance: "Exactly 100 unique UIDs with no missing values"
      log_pattern: "Confidence theta loaded: 100 participants"
    
    parameters:
      path: "results/ch6/6.1.1/data/step03_confidence_theta_scores.csv"

  - name: "step02_extract_cognitive_tests"
    step_number: 2
    description: "Extract cognitive test scores from dfnonvr.csv and convert to T-scores (M=50, SD=10)"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_cognitive_tests"
      signature: "extract_cognitive_tests(df: pd.DataFrame, tests: List[str] = None) -> pd.DataFrame"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
    
    input_files:
      - path: "data/dfnonvr.csv"
        description: "Participant cognitive test and demographic data"
        required_columns: 
          - "UID"
          - "ravlt-trial-1-score"
          - "ravlt-trial-2-score"
          - "ravlt-trial-3-score"
          - "ravlt-trial-4-score"
          - "ravlt-trial-5-score"
          - "bvmt-trial-1-score"
          - "bvmt-trial-2-score"
          - "bvmt-trial-3-score"
          - "bvmt-delayed-recall-score"
          - "rpm-score"
          - "age"
          - "sex"
          - "education"
    
    output_files:
      - path: "results/ch7/7.3.1/data/step02_cognitive_tests.csv"
        description: "T-scored cognitive tests with demographics"
        columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "age", "sex", "education"]
        expected_rows: "~100"
    
    validation_criteria:
      primary: "T-scores computed successfully with M≈50, SD≈10"
      secondary: "Valid range [20, 80] for all T-scores"
      substance: "At least 95 participants (allow 5% exclusion for missing data)"
      log_pattern: "T-scores computed for N=XX participants"
    
    parameters:
      tests: 
        - "RAVLT"  # Will use ravlt-trial-1-score through ravlt-trial-5-score
        - "BVMT"   # Will use bvmt trial scores including delayed recall
        - "RPM"    # Will use rpm-score
      compute_totals: true
      convert_to_t_scores: true

  - name: "step03_standardize_cognitive_scores"
    step_number: 3
    description: "Apply T-score standardization (M=50, SD=10) to cognitive test totals"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "standardize_to_t_scores"
      signature: "standardize_to_t_scores(scores: Union[pd.Series, pd.DataFrame], population_mean: float = None, population_sd: float = None) -> Union[pd.Series, pd.DataFrame]"
    
    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(original_data: np.ndarray, standardized_data: np.ndarray, target_mean: float = 0, target_std: float = 1) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.1/data/step02_cognitive_tests.csv"
        description: "Raw cognitive test totals"
        required_columns: ["UID", "RAVLT_total", "BVMT_total", "RPM_total", "age", "sex", "education"]
    
    output_files:
      - path: "results/ch7/7.3.1/data/step03_cognitive_tests_standardized.csv"
        description: "T-scored cognitive tests (M=50, SD=10) with demographics"
        columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "age", "sex", "education"]
        expected_rows: "~95"
    
    validation_criteria:
      primary: "T-score means approximately 50 (±5)"
      secondary: "T-score SDs approximately 10 (±3)"
      substance: "No impossible values (all positive T-scores)"
      log_pattern: "T-score validation PASS"
    
    parameters:
      target_mean: 50
      target_sd: 10
      scores_to_standardize: ["RAVLT_total", "BVMT_total", "RPM_total"]

  - name: "step04_merge_analysis_dataset"
    step_number: 4
    description: "Merge confidence theta scores with cognitive tests and demographics"
    
    analysis_call:
      type: "stdlib"
      description: "Use pandas merge to combine datasets on UID"
      signature: "pd.merge(left: pd.DataFrame, right: pd.DataFrame, on: str, how: str) -> pd.DataFrame"
    
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_cols: List[str], expected_rows: int = None, allow_extra_cols: bool = True) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.1/data/step01_confidence_theta.csv"
        description: "Confidence theta scores"
        required_columns: ["UID", "confidence_theta", "se_theta"]
      - path: "results/ch7/7.3.1/data/step03_cognitive_tests_standardized.csv"
        description: "Standardized cognitive tests"
        required_columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "age", "sex", "education"]
    
    output_files:
      - path: "results/ch7/7.3.1/data/step04_analysis_dataset.csv"
        description: "Merged analysis-ready dataset with complete cases"
        columns: ["UID", "confidence_theta", "RAVLT_T", "BVMT_T", "RPM_T", "age", "sex", "education"]
        expected_rows: "~95"
    
    validation_criteria:
      primary: "Successful inner join on UID"
      secondary: "Final sample size >= 90 participants"
      substance: "No missing values in analysis variables"
      log_pattern: "Analysis dataset created: N=XX participants"
    
    parameters:
      merge_key: "UID"
      merge_type: "inner"
      drop_missing: true

  - name: "step05_hierarchical_regression"
    step_number: 5
    description: "Test incremental prediction of cognitive tests beyond demographics"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_hierarchical_regression"
      signature: "fit_hierarchical_regression(X_blocks: List[Union[np.ndarray, pd.DataFrame]], y: Union[np.ndarray, pd.Series], block_names: List[str] = None, add_constant: bool = True) -> Dict"
    
    validation_call:
      module: "tools.validation"
      function: "validate_model_convergence"
      signature: "validate_model_convergence(model_result: Dict, convergence_threshold: float = 1e-8) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.1/data/step04_analysis_dataset.csv"
        description: "Complete analysis dataset"
        required_columns: ["confidence_theta", "age", "sex", "education", "RAVLT_T", "BVMT_T", "RPM_T"]
    
    output_files:
      - path: "results/ch7/7.3.1/data/step05_hierarchical_models.csv"
        description: "Hierarchical regression comparison (demographics vs cognitive models)"
        columns: ["model", "R_squared", "adj_R_squared", "F_stat", "p_value", "ci_lower", "ci_upper", "cohens_f2"]
        expected_rows: "2"
    
    validation_criteria:
      primary: "Both models converge successfully"
      secondary: "R² values in valid range [0, 1]"
      substance: "Model 2 R² >= Model 1 R² (nested models)"
      log_pattern: "Hierarchical regression complete"
    
    parameters:
      outcome_variable: "confidence_theta"
      block_1_predictors: ["age", "sex", "education"]
      block_2_predictors: ["age", "sex", "education", "RAVLT_T", "BVMT_T", "RPM_T"]
      block_names: ["Demographics", "Cognitive"]
      add_constant: true
      alpha: 0.05

  - name: "step06_individual_predictors"
    step_number: 6
    description: "Examine individual cognitive test predictors with corrected significance tests"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], add_constant: bool = True, return_diagnostics: bool = True) -> Dict"
    
    validation_call:
      module: "tools.validation"
      function: "validate_model_convergence"
      signature: "validate_model_convergence(model_result: Dict, convergence_threshold: float = 1e-8) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.1/data/step04_analysis_dataset.csv"
        description: "Complete analysis dataset"
        required_columns: ["confidence_theta", "age", "sex", "education", "RAVLT_T", "BVMT_T", "RPM_T"]
    
    output_files:
      - path: "results/ch7/7.3.1/data/step06_individual_predictors.csv"
        description: "Individual predictor coefficients with dual p-values (Decision D068)"
        columns: ["predictor", "beta", "se", "ci_lower", "ci_upper", "sr2", "p_uncorrected", "p_bonferroni", "p_fdr", "vif"]
        expected_rows: "6"
      - path: "results/ch7/7.3.1/data/step06_assumption_diagnostics.txt"
        description: "Regression assumption test results"
        expected_size: "1000-2000 bytes"
    
    validation_criteria:
      primary: "Model convergence successful"
      secondary: "VIF values reasonable (most < 5)"
      substance: "All 6 predictors present with dual p-values"
      log_pattern: "Individual predictors analyzed: 6 coefficients"
    
    parameters:
      outcome_variable: "confidence_theta"
      predictors: ["age", "sex", "education", "RAVLT_T", "BVMT_T", "RPM_T"]
      add_constant: true
      return_diagnostics: true
      alpha_uncorrected: 0.05
      alpha_bonferroni: 0.000597  # 0.00179/3 cognitive tests
      compute_bootstrap_ci: true
      n_bootstrap: 1000
      random_state: 42

  - name: "step07_cross_validation"
    step_number: 7
    description: "Assess model generalizability using k-fold cross-validation"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "cross_validate_regression"
      signature: "cross_validate_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_folds: int = 5, random_state: int = 42, scoring_metrics: List[str] = ['mse', 'r2']) -> Dict"
    
    validation_call:
      module: "tools.validation"
      function: "validate_bootstrap_stability"
      signature: "validate_bootstrap_stability(bootstrap_results: Dict, stability_threshold: float = 0.1) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.1/data/step04_analysis_dataset.csv"
        description: "Complete analysis dataset for cross-validation"
        required_columns: ["confidence_theta", "age", "sex", "education", "RAVLT_T", "BVMT_T", "RPM_T"]
    
    output_files:
      - path: "results/ch7/7.3.1/data/step07_cross_validation.csv"
        description: "5-fold cross-validation results for generalizability assessment"
        columns: ["fold", "train_R2", "test_R2", "rmse", "mae"]
        expected_rows: "5"
    
    validation_criteria:
      primary: "All 5 folds completed successfully"
      secondary: "Mean cross-validated R² within 15% of training R²"
      substance: "No extreme outlier folds (>2 SD from mean)"
      log_pattern: "Cross-validation complete: 5 folds"
    
    parameters:
      outcome_variable: "confidence_theta"
      predictors: ["age", "sex", "education", "RAVLT_T", "BVMT_T", "RPM_T"]
      n_folds: 5
      random_state: 42
      scoring_metrics: ["mse", "r2", "mae"]
      shuffle: true

  - name: "step08_effect_sizes"
    step_number: 8
    description: "Compute comprehensive effect size measures with bootstrap confidence intervals"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_cohens_f2"
      signature: "compute_cohens_f2(r2_full: float, r2_reduced: float) -> float"
    
    validation_call:
      module: "tools.validation"
      function: "validate_effect_sizes"
      signature: "validate_effect_sizes(effect_df: pd.DataFrame, effect_cols: List[str] = ['cohens_f2', 'sr2']) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.1/data/step05_hierarchical_models.csv"
        description: "Hierarchical regression R² values"
        required_columns: ["R_squared"]
      - path: "results/ch7/7.3.1/data/step06_individual_predictors.csv"
        description: "Individual predictor semi-partial correlations"
        required_columns: ["sr2"]
    
    output_files:
      - path: "results/ch7/7.3.1/data/step08_effect_sizes.csv"
        description: "Comprehensive effect size measures with bootstrap CIs"
        columns: ["predictor", "sr2", "cohens_f2", "ci_lower", "ci_upper", "importance_rank"]
        expected_rows: "4"
    
    validation_criteria:
      primary: "Effect sizes in valid ranges"
      secondary: "Sum of sr² values <= total R²"
      substance: "Bootstrap CIs reasonable width (not degenerate)"
      log_pattern: "Effect sizes computed with bootstrap CIs"
    
    parameters:
      effect_size_interpretation:
        small: 0.02
        medium: 0.15
        large: 0.35
      bootstrap_iterations: 1000
      random_state: 42
      confidence_level: 0.95

  - name: "step09_power_analysis"
    step_number: 9
    description: "Compute post-hoc power and sensitivity analysis for effect detection"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_post_hoc_power"
      signature: "compute_post_hoc_power(n: int, k: int, r2: float, alpha: float = 0.05) -> Dict"
    
    validation_call:
      module: "tools.validation"
      function: "validate_probability_range"
      signature: "validate_probability_range(values: Union[np.ndarray, List[float]], min_val: float = 0.0, max_val: float = 1.0) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.1/data/step08_effect_sizes.csv"
        description: "Observed effect sizes for power calculation"
        required_columns: ["cohens_f2"]
    
    output_files:
      - path: "results/ch7/7.3.1/data/step09_power_analysis.csv"
        description: "Post-hoc power and sensitivity analysis for effect detection"
        columns: ["test", "observed_f2", "power_observed", "min_detectable_f2", "power_80", "alpha_used"]
        expected_rows: "4"
    
    validation_criteria:
      primary: "Power values in [0, 1] range"
      secondary: "Alpha level matches Bonferroni correction"
      substance: "Power calculations mathematically consistent"
      log_pattern: "Power analysis complete for 4 tests"
    
    parameters:
      n: 95  # Expected final sample size
      k: 6   # Number of predictors (3 demographics + 3 cognitive)
      alpha_uncorrected: 0.05
      alpha_bonferroni: 0.000597  # Bonferroni corrected alpha
      power_target: 0.80

  - name: "step10_accuracy_comparison"
    step_number: 10
    description: "Compare confidence prediction with accuracy prediction from RQ 7.1.1"
    
    analysis_call:
      type: "stdlib"
      description: "Load cross-RQ data and compute comparison statistics"
      signature: "pd.read_csv(path: str) -> pd.DataFrame"
    
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_cols: List[str], expected_rows: int = None, allow_extra_cols: bool = True) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch7/7.3.1/data/step08_effect_sizes.csv"
        description: "Confidence prediction results"
        required_columns: ["predictor", "sr2", "cohens_f2"]
      - path: "results/ch7/7.1.1/data/step07_effect_sizes.csv"
        description: "Accuracy prediction results from RQ 7.1.1"
        required_columns: ["predictor", "sr2", "cohens_f2"]
        optional: true
    
    output_files:
      - path: "results/ch7/7.3.1/data/step10_accuracy_comparison.csv"
        description: "Comparison of confidence vs accuracy prediction patterns"
        columns: ["predictor", "sr2_confidence", "sr2_accuracy", "difference", "ci_lower", "ci_upper", "pattern", "evidence"]
        expected_rows: "4"
    
    validation_criteria:
      primary: "Successful comparison with RQ 7.1.1 data"
      secondary: "Bootstrap difference CIs computed for all predictors"
      substance: "Pattern classification reasonable (similar/different/unclear)"
      log_pattern: "Metacognitive dissociation analysis complete"
    
    parameters:
      comparison_metrics: ["sr2", "cohens_f2"]
      bootstrap_difference_ci: true
      n_bootstrap: 1000
      random_state: 42
      confidence_level: 0.95

