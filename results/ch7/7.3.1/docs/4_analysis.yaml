expected_outputs:
  data_files:
    - "results/ch7/7.3.1/data/step00_dependency_validation.txt"
    - "results/ch7/7.3.1/data/step01_confidence_theta.csv"
    - "results/ch7/7.3.1/data/step02_cognitive_tests.csv"
    - "results/ch7/7.3.1/data/step03_cognitive_tests_standardized.csv"
    - "results/ch7/7.3.1/data/step04_analysis_dataset.csv"
    - "results/ch7/7.3.1/data/step05_hierarchical_models.csv"
    - "results/ch7/7.3.1/data/step06_individual_predictors.csv"
    - "results/ch7/7.3.1/data/step06_assumption_diagnostics.txt"
    - "results/ch7/7.3.1/data/step07_cross_validation.csv"
    - "results/ch7/7.3.1/data/step08_effect_sizes.csv"
    - "results/ch7/7.3.1/data/step09_power_analysis.csv"
    - "results/ch7/7.3.1/data/step10_accuracy_comparison.csv"
  
  log_files:
