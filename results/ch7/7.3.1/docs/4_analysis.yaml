    - "results/ch7/7.3.1/logs/step04_dataset_merge.log"
    - "results/ch7/7.3.1/logs/step05_hierarchical_regression.log"
    - "results/ch7/7.3.1/logs/step06_predictor_analysis.log"
    - "results/ch7/7.3.1/logs/step07_cross_validation.log"
    - "results/ch7/7.3.1/logs/step08_effect_sizes.log"
    - "results/ch7/7.3.1/logs/step09_power_analysis.log"
    - "results/ch7/7.3.1/logs/step10_accuracy_comparison.log"

