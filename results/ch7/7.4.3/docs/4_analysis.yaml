        description: "What-domain theta scores (simple single-domain performance)"
    
    parameters:
      filepath_or_buffer: "results/ch5/5.2.1/data/step03_theta_scores.csv"
    
    custom_code: |
      # Read Ch5 5.2.1 theta scores (domain-specific)
      df_domains = pd.read_csv('results/ch5/5.2.1/data/step03_theta_scores.csv')
      
      # Extract UID from composite_ID (format: A010_1 -> A010)
      df_domains['UID'] = df_domains['composite_ID'].str.extract(r'([A-Z]\d+)')
      
      # Average What theta scores across tests for each participant
      df_theta_what = df_domains.groupby('UID')['theta_what'].agg(['mean', 'std', 'count']).reset_index()
      df_theta_what.columns = ['UID', 'theta_what', 'se_what', 'n_tests']
      
      # Convert std to standard error
      df_theta_what['se_what'] = df_theta_what['se_what'] / np.sqrt(df_theta_what['n_tests'])
      df_theta_what = df_theta_what.drop('n_tests', axis=1)
      
      # Fill missing SE values with mean SE
      df_theta_what['se_what'] = df_theta_what['se_what'].fillna(df_theta_what['se_what'].mean())
      
      df_theta_what.to_csv('results/ch7/7.4.3/data/step03_what_theta.csv', index=False)
    
    validation_call:
