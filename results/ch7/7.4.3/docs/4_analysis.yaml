        columns: ["UID", "theta_overall", "se_overall"]
        description: "Overall omnibus theta scores (complex integration performance)"
    
    parameters:
      filepath_or_buffer: "results/ch5/5.1.1/data/step03_theta_scores.csv"
    
    custom_code: |
      # Read Ch5 5.1.1 theta scores (omnibus across all domains)
      df_overall = pd.read_csv('results/ch5/5.1.1/data/step03_theta_scores.csv')
      
      # Average theta scores across tests for each participant
      df_theta_overall = df_overall.groupby('UID')['Theta_All'].agg(['mean', 'std', 'count']).reset_index()
      df_theta_overall.columns = ['UID', 'theta_overall', 'se_overall', 'n_tests']
      
      # Convert std to standard error  
      df_theta_overall['se_overall'] = df_theta_overall['se_overall'] / np.sqrt(df_theta_overall['n_tests'])
      df_theta_overall = df_theta_overall.drop('n_tests', axis=1)
      
      # Fill missing SE values with mean SE
      df_theta_overall['se_overall'] = df_theta_overall['se_overall'].fillna(df_theta_overall['se_overall'].mean())
      
      df_theta_overall.to_csv('results/ch7/7.4.3/data/step02_overall_theta.csv', index=False)
    
