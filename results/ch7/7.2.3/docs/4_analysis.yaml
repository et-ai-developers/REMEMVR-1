        - path: "results/ch7/7.2.3/data/step01_merged_data.csv"
          columns: ["UID", "Age", "theta_all", "RAVLT_T", "BVMT_T", "NART_T", "RPM_T"]
          expected_rows: 100
        - path: "results/ch7/7.2.3/data/step01_descriptives.csv"
          content: "Descriptive statistics for all variables"
        
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_columns"
      verified: true

  - name: "step02_center_predictors_create_interactions"
    verification_notes: "standardize_scores verified in tools.analysis_extensions"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_extensions"
      function: "standardize_scores"
      # VERIFIED SIGNATURE from actual code
      signature: "standardize_scores(scores: Union[np.ndarray, pd.Series], mean: Optional[float] = None, sd: Optional[float] = None) -> np.ndarray"
      
      input_files:
        - path: "results/ch7/7.2.3/data/step01_merged_data.csv"
          required_columns: ["UID", "Age", "theta_all", "RAVLT_T", "BVMT_T", "NART_T", "RPM_T"]
          source: "step01 output"
      
      parameters:
        # SPECIFIC CENTERING APPROACH
        center_age: true
        center_cognitive_at: 50.0  # T-score mean
        create_interactions: true
        interaction_terms: ["Age_c_x_RAVLT_c", "Age_c_x_BVMT_c", "Age_c_x_NART_c", "Age_c_x_RPM_c"]
        check_multicollinearity: true
        correlation_threshold: 0.70
        
      outputs:
        # HIERARCHICAL PATHS
        - path: "results/ch7/7.2.3/data/step02_centered_predictors.csv"
          columns: ["UID", "theta_all", "Age", "Age_c", "RAVLT_T", "RAVLT_c", "BVMT_T", "BVMT_c", "NART_T", "NART_c", "RPM_T", "RPM_c", "Age_c_x_RAVLT_c", "Age_c_x_BVMT_c", "Age_c_x_NART_c", "Age_c_x_RPM_c"]
        - path: "results/ch7/7.2.3/data/step02_correlation_matrix.csv"
          content: "Predictor correlations for multicollinearity check"
          
