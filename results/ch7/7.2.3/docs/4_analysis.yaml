        - "interaction_coefs = pd.read_csv('results/ch7/7.2.3/data/step03_interaction_coefficients.csv')"
        - "predictors_df = pd.read_csv('results/ch7/7.2.3/data/step02_centered_predictors.csv')"
        
        # Check which interactions significant (Bonferroni corrected)
        - "significant_interactions = interaction_coefs[interaction_coefs['p_bonferroni'] < 0.0125]"
        
        # For significant interactions only
        - "if len(significant_interactions) > 0:"
        - "    # Compute simple slopes at Age +/- 1SD"
        - "    age_sd = predictors_df['Age_c'].std()"
        - "    younger_age = -age_sd"
        - "    older_age = +age_sd"
        - "    "
        - "    slopes_results = []"
        - "    for _, interaction in significant_interactions.iterrows():"
        - "        test_name = interaction['test_name']"
        - "        # Compute slopes and significance tests"
        - "        # [Detailed simple slopes computation]"
        - "        pass"
        - "    "
        - "    slopes_df = pd.DataFrame(slopes_results)"
        - "    slopes_df.to_csv('results/ch7/7.2.3/data/step04_simple_slopes.csv', index=False)"
        - "else:"
        - "    # No significant interactions"
        - "    with open('results/ch7/7.2.3/data/step04_slopes_summary.txt', 'w') as f:"
        - "        f.write('No significant Age x Test interactions found (all p_bonf > 0.0125)')"
        
      input_files:
        - path: "results/ch7/7.2.3/data/step03_interaction_coefficients.csv"
          source: "step03 output"
        - path: "results/ch7/7.2.3/data/step02_centered_predictors.csv"
          source: "step02 output"
      
      outputs:
        # HIERARCHICAL PATHS
        - path: "results/ch7/7.2.3/data/step04_simple_slopes.csv"
          columns: ["test_name", "age_level", "slope", "se", "t_value", "p_value", "CI_lower", "CI_upper"]
          conditional: "Only if significant interactions found"
        - path: "results/ch7/7.2.3/data/step04_slopes_summary.txt"
          content: "Interpretation summary or null findings statement"
        - path: "results/ch7/7.2.3/data/step04_interaction_plots.csv"
          content: "Plot data for significant interactions (if any)"
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_dataframe_structure"
      verified: true

