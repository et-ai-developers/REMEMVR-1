      type: "catalogued"  
      module: "tools.validation"
      function: "validate_standardization"
      verified: true

  - name: "step03_fit_interaction_models"
    verification_notes: "fit_multiple_regression verified in tools.analysis_regression"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      # VERIFIED SIGNATURE from actual code
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], add_constant: bool = True, return_diagnostics: bool = True) -> Dict"
      
      input_files:
        - path: "results/ch7/7.2.3/data/step02_centered_predictors.csv"
          required_columns: ["theta_all", "Age_c", "RAVLT_c", "BVMT_c", "NART_c", "RPM_c", "Age_c_x_RAVLT_c", "Age_c_x_BVMT_c", "Age_c_x_NART_c", "Age_c_x_RPM_c"]
          source: "step02 output"
      
      parameters:
        # SPECIFIC MODEL FORMULATIONS
        models_to_fit:
          - name: "RAVLT_interaction"
            formula: "theta_all ~ Age_c + RAVLT_c + Age_c_x_RAVLT_c"
            predictors: ["Age_c", "RAVLT_c", "Age_c_x_RAVLT_c"]
          - name: "BVMT_interaction"
            formula: "theta_all ~ Age_c + BVMT_c + Age_c_x_BVMT_c"
            predictors: ["Age_c", "BVMT_c", "Age_c_x_BVMT_c"]
          - name: "NART_interaction"
            formula: "theta_all ~ Age_c + NART_c + Age_c_x_NART_c"
            predictors: ["Age_c", "NART_c", "Age_c_x_NART_c"]
          - name: "RPM_interaction"
            formula: "theta_all ~ Age_c + RPM_c + Age_c_x_RPM_c"
            predictors: ["Age_c", "RPM_c", "Age_c_x_RPM_c"]
        
        # DECISION D068 DUAL P-VALUES
        family_alpha: 0.05
        bonferroni_n: 4  # 4 interaction tests
        return_dual_pvalues: true  # uncorrected + Bonferroni
        
        add_constant: true
        return_diagnostics: true
        compute_vif: true
        
      outputs:
        # HIERARCHICAL PATHS
        - path: "results/ch7/7.2.3/data/step03_interaction_models.csv"
          columns: ["model", "R2", "adj_R2", "F_stat", "F_p", "interaction_coef", "interaction_se", "interaction_p_uncorr", "interaction_p_bonf", "VIF_age", "VIF_test", "VIF_interaction"]
        - path: "results/ch7/7.2.3/data/step03_interaction_coefficients.csv" 
          columns: ["test_name", "interaction_coef", "se", "t_value", "p_uncorrected", "p_bonferroni", "significant_bonf"]
          
