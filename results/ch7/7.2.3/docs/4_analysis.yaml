  - name: "step01_extract_and_merge_data"
    verification_notes: "Combined step using verified extract_cognitive_tests + merge_theta_cognitive"
    
    analysis_call:
      type: "stdlib"
      # SPECIFIC FUNCTION CALLS - no vague operations
      operations:
        - "import pandas as pd"
        - "import numpy as np"
        - "from tools.data import extract_cognitive_tests, extract_domain_theta_scores, merge_theta_cognitive"
        
        # Extract theta scores from Ch5
        - "theta_df = extract_domain_theta_scores('results/ch5/5.1.1', 'All')"
        - "# Process theta to get mean per participant"
        - "theta_means = theta_df.groupby('UID')['Theta_All'].mean().reset_index()"
        - "theta_means.rename(columns={'Theta_All': 'theta_all'}, inplace=True)"
        
        # Extract cognitive tests from dfnonvr.csv (NOT master.xlsx)
        - "cognitive_df = pd.read_csv('data/dfnonvr.csv')"
        - "# Select cognitive test columns with Ch7 naming"
        - "cog_cols = ['UID', 'Age', 'RAVLT_T', 'BVMT_T', 'NART_T', 'RPM_T']"
        - "cognitive_clean = cognitive_df[cog_cols].dropna()"
        
        # Merge datasets
        - "merged_df = merge_theta_cognitive(theta_means, cognitive_clean)"
        - "merged_df.to_csv('results/ch7/7.2.3/data/step01_merged_data.csv', index=False)"
        
        # Descriptive statistics
        - "desc_stats = merged_df.describe()"
        - "desc_stats.to_csv('results/ch7/7.2.3/data/step01_descriptives.csv')"
        
      input_files:
