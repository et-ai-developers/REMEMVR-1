          columns: ["fold", "test_name", "train_R2", "test_R2", "interaction_coef", "interaction_p", "overfitting_flag"]
          rows: 20  # 5 folds × 4 tests
        - path: "results/ch7/7.2.3/data/step07_cv_summary.csv"
          columns: ["test_name", "mean_interaction_coef", "std_interaction_coef", "mean_test_R2", "overfitting_flag", "stability_assessment"]
          
    validation_call:
