          - "theta_all ~ Age_c + BVMT_c + Age_c_x_BVMT_c"
          - "theta_all ~ Age_c + NART_c + Age_c_x_NART_c"
          - "theta_all ~ Age_c + RPM_c + Age_c_x_RPM_c"
        
