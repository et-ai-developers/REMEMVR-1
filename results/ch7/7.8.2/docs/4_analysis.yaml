metadata:
  rq_id: "ch7/7.8.2"
  title: "Profile External Validation"
  description: "Do cognitive test profiles correspond to REMEMVR profiles?"
  verification_level: "deep_v5.3.0"
  total_steps: 6
  
  # V5.3.0 VERIFICATION REPORT
  deep_verification_summary:
    module_corrections: 3
    function_corrections: 2
    path_corrections: 14  # All paths made hierarchical
    data_source_corrections: 1  # master.xlsx -> dfnonvr.csv
    column_name_corrections: 8   # Updated to hyphen format
    dependency_issues: 1  # RQ 7.8.1 missing data
    
  corrections_applied:
    - "MODULE: tools.data_io.load_excel_data -> tools.data.load_participant_data"
    - "MODULE: tools.data_processing.merge_dataframes_inner -> pandas built-in merge"
    - "DATA SOURCE: data/cache/master.xlsx -> data/dfnonvr.csv (Ch7 mandate)"
    - "COLUMN NAMES: RAVLT_total -> ravlt-trial-1-score + ravlt-trial-2-score + ... (hyphen format)"
    - "COLUMN NAMES: BVMT_total -> bvmt-total-recall (actual column per DATA_DICTIONARY)"
    - "COLUMN NAMES: RPM_total -> rpm-score (actual column per DATA_DICTIONARY)"
    - "PATHS: All output paths converted to hierarchical results/ch7/7.8.2/ structure"
    - "DEPENDENCY: RQ 7.8.1 missing data handled as circuit breaker in step 0"

# ============================================================================
# STEP 0: DEPENDENCY VALIDATION WITH CIRCUIT BREAKER
# ============================================================================

steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "CRITICAL: Validate cross-RQ dependencies with circuit breaker for missing RQ 7.8.1"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: str) -> Dict[str, Any]"
      
    # DEPENDENCY CIRCUIT BREAKER LOGIC
    dependency_checks:
      primary_dependency:
        file: "results/ch7/7.8.1/status.yaml"
        required_status: "rq_results: success"
        action_if_missing: "EXPECTATIONS ERROR: RQ 7.8.1 must complete before 7.8.2 external validation"
        
      rememvr_profiles:
        primary: "results/ch7/7.8.1/data/step03_rememvr_profile_classifications.csv"
        fallback_patterns:
          - "results/ch7/7.8.1/data/*profile*.csv"
          - "results/ch7/7.8.1/data/*lpa*.csv"
        action_if_missing: "STEP ERROR: Cannot find REMEMVR profile assignments from RQ 7.8.1"
        
      cognitive_data:
        file: "data/dfnonvr.csv"
        required_columns: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "bvmt-total-recall", "rpm-score"]
        action_if_missing: "EXPECTATIONS ERROR: Cognitive test data not available in dfnonvr.csv"

    input_files:
      - path: "results/ch7/7.8.1/status.yaml"
        format: "yaml"
        required: true
        description: "RQ 7.8.1 completion status"
        
      - path: "data/dfnonvr.csv"  # CORRECTED: Not master.xlsx
        format: "csv"
        required: true
        required_columns: ["UID", "ravlt-trial-1-score", "bvmt-total-recall", "rpm-score"]
        description: "Cognitive test data with hyphen-formatted column names"
        
    output_files:
      - path: "results/ch7/7.8.2/data/step00_dependency_validation.txt"  # CORRECTED: Hierarchical path
        format: "text"
        description: "Dependency validation results with circuit breaker actions"
        
    parameters:
      circuit_breaker_mode: true
      quit_on_missing_dependency: true
      log_all_checks: true
      
    validation_call:
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"

# ============================================================================
# STEP 1: EXTRACT COGNITIVE DATA (FIXED FOR CH7)
# ============================================================================

  - name: "step01_extract_cognitive_tests"
    step_number: 1
    description: "Extract cognitive test scores from dfnonvr.csv and standardize to T-scores"
    depends_on: ["step00_validate_dependencies"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"  # CORRECTED: tools.data_io -> tools.data
      function: "load_participant_data"  # CORRECTED: load_excel_data -> load_participant_data
      signature: "load_participant_data(path: str = './data/dfnonvr.csv') -> pd.DataFrame"
      
    # COGNITIVE TEST SCORE EXTRACTION (Ch7 SPECIFIC)
    cognitive_test_mapping:
      RAVLT_total:
        source_columns: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score"]
        operation: "sum"
        description: "Sum of RAVLT learning trials 1-5"
        
      BVMT_total:
        source_columns: ["bvmt-total-recall"]  # CORRECTED: Already computed in dfnonvr.csv
        operation: "direct"
        description: "BVMT total recall score (sum of trials 1-3)"
        
      RPM_total:
        source_columns: ["rpm-score"]  # CORRECTED: Use actual column name
        operation: "direct"
        description: "Raven's Progressive Matrices total score"

    input_files:
      - path: "data/dfnonvr.csv"  # CORRECTED: Not cache/master.xlsx
        format: "csv"
        required_columns: ["UID", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "bvmt-total-recall", "rpm-score"]
        expected_rows: 100
        data_types:
          UID: "string"
          "ravlt-trial-1-score": "int"
          "bvmt-total-recall": "int" 
          "rpm-score": "int"
        description: "Participant cognitive test data"

    processing:
      standardization:
        method: "t_scores"
        target_mean: 50
        target_sd: 10
        apply_to: ["RAVLT_total", "BVMT_total", "RPM_total"]
        
      missing_data:
        action: "exclude_participant"
        threshold: "any_missing_cognitive_test"
        document_exclusions: true
        
      outlier_detection:
        method: "iqr"
        threshold: 1.5
        action: "document_only"

    output_files:
      - path: "results/ch7/7.8.2/data/step01_cognitive_lpa_input.csv"  # CORRECTED: Hierarchical
        columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T"]
        description: "T-score standardized cognitive test data for LPA"
        
      - path: "results/ch7/7.8.2/data/step01_cognitive_descriptives.csv"  # CORRECTED: Hierarchical
        columns: ["test", "raw_mean", "raw_sd", "t_mean", "t_sd", "n_valid", "n_excluded"]
        description: "Descriptive statistics and exclusion summary"

    parameters:
      path: "data/dfnonvr.csv"  # CORRECTED: From DATA_DICTIONARY source
      standardization_method: "t_scores"
      target_mean: 50
      target_sd: 10
      random_seed: 42

    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(df: pd.DataFrame, column_names: List[str], tolerance: float = 0.01) -> Dict[str, Any]"

# ============================================================================
# STEP 2: COGNITIVE LPA (VERIFIED MODULE)
# ============================================================================

  - name: "step02_fit_cognitive_lpa"
    step_number: 2
    description: "Fit cognitive test LPA models with comprehensive model selection"
    depends_on: ["step01_extract_cognitive_tests"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_lpa"  # VERIFIED: Module exists
      function: "fit_lpa_models"     # VERIFIED: Function exists
      signature: "fit_lpa_models(X: Union[np.ndarray, pd.DataFrame], k_range: List[int], seed: int = 42, covariance_type: str = 'full', max_iter: int = 100, n_init: int = 10) -> Dict[str, Any]"

    input_files:
      - path: "results/ch7/7.8.2/data/step01_cognitive_lpa_input.csv"  # CORRECTED: Hierarchical
        required_columns: ["RAVLT_T", "BVMT_T", "RPM_T"]
        expected_rows: [90, 100]
        description: "T-score standardized cognitive test matrix"

    lpa_parameters:
      k_range: [2, 3, 4]  # Limited by N=100 sample size
      covariance_type: "full"
      max_iter: 5000      # Enhanced convergence
      n_init: 500         # Enhanced random starts
      seed: 42
      convergence_threshold: 0.01
      
    model_selection:
      criteria: ["BIC", "AIC", "entropy", "BLRT"]
      entropy_threshold: 0.70
      bootstrap_blrt: 100
      
    split_sample_validation:
      enabled: true
      split_ratio: 0.7
      seed: 42

    output_files:
      - path: "results/ch7/7.8.2/data/step02_lpa_model_comparison.csv"  # CORRECTED: Hierarchical
        columns: ["n_components", "BIC", "AIC", "log_likelihood", "entropy", "converged", "blrt_p"]
        description: "Model comparison results for K=2,3,4 profiles"
        
      - path: "results/ch7/7.8.2/data/step02_cognitive_profile_classifications.csv"  # CORRECTED: Hierarchical
        columns: ["UID", "profile", "max_probability", "entropy"]
        description: "Optimal profile assignments with posterior probabilities"
        
      - path: "results/ch7/7.8.2/data/step02_profile_descriptives.csv"  # CORRECTED: Hierarchical
        columns: ["profile", "RAVLT_mean", "BVMT_mean", "RPM_mean", "size", "proportion"]
        description: "Profile characteristics for interpretation"
        
      - path: "results/ch7/7.8.2/data/step02_split_sample_validation.csv"  # CORRECTED: Hierarchical
        columns: ["validation_metric", "training_value", "test_value", "agreement"]
        description: "Split-sample stability assessment"

    parameters:
      k_range: [2, 3, 4]
      seed: 42
      max_iter: 5000
      n_init: 500

    validation_call:
      module: "tools.analysis_lpa"  # VERIFIED: Validation function in same module
      function: "validate_lpa_solution"
      signature: "validate_lpa_solution(data: Union[np.ndarray, pd.DataFrame], labels: Union[np.ndarray, pd.Series], metric: str = 'euclidean') -> Dict"

# ============================================================================
# STEP 3: MERGE PROFILES (FIXED DEPENDENCY ISSUE)
# ============================================================================

  - name: "step03_merge_profile_classifications"
    step_number: 3
    description: "Merge cognitive and REMEMVR profiles with dependency circuit breaker"
    depends_on: ["step02_fit_cognitive_lpa"]
    
    analysis_call:
      type: "stdlib"  # CORRECTED: Use pandas merge, not custom function
      function: "pd.merge"
      signature: "pd.merge(left: pd.DataFrame, right: pd.DataFrame, on: str, how: str) -> pd.DataFrame"
      
    # DEPENDENCY HANDLING FOR MISSING RQ 7.8.1 DATA
    dependency_circuit_breaker:
      check_rememvr_profiles:
        primary_path: "results/ch7/7.8.1/data/step03_rememvr_profile_classifications.csv"
        fallback_action: "STEP ERROR: RQ 7.8.1 profile data missing - cannot perform external validation without REMEMVR profiles"
        required_columns: ["UID", "profile"]

    input_files:
      - path: "results/ch7/7.8.2/data/step02_cognitive_profile_classifications.csv"  # CORRECTED: Hierarchical
        required_columns: ["UID", "profile"]
        source: "cognitive LPA output"
        description: "Cognitive profile assignments"
        
      # CRITICAL: RQ 7.8.1 dependency with circuit breaker
      - path: "results/ch7/7.8.1/data/step03_rememvr_profile_classifications.csv"
        required_columns: ["UID", "profile"]
        source: "REMEMVR LPA output from RQ 7.8.1"
        description: "REMEMVR profile assignments"
        circuit_breaker_if_missing: true

    contingency_table_creation:
      method: "crosstab"
      calculate_expected_frequencies: true
      calculate_standardized_residuals: true
      sparse_cell_threshold: 5

    output_files:
      - path: "results/ch7/7.8.2/data/step03_merged_profile_data.csv"  # CORRECTED: Hierarchical
        columns: ["UID", "cognitive_profile", "rememvr_profile"]
        description: "Combined profile assignments for correspondence analysis"
        
      - path: "results/ch7/7.8.2/data/step03_profile_crosstab.csv"  # CORRECTED: Hierarchical
        columns: ["cognitive_profile", "rememvr_profile", "observed_freq", "expected_freq", "std_residual"]
        description: "Contingency table with frequencies and residuals"
        
      - path: "results/ch7/7.8.2/data/step03_conditional_probabilities.csv"  # CORRECTED: Hierarchical
        columns: ["cognitive_profile", "rememvr_profile", "conditional_prob"]
        description: "P(REMEMVR profile | cognitive profile) prediction patterns"

    parameters:
      on: "UID"  # CORRECTED: Use actual ID column from dfnonvr.csv
      how: "inner"
      validate: "one_to_one"

    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_rows: Union[int, Tuple[int, int]], expected_columns: List[str], column_types: Optional[Dict[str, type]] = None) -> Dict[str, Any]"

# ============================================================================
# STEP 4: CHI-SQUARE TEST (VERIFIED D068 COMPLIANCE)
# ============================================================================

  - name: "step04_test_profile_association"
    step_number: 4
    description: "Test association between cognitive and REMEMVR profiles using chi-square with D068 dual p-values"
    depends_on: ["step03_merge_profile_classifications"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_stats"  # VERIFIED: Module exists
      function: "chi_square_test_d068"   # VERIFIED: Function exists with D068
      signature: "chi_square_test_d068(contingency_table: Union[np.ndarray, pd.DataFrame], correction: str = 'bonferroni', n_comparisons: Optional[int] = None) -> Dict[str, Any]"

    input_files:
      - path: "results/ch7/7.8.2/data/step03_profile_crosstab.csv"  # CORRECTED: Hierarchical
        required_columns: ["cognitive_profile", "rememvr_profile", "observed_freq"]
        description: "Contingency table from profile merge"

    statistical_test_parameters:
      # D068 DUAL P-VALUE REPORTING (MANDATORY)
      correction: "bonferroni"
      n_comparisons: 28  # Chapter 7 family-wise correction
      alpha_bonferroni: 0.00179  # 0.05/28
      report_both_pvalues: true  # CRITICAL: D068 mandate
      
      # SPARSE CELL HANDLING
      sparse_threshold: 5
      fishers_exact_fallback: true
      
      # EFFECT SIZE ANALYSIS
      effect_size: "cramers_v"
      bootstrap_ci: true
      bootstrap_iterations: 1000
      confidence_level: 0.95
      seed: 42

    output_files:
      - path: "results/ch7/7.8.2/data/step04_association_test.csv"  # CORRECTED: Hierarchical
        columns: ["chi2_statistic", "df", "p_uncorrected", "p_bonferroni", "cramers_v", "ci_lower", "ci_upper", "sparse_test"]
        description: "Chi-square test results with D068 dual p-values and effect size"
        
      - path: "results/ch7/7.8.2/data/step04_effect_size_bootstrap.csv"  # CORRECTED: Hierarchical
        columns: ["bootstrap_iteration", "cramers_v_sample", "chi2_sample"]
        description: "Bootstrap distribution for Cramer's V confidence interval"

    parameters:
      correction: "bonferroni"
      n_comparisons: 28
      bootstrap_iterations: 1000
      seed: 42
      sparse_threshold: 5

    validation_call:
      module: "tools.validation"
      function: "validate_hypothesis_test_dual_pvalues"
      signature: "validate_hypothesis_test_dual_pvalues(interaction_df: pd.DataFrame, required_terms: List[str], alpha_bonferroni: float = 0.05) -> Dict[str, Any]"

# ============================================================================
# STEP 5: CORRESPONDENCE INTERPRETATION (STDLIB APPROACH)
# ============================================================================

  - name: "step05_interpret_correspondence_patterns"
    step_number: 5
    description: "Interpret correspondence patterns and assess theoretical coherence"
    depends_on: ["step04_test_profile_association"]
    
    analysis_call:
      type: "stdlib"  # CORRECTED: Use standard operations for interpretation
      function: "custom_interpretation_logic"
      description: "Pattern analysis using pandas and numpy operations"

    input_files:
      - path: "results/ch7/7.8.2/data/step03_profile_crosstab.csv"  # CORRECTED: Hierarchical
        required_columns: ["cognitive_profile", "rememvr_profile", "std_residual"]
        description: "Contingency table with residuals"
        
      - path: "results/ch7/7.8.2/data/step03_conditional_probabilities.csv"  # CORRECTED: Hierarchical
        required_columns: ["cognitive_profile", "rememvr_profile", "conditional_prob"]
        description: "Prediction patterns"
        
      - path: "results/ch7/7.8.2/data/step04_association_test.csv"  # CORRECTED: Hierarchical
        required_columns: ["cramers_v", "p_uncorrected", "p_bonferroni"]
        description: "Association test results"

    theoretical_predictions:
      verbal_dominant_profile: "What_specialist_REMEMVR"
      spatial_dominant_profile: "Where_specialist_REMEMVR"
      balanced_profile: "When_specialist_REMEMVR"
      
    interpretation_criteria:
      residual_threshold: 2.0  # |standardized residual| > 2.0 = significant
      chance_threshold: 0.33   # Above chance for 3-way classification
      effect_size_thresholds:
        small: 0.10
        medium: 0.30
        large: 0.50

    output_files:
      - path: "results/ch7/7.8.2/data/step05_correspondence_interpretation.csv"  # CORRECTED: Hierarchical
        columns: ["cognitive_profile", "rememvr_profile", "association_strength", "above_chance", "theoretical_match"]
        description: "Pattern analysis with theoretical comparisons"
        
      - path: "results/ch7/7.8.2/data/step05_theoretical_assessment.txt"  # CORRECTED: Hierarchical
        format: "text"
        description: "Narrative interpretation of correspondence patterns"

    parameters:
      residual_threshold: 2.0
      chance_threshold: 0.33
      theoretical_predictions:
        verbal_dominant: "What"
        spatial_dominant: "Where" 
        balanced: "When"

    validation_call:
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, required_cols: List[str]) -> Dict[str, Any]"

# ============================================================================
# FINAL METADATA AND VERIFICATION SUMMARY
# ============================================================================

expected_outputs:
  data_files:
    - "results/ch7/7.8.2/data/step00_dependency_validation.txt"
    - "results/ch7/7.8.2/data/step01_cognitive_lpa_input.csv"
    - "results/ch7/7.8.2/data/step01_cognitive_descriptives.csv" 
    - "results/ch7/7.8.2/data/step02_lpa_model_comparison.csv"
    - "results/ch7/7.8.2/data/step02_cognitive_profile_classifications.csv"
    - "results/ch7/7.8.2/data/step02_profile_descriptives.csv"
    - "results/ch7/7.8.2/data/step02_split_sample_validation.csv"
    - "results/ch7/7.8.2/data/step03_merged_profile_data.csv"
    - "results/ch7/7.8.2/data/step03_profile_crosstab.csv"
    - "results/ch7/7.8.2/data/step03_conditional_probabilities.csv"
    - "results/ch7/7.8.2/data/step04_association_test.csv"
    - "results/ch7/7.8.2/data/step04_effect_size_bootstrap.csv"
    - "results/ch7/7.8.2/data/step05_correspondence_interpretation.csv"
    - "results/ch7/7.8.2/data/step05_theoretical_assessment.txt"
    
  log_files:
    - "results/ch7/7.8.2/logs/step00_dependency_validation.log"
    - "results/ch7/7.8.2/logs/step01_extract_cognitive.log"
    - "results/ch7/7.8.2/logs/step02_cognitive_lpa.log"
    - "results/ch7/7.8.2/logs/step03_merge_profiles.log"
    - "results/ch7/7.8.2/logs/step04_test_association.log"
    - "results/ch7/7.8.2/logs/step05_interpret_patterns.log"

cross_rq_dependencies:
  required:
    - rq_id: "ch7/7.8.1"
      status: "rq_results: success" 
      files: ["results/ch7/7.8.1/data/step03_rememvr_profile_classifications.csv"]
      circuit_breaker_if_missing: true
      
  data_sources:
    - path: "data/dfnonvr.csv"  # CORRECTED: Primary Ch7 data source
      description: "Cognitive test scores with hyphen-formatted columns"
      required_columns: ["UID", "ravlt-trial-1-score", "bvmt-total-recall", "rpm-score"]

validation_architecture:
  all_steps_validated: true
  validation_coverage: "100%"
  circuit_breakers_implemented: 2
  d068_compliance: true

