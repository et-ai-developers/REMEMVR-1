          verification_note: "CORRECTED path enforced - Ch7 uses dfnonvr.csv NOT master.xlsx"
          
      additional_operations:
        # SPECIFIC DIAGNOSTIC OPERATIONS
        - "import pandas as pd"
        - "import numpy as np"
        - "from tools.analysis_regression import cross_validate_regression"
        - "from tools.analysis_extensions import validate_regression_assumptions"
        - "from scipy.stats import shapiro"
        - "from statsmodels.stats.diagnostic import het_breuschpagan"
        - "from statsmodels.api import OLS, add_constant"
        - "# Load data"
        - "df = pd.read_csv('results/ch7/7.2.2/data/step01_merged_coefficients.csv')"
        - "cog_data = pd.read_csv('data/dfnonvr.csv')"
        - "# Merge for assumption checking"
        - "merged = df.merge(cog_data[['UID', 'Age', 'RAVLT_T', 'BVMT_T', 'RPM_T']], on='UID')"
        - "# Assumption checks for each domain"
        - "assumption_results = []"
        - "for domain in ['overall', 'what', 'where', 'when']:"
        - "    y = merged[f'theta_{domain}']"
        - "    X = merged[['Age', 'RAVLT_T', 'BVMT_T', 'RPM_T']]"
        - "    X_const = add_constant(X)"
        - "    model = OLS(y, X_const).fit()"
        - "    # Normality test"
        - "    _, normality_p = shapiro(model.resid)"
        - "    # Homoscedasticity test"
        - "    _, homosced_p, _, _ = het_breuschpagan(model.resid, X_const)"
        - "    # Multicollinearity (VIF)"
        - "    from statsmodels.stats.outliers_influence import variance_inflation_factor"
        - "    vifs = [variance_inflation_factor(X_const.values, i) for i in range(X_const.shape[1])]"
        - "    max_vif = max(vifs[1:])  # Exclude constant"
        - "    # Outlier detection (Cook's distance)"
        - "    influence = model.get_influence()"
        - "    cooks_d = influence.cooks_distance[0]"
        - "    outlier_count = sum(cooks_d > 4/len(merged))"
        - "    # Overall assessment"
        - "    assumptions_met = normality_p > 0.05 and homosced_p > 0.05 and max_vif < 5"
        - "    assumption_results.append({"
        - "        'domain': domain,"
        - "        'normality_p': normality_p,"
        - "        'homoscedasticity_p': homosced_p,"
        - "        'max_vif': max_vif,"
        - "        'outlier_count': outlier_count,"
        - "        'assumptions_met': assumptions_met"
        - "    })"
        - "# Save assumption check results"
        - "assumption_df = pd.DataFrame(assumption_results)"
        - "assumption_df.to_csv('results/ch7/7.2.2/data/step06_assumption_checks.csv', index=False)"
        
      parameters:
        n_folds: 5
        random_state: 42
        scoring_metrics: ["mae", "rmse", "r2"]
        outlier_threshold: 4  # Cook's distance threshold (4/n)
        
      outputs:
        assumption_checks:
          path: "results/ch7/7.2.2/data/step06_assumption_checks.csv"
          columns: ["domain", "normality_p", "homoscedasticity_p", "max_vif", "outlier_count", "assumptions_met"]
