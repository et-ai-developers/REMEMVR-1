# ============================================================================
# STEP 2: COMPUTE ATTENUATION RATIOS  
# ============================================================================

  - name: "step02_compute_attenuation_ratios"
    step_id: 2
    dependencies: ["step01_extract_merge_data"]
    verification_notes: "Using explicit calculation instead of fit_multiple_regression for attenuation ratios"
    
    analysis_call:
      type: "stdlib"
      operations:
        # SPECIFIC FUNCTION CALLS - detailed attenuation calculation
        - "import pandas as pd"
        - "import numpy as np"
        - "# Load merged data"
        - "df = pd.read_csv('results/ch7/7.2.2/data/step01_merged_coefficients.csv')"
        - "# Compute attenuation ratios for each domain"
        - "domains = ['overall', 'what', 'where', 'when']"
        - "attenuation_results = []"
        - "for domain in domains:"
        - "    beta_biv = df[f'beta_age_bivariate_{domain}'].iloc[0]"
        - "    beta_ctrl = df[f'beta_age_controlled_{domain}'].iloc[0]"
        - "    # Calculate attenuation ratio: (bivariate - controlled) / bivariate"
        - "    if beta_biv != 0:"
        - "        attenuation_ratio = (beta_biv - beta_ctrl) / beta_biv"
        - "        attenuation_percent = attenuation_ratio * 100"
        - "    else:"
        - "        attenuation_ratio = np.nan"
        - "        attenuation_percent = np.nan"
        - "    # Classify attenuation magnitude"
        - "    if pd.isna(attenuation_percent):"
        - "        classification = 'undefined'"
        - "    elif attenuation_percent < 30:"
        - "        classification = 'minimal'"
        - "    elif attenuation_percent <= 70:"
        - "        classification = 'partial'"
        - "    else:"
        - "        classification = 'substantial'"
        - "    attenuation_results.append({"
        - "        'domain': domain,"
        - "        'beta_bivariate': beta_biv,"
        - "        'beta_controlled': beta_ctrl,"
        - "        'attenuation_ratio': attenuation_ratio,"
        - "        'attenuation_percent': attenuation_percent,"
        - "        'classification': classification"
        - "    })"
        - "# Save results"
        - "attenuation_df = pd.DataFrame(attenuation_results)"
        - "attenuation_df.to_csv('results/ch7/7.2.2/data/step02_attenuation_ratios.csv', index=False)"
        
      input_files:
        - path: "results/ch7/7.2.2/data/step01_merged_coefficients.csv"
          source: "Step 1 merged data"
          
      outputs:
        attenuation_ratios:
          path: "results/ch7/7.2.2/data/step02_attenuation_ratios.csv"
          columns: ["domain", "beta_bivariate", "beta_controlled", "attenuation_ratio", "attenuation_percent", "classification"]
          expected_rows: 4
          
        effect_classification:
          path: "results/ch7/7.2.2/data/step02_effect_classification.txt"
          description: "Text summary of attenuation effect sizes"
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_numeric_range"
      verified: true
      
      expected_validation_criteria:
        columns_to_check: ["attenuation_percent"]
        expected_range: [0, 150]
        allow_negative: true
        allow_na: true

# ============================================================================
# STEP 3: BOOTSTRAP CONFIDENCE INTERVALS
# ============================================================================

  - name: "step03_bootstrap_confidence_intervals"
    step_id: 3
    dependencies: ["step02_compute_attenuation_ratios"]
    verification_notes: "bootstrap_regression_ci verified in tools.analysis_regression"
    
    analysis_call:
      type: "mixed"  # Combines catalogued tool + custom bootstrap implementation
      
      primary_tool:
        module: "tools.analysis_regression"
        function: "bootstrap_regression_ci"
        # VERIFIED SIGNATURE from actual code
        signature: "bootstrap_regression_ci(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_bootstrap: int = 1000, confidence_level: float = 0.95, random_state: int = 42) -> pd.DataFrame"
        
      custom_operations:
        # SPECIFIC BOOTSTRAP IMPLEMENTATION for attenuation ratios
        - "import pandas as pd"
        - "import numpy as np"
        - "from tools.analysis_regression import bootstrap_regression_ci"
        - "from sklearn.utils import resample"
        - "from statsmodels.api import OLS, add_constant"
        - "# Load data"
        - "df = pd.read_csv('results/ch7/7.2.2/data/step01_merged_coefficients.csv')"
        - "# Bootstrap parameters"
        - "n_bootstrap = 1000"
        - "random_state = 42"
        - "np.random.seed(random_state)"
        - "# Bootstrap distributions storage"
        - "bootstrap_results = {'overall': [], 'what': [], 'where': [], 'when': []}"
        - "# Participant-level bootstrap resampling"
        - "for i in range(n_bootstrap):"
        - "    # Resample participants with replacement"
        - "    boot_df = resample(df, random_state=random_state+i, replace=True)"
        - "    # For each domain, fit bivariate and controlled models"
        - "    for domain in ['overall', 'what', 'where', 'when']:"
        - "        y = boot_df[f'theta_{domain}']"
        - "        # Need to load cognitive data from dfnonvr.csv"
        - "        from tools.data import load_participant_data"
        - "        cog_data = load_participant_data('data/dfnonvr.csv')"
        - "        boot_cog = cog_data[cog_data['UID'].isin(boot_df['UID'])]"
        - "        X_age = boot_cog[['Age']].values"
        - "        X_full = boot_cog[['Age', 'RAVLT_T', 'BVMT_T', 'RPM_T']].values"
        - "        # Fit models"
        - "        X_age_const = add_constant(X_age)"
        - "        X_full_const = add_constant(X_full)"
        - "        model_biv = OLS(y, X_age_const).fit()"
        - "        model_ctrl = OLS(y, X_full_const).fit()"
        - "        # Extract age coefficients"
        - "        beta_biv = model_biv.params[1]"  # Age coefficient
        - "        beta_ctrl = model_ctrl.params[1]"  # Age coefficient in full model
        - "        # Calculate attenuation"
        - "        if beta_biv != 0:"
        - "            attenuation = ((beta_biv - beta_ctrl) / beta_biv) * 100"
        - "        else:"
        - "            attenuation = np.nan"
        - "        bootstrap_results[domain].append(attenuation)"
        - "# Convert to DataFrame"
        - "boot_dist_df = pd.DataFrame(bootstrap_results)"
        - "boot_dist_df.to_csv('results/ch7/7.2.2/data/step03_bootstrap_distributions.csv', index=False)"
        
      input_files:
        - path: "results/ch7/7.2.2/data/step01_merged_coefficients.csv"
          source: "Step 1 merged data for resampling"
        - path: "data/dfnonvr.csv"
          source: "Ch7 participant data with cognitive tests"
          verification_note: "CORRECTED from master.xlsx to dfnonvr.csv per Ch7 mandate"
          
      parameters:
        n_bootstrap: 1000
        confidence_level: 0.95
        random_state: 42
        
      outputs:
        bootstrap_distributions:
          path: "results/ch7/7.2.2/data/step03_bootstrap_distributions.csv"
          columns: ["overall", "what", "where", "when"]
          expected_rows: 1000
          
        confidence_intervals:
          path: "results/ch7/7.2.2/data/step03_confidence_intervals.csv"
          columns: ["domain", "point_estimate", "ci_lower", "ci_upper", "ci_width", "ci_width_percent", "bootstrap_p"]
          expected_rows: 4
          
        bootstrap_diagnostics:
          path: "results/ch7/7.2.2/data/step03_bootstrap_diagnostics.txt"
          description: "Bootstrap convergence assessment"
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_bootstrap_stability"
      verified: true
      
      expected_validation_criteria:
        min_jaccard_threshold: 0.75
        max_ci_width_percent: 40

# ============================================================================
# STEP 4: DOMAIN COMPARISON ANALYSIS
# ============================================================================

  - name: "step04_domain_comparisons"
    step_id: 4
    dependencies: ["step03_bootstrap_confidence_intervals"]
    verification_notes: "Using custom bootstrap comparison since compute_post_hoc_contrasts doesn't exist"
    
    analysis_call:
      type: "stdlib"
      operations:
        # SPECIFIC DOMAIN COMPARISON using bootstrap distributions
        - "import pandas as pd"
        - "import numpy as np"
        - "from scipy import stats"
        - "from statsmodels.stats.multitest import multipletests"
        - "# Load bootstrap distributions"
        - "boot_df = pd.read_csv('results/ch7/7.2.2/data/step03_bootstrap_distributions.csv')"
        - "# Pairwise domain comparisons"
        - "comparisons = [('what', 'where'), ('what', 'when'), ('where', 'when')]"
        - "comparison_results = []"
        - "# Calculate differences for each bootstrap iteration"
        - "for comp in comparisons:"
        - "    domain1, domain2 = comp"
        - "    diff_distribution = boot_df[domain1] - boot_df[domain2]"
        - "    # Point estimate (mean difference)"
        - "    point_diff = diff_distribution.mean()"
        - "    # 95% confidence interval (percentile method)"
        - "    ci_lower = np.percentile(diff_distribution.dropna(), 2.5)"
        - "    ci_upper = np.percentile(diff_distribution.dropna(), 97.5)"
        - "    # Bootstrap p-value (two-tailed test H0: difference = 0)"
        - "    p_uncorrected = (np.abs(diff_distribution) <= 0).mean()"
        - "    # Cohen's d effect size"
        - "    pooled_std = np.sqrt((boot_df[domain1].var() + boot_df[domain2].var()) / 2)"
        - "    cohens_d = point_diff / pooled_std"
        - "    comparison_results.append({"
        - "        'comparison': f'{domain1}_vs_{domain2}',"
        - "        'difference': point_diff,"
        - "        'ci_lower': ci_lower,"
        - "        'ci_upper': ci_upper,"
        - "        'p_uncorrected': p_uncorrected,"
        - "        'cohens_d': cohens_d"
        - "    })"
        - "# Convert to DataFrame for corrections"
        - "comp_df = pd.DataFrame(comparison_results)"
        - "# Multiple comparison corrections"
        - "p_values = comp_df['p_uncorrected'].values"
        - "reject_bonf, p_bonf, _, _ = multipletests(p_values, method='bonferroni')"
        - "reject_fdr, p_fdr, _, _ = multipletests(p_values, method='fdr_bh')"
        - "comp_df['p_bonferroni'] = p_bonf"
        - "comp_df['p_fdr'] = p_fdr"
        - "# Save results"
        - "comp_df.to_csv('results/ch7/7.2.2/data/step04_domain_comparisons.csv', index=False)"
        
      input_files:
        - path: "results/ch7/7.2.2/data/step03_bootstrap_distributions.csv"
          source: "Step 3 bootstrap distributions for pairwise testing"
          
      outputs:
        domain_comparisons:
          path: "results/ch7/7.2.2/data/step04_domain_comparisons.csv"
          columns: ["comparison", "difference", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni", "p_fdr", "cohens_d"]
          expected_rows: 3
          
        multiple_corrections:
          path: "results/ch7/7.2.2/data/step04_multiple_corrections.csv"
          columns: ["comparison", "p_uncorrected", "p_bonferroni", "p_fdr", "significant_corrected"]
          expected_rows: 3
          
        pattern_analysis:
          path: "results/ch7/7.2.2/data/step04_pattern_analysis.txt"
          description: "VR scaffolding hypothesis pattern evaluation (What > Where > When)"
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_contrasts_d068"
      verified: true
      
      expected_validation_criteria:
        required_columns: ["p_uncorrected", "p_bonferroni", "p_fdr"]
        d068_compliant: true

# ============================================================================
# STEP 5: EFFECT SIZE ANALYSIS AND POWER
# ============================================================================

  - name: "step05_effect_sizes_power"
    step_id: 5
    dependencies: ["step04_domain_comparisons"]
    verification_notes: "compute_cohens_f2 verified in tools.analysis_regression"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_cohens_f2"
      # VERIFIED SIGNATURE from actual code
      signature: "compute_cohens_f2(r2_full: float, r2_reduced: float) -> float"
      
      input_files:
        - path: "results/ch7/7.2.2/data/step02_attenuation_ratios.csv"
          source: "Step 2 attenuation estimates"
        - path: "results/ch7/7.2.2/data/step03_confidence_intervals.csv"
          source: "Step 3 confidence intervals"
        - path: "results/ch7/7.2.1/data/step04_regression_results.csv"
          source: "RQ 7.2.1 R-squared values"
          
      additional_operations:
        # SPECIFIC EFFECT SIZE CALCULATIONS
        - "import pandas as pd"
        - "import numpy as np"
        - "from tools.analysis_regression import compute_cohens_f2"
        - "# Load R-squared values from RQ 7.2.1"
        - "rq721_results = pd.read_csv('results/ch7/7.2.1/data/step04_regression_results.csv')"
        - "effect_size_results = []"
        - "# Calculate effect sizes for each domain"
        - "for domain in ['overall', 'what', 'where', 'when']:"
        - "    domain_results = rq721_results[rq721_results['domain'] == domain]"
        - "    if not domain_results.empty:"
        - "        r2_bivariate = domain_results['r2_bivariate'].iloc[0]"
        - "        r2_controlled = domain_results['r2_controlled'].iloc[0]"
        - "        # Cohen's f-squared for R-squared change"
        - "        f_squared = compute_cohens_f2(r2_controlled, r2_bivariate)"
        - "        # Effect size classification"
        - "        if f_squared < 0.02:"
        - "            classification = 'small'"
        - "        elif f_squared < 0.15:"
        - "            classification = 'medium'"
        - "        else:"
        - "            classification = 'large'"
        - "        r_squared_change = r2_controlled - r2_bivariate"
        - "        effect_size_results.append({"
        - "            'domain': domain,"
        - "            'f_squared': f_squared,"
        - "            'effect_classification': classification,"
        - "            'r_squared_change': r_squared_change"
        - "        })"
        - "# Save effect size results"
        - "effect_df = pd.DataFrame(effect_size_results)"
        - "effect_df.to_csv('results/ch7/7.2.2/data/step05_effect_sizes.csv', index=False)"
        
      parameters:
        alpha: 0.0125  # Ch7 Bonferroni correction (0.05/4 domains)
        power_target: 0.80
        n_participants: 100
        
      outputs:
        effect_sizes:
          path: "results/ch7/7.2.2/data/step05_effect_sizes.csv"
          columns: ["domain", "f_squared", "effect_classification", "r_squared_change"]
          expected_rows: 4
          
        power_analysis:
