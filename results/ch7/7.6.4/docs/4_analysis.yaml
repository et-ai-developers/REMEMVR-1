      description: "Create dependency validation wrapper since tools.config.validate_paths_exist not implemented"
      check_criteria:
        - "All required Ch5 files exist and accessible"
        - "dfnonvr.csv readable and contains cognitive test columns"
        - "No file corruption or access errors"
    
    processing_notes:
      - "CRITICAL: Uses dfnonvr.csv NOT master.xlsx for Ch7"
      - "Validates Ch5 5.2.5 completed both IRT passes"
      - "Checks pre/post-purification slope files exist"

  - name: "step01_extract_pass1_slopes"
    step_number: 1
    description: "Extract individual forgetting slopes from pre-purification IRT analysis"
    
    dependencies: ["step00_validate_dependencies"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_extensions"
      function: "standardize_scores"
      signature: "standardize_scores(scores: Union[pd.Series, pd.DataFrame], reference_mean: float = None, reference_sd: float = None) -> Union[pd.Series, pd.DataFrame]"
    
    input_files:
      - path: "results/ch5/5.2.5/data/step03_pass1_slopes.csv"
        description: "Pre-purification individual slopes from Ch5"
        format: "csv"
        required: true
        expected_columns: ["UID", "slope_estimate", "slope_se"]
        expected_rows: "~100 participants"
        data_types:
          UID: "string"
          slope_estimate: "float"
          slope_se: "float"
    
    output_files:
      - path: "results/ch7/7.6.4/data/step01_pass1_slopes.csv"
        description: "T-score standardized pre-purification slopes"
        format: "csv"
        columns: ["UID", "slope_raw", "slope_tscore", "slope_se"]
        data_types:
          UID: "object"
          slope_raw: "float64"
          slope_tscore: "float64"
          slope_se: "float64"
    
    parameters:
      reference_mean: 50.0
      reference_sd: 10.0
      input_column: "slope_estimate"
      uid_column: "UID"
    
    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(df: pd.DataFrame, column_names: List[str], tolerance: float = 0.01) -> Dict[str, Any]"
      parameters:
        column_names: ["slope_tscore"]
        expected_mean: 50.0
        expected_sd: 10.0
        tolerance: 1.0
    
    processing_notes:
      - "Load pre-purification slopes and standardize to T-scores"
      - "Verify N >= 90 participants for adequate power"
      - "Handle missing slopes with exclusion documentation"

  - name: "step02_extract_pass2_slopes"
    step_number: 2
    description: "Extract individual forgetting slopes from post-purification IRT analysis"
    
    dependencies: ["step01_extract_pass1_slopes"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_extensions"
      function: "standardize_scores"
      signature: "standardize_scores(scores: Union[pd.Series, pd.DataFrame], reference_mean: float = None, reference_sd: float = None) -> Union[pd.Series, pd.DataFrame]"
    
    input_files:
      - path: "results/ch5/5.2.5/data/step06_pass2_slopes.csv"
        description: "Post-purification individual slopes from Ch5"
        format: "csv"
        required: true
        expected_columns: ["UID", "slope_estimate", "slope_se"]
        expected_rows: "~100 participants"
        data_types:
          UID: "string"
          slope_estimate: "float"
          slope_se: "float"
      - path: "results/ch7/7.6.4/data/step01_pass1_slopes.csv"
        description: "Pre-purification slopes for UID matching"
        format: "csv"
        required: true
        expected_columns: ["UID"]
    
    output_files:
      - path: "results/ch7/7.6.4/data/step02_pass2_slopes.csv"
        description: "T-score standardized post-purification slopes"
        format: "csv"
        columns: ["UID", "slope_raw", "slope_tscore", "slope_se"]
        data_types:
          UID: "object"
          slope_raw: "float64"
          slope_tscore: "float64"
          slope_se: "float64"
    
    parameters:
      reference_mean: 50.0
      reference_sd: 10.0
      input_column: "slope_estimate"
      uid_column: "UID"
      match_uids_from: "results/ch7/7.6.4/data/step01_pass1_slopes.csv"
    
    validation_call:
      module: "tools.validation"
      function: "validate_standardization"
      signature: "validate_standardization(df: pd.DataFrame, column_names: List[str], tolerance: float = 0.01) -> Dict[str, Any]"
      parameters:
        column_names: ["slope_tscore"]
        expected_mean: 50.0
        expected_sd: 10.0
        tolerance: 1.0
        require_uid_overlap: 90
    
    processing_notes:
      - "Match UIDs with Step 1 (same participants required)"
      - "Independent T-score standardization for Pass 2"
      - "Verify >= 90 overlapping participants"

  - name: "step03_extract_cognitive_predictors"
    step_number: 3
    description: "Extract and standardize cognitive test scores for regression predictors from dfnonvr.csv"
    
    dependencies: ["step01_extract_pass1_slopes", "step02_extract_pass2_slopes"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "load_participant_data"
      signature: "load_participant_data(path: str = './data/dfnonvr.csv') -> pd.DataFrame"
    
    input_files:
      - path: "data/dfnonvr.csv"
        description: "CRITICAL Ch7 data source - ALL participant data including cognitive tests"
        format: "csv"
        required: true
        expected_columns: 
          - "UID"
          - "ravlt-trial-1-score"
          - "ravlt-trial-2-score" 
          - "ravlt-trial-3-score"
          - "ravlt-trial-4-score"
          - "ravlt-trial-5-score"
          - "bvmt-trial-1-score"
          - "bvmt-trial-2-score"
          - "bvmt-trial-3-score"
          - "bvmt-delayed-recall-score"
          - "rpm-score"
          - "age"
          - "sex"
          - "education"
        expected_rows: "~100 participants"
        data_types:
          UID: "string"
          cognitive_scores: "float"
          age: "int"
          sex: "string"
          education: "int"
      - path: "results/ch7/7.6.4/data/step01_pass1_slopes.csv"
        description: "UIDs with slope data"
        format: "csv"
        required: true
        expected_columns: ["UID"]
      - path: "results/ch7/7.6.4/data/step02_pass2_slopes.csv"
        description: "UIDs with slope data"
        format: "csv"
        required: true
        expected_columns: ["UID"]
    
    output_files:
      - path: "results/ch7/7.6.4/data/step03_cognitive_predictors.csv"
        description: "T-score standardized cognitive predictors"
        format: "csv"
        columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex_coded", "Education"]
        data_types:
          UID: "object"
          RAVLT_T: "float64"
          BVMT_T: "float64"
          RPM_T: "float64"
          Age: "int64"
          Sex_coded: "int64"
          Education: "int64"
    
    parameters:
      path: "data/dfnonvr.csv"
      ravlt_columns: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score"]
      bvmt_columns: ["bvmt-trial-1-score", "bvmt-trial-2-score", "bvmt-trial-3-score", "bvmt-delayed-recall-score"]
      rpm_column: "rpm-score"
      demographics: ["age", "sex", "education"]
      standardize_to_t_scores: true
      t_score_mean: 50.0
      t_score_sd: 10.0
    
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      parameters:
        required_columns: ["UID", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex_coded", "Education"]
        min_participants: 85
    
    processing_notes:
      - "CRITICAL: Uses dfnonvr.csv with hyphenated column names"
      - "Creates RAVLT total (sum T1-T5), BVMT total (sum T1-T3+delayed)"
      - "Filters to participants with slope data from Steps 1-2"
      - "Dummy codes Sex variable (M=0, F=1 or similar)"
      - "Note: NART not available in dfnonvr.csv (expected)"

  - name: "step04_merge_analysis_dataset"
    step_number: 4
    description: "Create final merged dataset for regression analysis"
    
    dependencies: ["step01_extract_pass1_slopes", "step02_extract_pass2_slopes", "step03_extract_cognitive_predictors"]
    
    analysis_call:
      type: "standard_library"
      implementation: "pandas.merge"
      description: "Inner join all datasets on UID for complete cases analysis"
    
    input_files:
      - path: "results/ch7/7.6.4/data/step01_pass1_slopes.csv"
        description: "Pre-purification slopes"
        format: "csv"
        required: true
      - path: "results/ch7/7.6.4/data/step02_pass2_slopes.csv"
        description: "Post-purification slopes"
        format: "csv"
        required: true
      - path: "results/ch7/7.6.4/data/step03_cognitive_predictors.csv"
        description: "Cognitive predictors and covariates"
        format: "csv"
        required: true
    
    output_files:
      - path: "results/ch7/7.6.4/data/step04_analysis_dataset.csv"
        description: "Merged analysis-ready dataset"
        format: "csv"
        columns: ["UID", "Slope_Pass1_T", "Slope_Pass2_T", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex_coded", "Education"]
        data_types:
          UID: "object"
          Slope_Pass1_T: "float64"
          Slope_Pass2_T: "float64"
          RAVLT_T: "float64"
          BVMT_T: "float64"
          RPM_T: "float64"
          Age: "int64"
          Sex_coded: "int64"
          Education: "int64"
      - path: "results/ch7/7.6.4/data/step04_descriptives.csv"
        description: "Descriptive statistics for all variables"
        format: "csv"
        columns: ["variable", "mean", "sd", "n", "min", "max"]
        data_types:
          variable: "object"
          mean: "float64"
          sd: "float64"
          n: "int64"
          min: "float64"
          max: "float64"
    
    parameters:
      join_type: "inner"
      on_column: "UID"
      compute_descriptives: true
      compute_correlations: true
      multicollinearity_threshold: 0.80
    
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, required_columns: List[str], min_rows: int = 1) -> Dict[str, Any]"
      parameters:
        required_columns: ["UID", "Slope_Pass1_T", "Slope_Pass2_T", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex_coded", "Education"]
        min_rows: 85
        no_missing_values: true
    
    processing_notes:
      - "Inner join ensures complete cases only"
      - "Check correlations for multicollinearity (r < 0.80)"
      - "Calculate descriptive statistics"
      - "Minimum N=85 for adequate power with 6 predictors"

  - name: "step05_fit_pass1_regression"
    step_number: 5
    description: "Fit multiple regression predicting pre-purification slopes with cognitive tests"
    
    dependencies: ["step04_merge_analysis_dataset"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], add_constant: bool = True, return_diagnostics: bool = True) -> Dict"
    
    input_files:
      - path: "results/ch7/7.6.4/data/step04_analysis_dataset.csv"
        description: "Merged analysis dataset"
        format: "csv"
        required: true
        expected_columns: ["Slope_Pass1_T", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex_coded", "Education"]
    
    output_files:
      - path: "results/ch7/7.6.4/data/step05_pass1_regression.csv"
        description: "Pre-purification regression results with bootstrap CIs"
        format: "csv"
        columns: ["predictor", "beta", "se", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni", "p_fdr", "vif", "sr_squared"]
        data_types:
          predictor: "object"
          beta: "float64"
          se: "float64"
          ci_lower: "float64"
          ci_upper: "float64"
          p_uncorrected: "float64"
          p_bonferroni: "float64"
          p_fdr: "float64"
          vif: "float64"
          sr_squared: "float64"
      - path: "results/ch7/7.6.4/data/step05_pass1_diagnostics.csv"
        description: "Regression assumption test results"
        format: "csv"
        columns: ["test", "statistic", "p_value", "result"]
        data_types:
          test: "object"
          statistic: "float64"
          p_value: "float64"
          result: "object"
    
    parameters:
      dependent_variable: "Slope_Pass1_T"
      predictors: ["RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex_coded", "Education"]
      add_constant: true
      return_diagnostics: true
      bootstrap_iterations: 1000
      bootstrap_ci_level: 0.95
      random_seed: 42
      family_alpha: 0.05
      n_tests: 3  # 3 cognitive predictors for Bonferroni correction
    
    validation_call:
      module: "tools.analysis_extensions"
      function: "validate_regression_assumptions"
      signature: "validate_regression_assumptions(residuals: np.ndarray, X: np.ndarray, significance_level: float = 0.05) -> Dict[str, Dict[str, Any]]"
      parameters:
        significance_level: 0.05
        check_normality: true
        check_homoscedasticity: true
        check_linearity: true
        check_independence: true
    
    processing_notes:
      - "Model: Slope_Pass1_T ~ RAVLT_T + BVMT_T + RPM_T + Age + Sex_coded + Education"
      - "Bootstrap 1000 iterations with seed=42 for reproducibility"
      - "Bonferroni correction: α = 0.05/3 = 0.0167 for cognitive predictors"
      - "Report BOTH uncorrected AND corrected p-values (Decision D068)"

  - name: "step06_fit_pass2_regression"
    step_number: 6
    description: "Fit identical multiple regression predicting post-purification slopes"
    
    dependencies: ["step05_fit_pass1_regression"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], add_constant: bool = True, return_diagnostics: bool = True) -> Dict"
    
    input_files:
      - path: "results/ch7/7.6.4/data/step04_analysis_dataset.csv"
        description: "Merged analysis dataset"
        format: "csv"
        required: true
        expected_columns: ["Slope_Pass2_T", "RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex_coded", "Education"]
    
    output_files:
      - path: "results/ch7/7.6.4/data/step06_pass2_regression.csv"
        description: "Post-purification regression results with bootstrap CIs"
        format: "csv"
        columns: ["predictor", "beta", "se", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni", "p_fdr", "vif", "sr_squared"]
        data_types:
          predictor: "object"
          beta: "float64"
          se: "float64"
          ci_lower: "float64"
          ci_upper: "float64"
          p_uncorrected: "float64"
          p_bonferroni: "float64"
          p_fdr: "float64"
          vif: "float64"
          sr_squared: "float64"
      - path: "results/ch7/7.6.4/data/step06_pass2_diagnostics.csv"
        description: "Regression assumption test results"
        format: "csv"
        columns: ["test", "statistic", "p_value", "result"]
        data_types:
          test: "object"
          statistic: "float64"
          p_value: "float64"
          result: "object"
    
    parameters:
      dependent_variable: "Slope_Pass2_T"
      predictors: ["RAVLT_T", "BVMT_T", "RPM_T", "Age", "Sex_coded", "Education"]
      add_constant: true
      return_diagnostics: true
      bootstrap_iterations: 1000
      bootstrap_ci_level: 0.95
      random_seed: 42  # Same as Step 5 for reproducibility
      family_alpha: 0.05
      n_tests: 3  # 3 cognitive predictors for Bonferroni correction
    
    validation_call:
      module: "tools.analysis_extensions"
      function: "validate_regression_assumptions"
      signature: "validate_regression_assumptions(residuals: np.ndarray, X: np.ndarray, significance_level: float = 0.05) -> Dict[str, Dict[str, Any]]"
      parameters:
        significance_level: 0.05
        check_normality: true
        check_homoscedasticity: true
        check_linearity: true
        check_independence: true
    
    processing_notes:
      - "Identical model to Step 5: Slope_Pass2_T ~ predictors"
      - "Same bootstrap parameters for comparability"
      - "Same correction procedures for consistency"
      - "Enables direct coefficient comparison"

  - name: "step07_compare_regression_models"
    step_number: 7
    description: "Compare pre- vs post-purification models to test purification paradox hypothesis"
    
    dependencies: ["step05_fit_pass1_regression", "step06_fit_pass2_regression"]
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "cross_validate_regression"
      signature: "cross_validate_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_folds: int = 5, random_state: int = 42, scoring_metrics: List[str] = ['mse', 'r2']) -> Dict"
    
    secondary_calls:
      - module: "tools.analysis_regression"
        function: "compute_post_hoc_power"
        signature: "compute_post_hoc_power(n: int, k: int, r2: float, alpha: float = 0.05) -> Dict"
      - module: "tools.analysis_regression"  
        function: "bootstrap_regression_ci"
        signature: "bootstrap_regression_ci(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_bootstrap: int = 1000, confidence_level: float = 0.95, random_state: int = 42) -> pd.DataFrame"
    
    input_files:
      - path: "results/ch7/7.6.4/data/step05_pass1_regression.csv"
        description: "Pre-purification model results"
        format: "csv"
        required: true
      - path: "results/ch7/7.6.4/data/step06_pass2_regression.csv"
        description: "Post-purification model results"
        format: "csv"
        required: true
      - path: "results/ch7/7.6.4/data/step04_analysis_dataset.csv"
        description: "Analysis dataset for dependent correlation tests"
        format: "csv"
        required: true
    
    output_files:
      - path: "results/ch7/7.6.4/data/step07_model_comparison.csv"
        description: "R² and coefficient differences with CIs"
        format: "csv"
