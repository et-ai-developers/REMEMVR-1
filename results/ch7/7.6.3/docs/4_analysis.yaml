# RQ: ch7/7.6.3 - ICC slope replication across domains
# Agent: rq_analysis v5.3.0
# 
# Deep Verification Summary:
#   - All module paths verified and corrected (2 corrections)
#   - All validators matched to model types (3 corrections)
#   - All file formats validated for compatibility
#   - All functions verified to exist in exact modules
#   - All signatures extracted from actual code
#   - All paths converted to hierarchical structure (CRITICAL v5.3.0)
#   - Ch7 data sources verified: ONLY dfnonvr.csv and dfvr.csv (NO master.xlsx)
# ============================================================================

metadata:
  rq_id: "ch7/7.6.3"
  verification_level: "deep_v5.3.0"
  module_corrections: 2
  validator_corrections: 3
  format_corrections: 0
  path_corrections: 8  # All paths made hierarchical
  data_source_compliance: "dfnonvr.csv and dfvr.csv only"

steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Verify Ch5 5.2.1, 5.2.2, 5.2.3 domain analysis outputs exist and are complete"
    
    analysis_call:
      type: catalogued
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: Union[str, Path], min_size_bytes: int = 0) -> Dict[str, Any]"
    
    input_files:
      - path: "results/ch5/5.2.1/data/"
        description: "What domain slope analysis outputs"
        search_patterns: ["*slopes*.csv", "*participant*.csv", "*participant*.txt"]
        required_columns: ["UID", "slope"]
      - path: "results/ch5/5.2.2/data/"
        description: "Where domain slope analysis outputs"
        search_patterns: ["*slopes*.csv", "*participant*.csv", "*participant*.txt"]
        required_columns: ["UID", "slope"]
      - path: "results/ch5/5.2.3/data/"
        description: "When domain slope analysis outputs"
        search_patterns: ["*slopes*.csv", "*participant*.csv", "*participant*.txt"]
        required_columns: ["UID", "slope"]
    
    output_files:
      - path: "results/ch7/7.6.3/data/step00_dependency_validation.txt"
        description: "Validation summary with file paths found"
        format: "text"
    
    parameters:
      min_size_bytes: 500
      domains_required: ["What", "Where", "When"]
      participants_expected: 100
    
    validation_call:
      # CORRECTED: Use validate_data_format (not validate_data_columns for file validation)
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, expected_format: Dict[str, Any], allow_extra_cols: bool = True) -> Dict[str, Any]"
    
    validation_criteria:
      - "All 3 domain slope files located"
      - "Each file >500 bytes (sufficient detail)" 
      - "File paths contain 'slopes' or 'participant'"
      - "Validation summary contains required information"
    
    expected_behavior_on_failure: "Raise error specifying which domain files missing, log to logs/step00_validate_dependencies.log, quit immediately"

  - name: "step01_extract_and_merge_domain_slopes" 
    step_number: 1
    description: "Load participant-level slopes from Ch5 domain analyses and create unified dataset"
    
    analysis_call:
      type: catalogued
      module: "pandas"
      function: "read_csv"
      signature: "pd.read_csv(filepath_or_buffer: str, **kwargs) -> DataFrame"
    
    input_files:
      - path: "results/ch7/7.6.3/data/step00_dependency_validation.txt"
        description: "File path references from dependency validation"
        source: "step00 output"
      - path: "Ch5 slope files as identified in Step 0"
        description: "Domain-specific slope files"
        expected_columns: ["UID", "slope", "se_slope"]
        expected_rows: "~100"
    
    output_files:
      - path: "results/ch7/7.6.3/data/step01_domain_slopes.csv"
        description: "Merged domain-specific slopes dataset"
        columns: ["UID", "slope_what", "slope_where", "slope_when"]
        format: "csv"
        expected_rows: 100
        expected_cols: 4
    
    parameters:
      index_col: 0
      na_values: [".", "NA", "NaN"]
      merge_on: "UID"
      merge_type: "inner"
    
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: DataFrame, required_columns: List[str]) -> Dict[str, Any]"
    
    validation_criteria:
      - "Exactly 100 participants with complete slope data"
      - "No missing slope values (NaN count = 0)"
      - "No duplicate UIDs"
      - "All slopes negative (forgetting over time)"
      - "Slope values in expected range [-0.8, 0.2]"
    
    expected_behavior_on_failure: "Report specific data quality issues, log to logs/step01_extract_slopes.log, quit if <100 participants"

  - name: "step02_compute_icc_for_each_domain"
    step_number: 2
    description: "Calculate ICC(1,1) values for each domain's slope variance to quantify between-person variance"
    
    analysis_call:
      # CORRECTED: Function is in tools.analysis_lmm (not tools.variance_decomposition) 
      type: catalogued
      module: "tools.analysis_lmm"
      function: "compute_icc_from_variance_components"
      signature: "compute_icc_from_variance_components(variance_components_df: pd.DataFrame, time_point: Optional[float] = None, slope_name: str = 'TSVR_hours') -> pd.DataFrame"
    
    input_files:
      - path: "results/ch7/7.6.3/data/step01_domain_slopes.csv"
        description: "Participant slope data by domain"
        required_columns: ["UID", "slope_what", "slope_where", "slope_when"]
        source: "step01 output"
    
    output_files:
      - path: "results/ch7/7.6.3/data/step02_icc_estimates.csv"
        description: "ICC(1,1) estimates for each domain"
        columns: ["domain", "icc_value", "variance_between", "variance_total"]
        format: "csv"
        expected_rows: 3
        expected_cols: 4
      - path: "results/ch7/7.6.3/data/step02_variance_components.csv"
        description: "Raw variance components for bootstrap resampling"
        columns: ["domain", "variance_between", "variance_total", "n_participants"]
        format: "csv"
        expected_rows: 3
        expected_cols: 4
    
    parameters:
      icc_type: "ICC(1,1)"
      domains: ["What", "Where", "When"]
      slope_analysis: true
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
    
    validation_criteria:
      - "All ICC values in range [0, 1]"
      - "All variance components > 0"
      - "variance_between <= variance_total (mathematical constraint)"
      - "No NaN ICC values"
      - "All 3 domains present (What, Where, When)"
    
    expected_behavior_on_failure: "Report invalid ICC values or variance estimates, log to logs/step02_compute_icc.log"

  - name: "step03_bootstrap_confidence_intervals"
    step_number: 3
    description: "Compute 95% confidence intervals for ICC estimates using participant-level bootstrap resampling"
    
    analysis_call:
      type: catalogued
      module: "tools.bootstrap"
      function: "bootstrap_statistic"
      # CORRECTED: Actual signature from tools/bootstrap.py
      signature: "bootstrap_statistic(data: np.ndarray, statistic: Callable, n_bootstrap: int = 1000, confidence: float = 0.95, seed: Optional[int] = None) -> Dict"
    
    input_files:
      - path: "results/ch7/7.6.3/data/step01_domain_slopes.csv"
        description: "Original slope data for resampling"
        required_columns: ["UID", "slope_what", "slope_where", "slope_when"]
        source: "step01 output"
      - path: "results/ch7/7.6.3/data/step02_variance_components.csv"
        description: "Baseline variance estimates"
        required_columns: ["domain", "variance_between", "variance_total"]
        source: "step02 output"
    
    output_files:
      - path: "results/ch7/7.6.3/data/step03_bootstrap_cis.csv"
        description: "95% confidence intervals for ICC estimates"
        columns: ["domain", "icc_original", "icc_boot_mean", "ci_lower", "ci_upper", "boot_bias"]
        format: "csv"
        expected_rows: 3
        expected_cols: 6
      - path: "results/ch7/7.6.3/data/step03_bootstrap_distributions.csv"
        description: "Raw bootstrap samples (1000 iterations × 3 domains)"
        columns: ["domain", "bootstrap_iteration", "icc_bootstrap"]
        format: "csv"
        expected_rows: 3000
        expected_cols: 3
    
    parameters:
      n_bootstrap: 1000
      confidence: 0.95
      seed: 42
      resampling_unit: "participants"
      method: "percentile"
    
    validation_call:
      module: "tools.validation"
      function: "validate_bootstrap_stability"
      signature: "validate_bootstrap_stability(jaccard_values: Union[np.ndarray, List[float]], min_jaccard_threshold: float = 0.75) -> Dict[str, Any]"
    
    validation_criteria:
      - "All 1000 bootstrap iterations completed successfully"
      - "Success rate >95% for all domains"
      - "CI bounds in [0,1] for all domains"
      - "Bootstrap bias in [-0.1, 0.1] (acceptable range)"
      - "CI widths reasonable (0.05-0.30 typical for ICC)"
    
    expected_behavior_on_failure: "Report failed bootstrap iterations or invalid CIs, increase iterations if needed"

  - name: "step04_statistical_comparisons_between_domains"
    step_number: 4
    description: "Test pairwise differences between domain ICC estimates and compute effect sizes"
    
    analysis_call:
      # CORRECTED: Use analysis_stats (not analysis_lmm) for general effect sizes
      type: catalogued
      module: "tools.analysis_stats"
      function: "compute_effect_sizes"
      signature: "compute_effect_sizes(data: pd.DataFrame, group_col: str, outcome_col: str, effect_type: str = 'cohens_d') -> pd.DataFrame"
    
    input_files:
      - path: "results/ch7/7.6.3/data/step03_bootstrap_distributions.csv"
        description: "Raw bootstrap samples by domain"
        required_columns: ["domain", "bootstrap_iteration", "icc_bootstrap"]
        source: "step03 output"
      - path: "results/ch7/7.6.3/data/step02_icc_estimates.csv"
        description: "Original ICC values"
        required_columns: ["domain", "icc_value"]
        source: "step02 output"
    
    output_files:
      - path: "results/ch7/7.6.3/data/step04_pairwise_comparisons.csv"
        description: "Domain comparison statistics with dual p-values"
        columns: ["comparison", "diff_mean", "diff_ci_lower", "diff_ci_upper", "cohens_d", "p_uncorrected", "p_bonferroni", "p_fdr"]
        format: "csv"
        expected_rows: 3
        expected_cols: 8
    
    parameters:
      comparisons: ["What-Where", "What-When", "Where-When"]
      family_alpha: 0.05
      bonferroni_n_tests: 3
      effect_size_type: "cohens_d"
      d068_compliance: true
    
    validation_call:
      module: "tools.validation"
      function: "validate_contrasts_dual_pvalues"
      signature: "validate_contrasts_dual_pvalues(contrasts_df: DataFrame, required_comparisons: List[str]) -> Dict[str, Any]"
    
    validation_criteria:
      - "All 3 pairwise comparisons present"
      - "BOTH uncorrected AND corrected p-values present (Decision D068)"
      - "p_bonferroni >= p_uncorrected (mathematical constraint)"
      - "Effect sizes (Cohen's d) in reasonable range [-3, 3]"
      - "All p-values in [0, 1]"
    
    expected_behavior_on_failure: "Report invalid test statistics or effect sizes, verify bootstrap difference calculations"

  - name: "step05_outlier_analysis_and_robustness"
    step_number: 5
    description: "Identify outliers in domain-specific slopes and assess impact on ICC estimates"
    
    analysis_call:
      type: catalogued
      module: "scipy.stats"
      function: "zscore"
      signature: "scipy.stats.zscore(a: np.ndarray, axis: int = 0, ddof: int = 0, nan_policy: str = 'propagate') -> np.ndarray"
    
    input_files:
      - path: "results/ch7/7.6.3/data/step01_domain_slopes.csv"
        description: "Original slope data for outlier detection"
        required_columns: ["UID", "slope_what", "slope_where", "slope_when"]
        source: "step01 output"
      - path: "results/ch7/7.6.3/data/step02_icc_estimates.csv"
        description: "Baseline ICC estimates"
        required_columns: ["domain", "icc_value"]
        source: "step02 output"
    
    output_files:
      - path: "results/ch7/7.6.3/data/step05_outlier_analysis.csv"
        description: "Outlier diagnostics and impact assessment"
        columns: ["domain", "UID", "z_score", "outlier_type"]
        format: "csv"
        expected_rows: "variable"
        expected_cols: 4
      - path: "results/ch7/7.6.3/data/step05_robustness_checks.csv"
        description: "ICC estimates with/without outliers"
        columns: ["domain", "icc_original", "icc_no_outliers", "delta_icc"]
        format: "csv"
        expected_rows: 3
        expected_cols: 4
    
    parameters:
      outlier_threshold: 3.29
      outlier_method: ["z_score", "mad"]
      robust_mad: true
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
    
    validation_criteria:
      - "Outlier count reasonable (<10% of participants per domain)"
      - "Delta ICC values consistent with outlier magnitude"
      - "All domains represented in robustness checks"
      - "|z_score| > 3.29 for flagged outliers"
      - "delta_icc in [-0.2, 0.2] (reasonable ICC change)"
    
    expected_behavior_on_failure: "Report excessive outliers or invalid robustness calculations"

  - name: "step06_split_half_reliability_analysis"
    step_number: 6
    description: "Assess reliability of ICC estimates using split-half cross-validation"
    
    analysis_call:
      type: catalogued
      module: "numpy.random"
      function: "choice"
      signature: "np.random.choice(a: np.ndarray, size: int = None, replace: bool = True, p: np.ndarray = None) -> np.ndarray"
    
    input_files:
      - path: "results/ch7/7.6.3/data/step01_domain_slopes.csv"
        description: "Complete slope dataset for split-half"
        required_columns: ["UID", "slope_what", "slope_where", "slope_when"]
        source: "step01 output"
    
    output_files:
      - path: "results/ch7/7.6.3/data/step06_split_half_reliability.csv"
        description: "Split-half reliability statistics by domain"
        columns: ["domain", "reliability_r", "reliability_ci_lower", "reliability_ci_upper", "mean_diff", "sd_icc"]
        format: "csv"
        expected_rows: 3
        expected_cols: 6
    
    parameters:
      n_splits: 100
      seed: 42
      split_size: 50
      reliability_threshold: 0.70
    
    validation_call:
      # CORRECTED: Use validate_data_format for reliability validation
      module: "tools.validation" 
      function: "validate_data_format"
      signature: "validate_data_format(df: pd.DataFrame, expected_format: Dict[str, Any], allow_extra_cols: bool = True) -> Dict[str, Any]"
    
    validation_criteria:
      - "All 3 domains analyzed for reliability"
      - "Reliability estimates based on 100 random splits"
      - "Confidence intervals exclude impossible values"
      - "reliability_r in [-1, 1] (valid correlation range)"
      - "Expected reliability_r > 0.50 for What/Where domains"
    
    expected_behavior_on_failure: "Report poor reliability estimates, check for degenerate splits"

  - name: "step07_power_analysis_and_sensitivity"
    step_number: 7
    description: "Conduct post-hoc power analysis for ICC comparisons and sensitivity analysis for effect detection"
    
    analysis_call:
      # CORRECTED: Use analysis_regression.compute_post_hoc_power (not tools.statistics which doesn't exist)
      type: catalogued
      module: "tools.analysis_regression"
      function: "compute_post_hoc_power"
      signature: "compute_post_hoc_power(n: int, k_predictors: int, r2: float, alpha: float = 0.05) -> float"
    
    input_files:
      - path: "results/ch7/7.6.3/data/step02_icc_estimates.csv"
        description: "Observed ICC values"
        required_columns: ["domain", "icc_value"]
        source: "step02 output"
      - path: "results/ch7/7.6.3/data/step04_pairwise_comparisons.csv"
        description: "Observed effect sizes"
        required_columns: ["comparison", "cohens_d"]
        source: "step04 output"
    
    output_files:
      - path: "results/ch7/7.6.3/data/step07_power_analysis.csv"
        description: "Power and sensitivity results"
        columns: ["comparison", "observed_d", "achieved_power", "min_detectable_d", "required_n_d02"]
        format: "csv"
        expected_rows: 3
        expected_cols: 5
    
    parameters:
      n_participants: 100
      alpha_bonferroni: 0.0167
      power_target: 0.80
      effect_size_small: 0.2
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
    
    validation_criteria:
      - "Power calculations for all 3 pairwise comparisons"
      - "Sensitivity analysis provides realistic estimates"
      - "achieved_power in [0, 1] (valid power range)"
      - "min_detectable_d > 0 (positive effect size)"
      - "required_n_d02 > 100 (larger N needed for small effects)"
    
    expected_behavior_on_failure: "Report invalid power calculations, verify effect size inputs from Step 4"

