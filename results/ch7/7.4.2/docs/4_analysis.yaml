# =============================================================================

execution:
  runtime_estimate: "45 minutes"
  
  random_seeds:
    bootstrap: 42
    cross_validation: 42
    general: 42
  
  statistical_parameters:
    alpha_uncorrected: 0.05
    alpha_corrected: 0.00179  # Bonferroni: 0.05/28
    bootstrap_iterations: 1000
    confidence_level: 0.95
    
  file_format_requirements:
    models: ".pkl"  # Not applicable to this analysis
    data: ".csv"
    logs: ".log"
    text_summaries: ".txt"
    
  data_requirements:
    min_participants: 100
    max_missing_percentage: 5.0
    theta_range: [-3.0, 3.0]
    bvmt_range: [0, 36]

