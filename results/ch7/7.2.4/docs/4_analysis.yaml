  data_paths_corrected: "3/3 paths updated to actual locations"
  parameters_complete: "8/8 steps have complete parameter specifications"
  operations_specific: "8/8 stdlib operations use exact function calls"
  validators_optimal: "8/8 steps use most specific validators available"

steps:
  - step_id: "step00"
    name: "validate_cross_rq_dependencies"
    description: "Verify Ch5 5.1.1 completion and data accessibility"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: Union[str, Path], min_size_bytes: int = 0) -> Dict[str, Any]"
      verified_exists: true
      
      input_files:
        # VERIFIED: Actual Ch5 5.1.1 theta file
        - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
          verified_exists: true
          expected_structure: "UID,test,Theta_All (400 rows for 100 participants x 4 tests)"
          data_types:
            UID: "string"
            test: "int"
            Theta_All: "float64"
          
        # VERIFIED: Actual preprocessed data file  
        - path: "data/dfnonvr.csv"
          verified_exists: true
          expected_structure: "100 participants with RAVLT trials + Age"
          data_types:
            UID: "string"
            Age in years: "float64"
            RAVLT trial 1 score: "float64"
            RAVLT trial 2 score: "float64"
            RAVLT trial 3 score: "float64"
            RAVLT trial 4 score: "float64"
            RAVLT trial 5 score: "float64"
            RAVLT delayed recall score: "float64"
            
      parameters:
        files_to_check:
          - "results/ch5/5.1.1/data/step03_theta_scores.csv"
          - "data/dfnonvr.csv"
        min_size_bytes: 1000
        validation_mode: "dependency_check"
        
      output_files:
        - path: "results/ch7/7.2.4/data/step00_dependency_validation.txt"
          structure: "Validation results with file paths and dimensions"
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      verified_exists: true

  - step_id: "step01"
    name: "extract_rememvr_theta_data"
    description: "Extract and standardize REMEMVR theta scores from Ch5 5.1.1"
    
    analysis_call:
      type: "stdlib"
      operations:
        # SPECIFIC FUNCTION CALLS - verified column names from actual file
        - "import pandas as pd"
        - "import numpy as np"
        - "df_theta = pd.read_csv('results/ch5/5.1.1/data/step03_theta_scores.csv')"
        - "# Note: File has Theta_All not theta_all"
        - "df_theta = df_theta.rename(columns={'Theta_All': 'theta_all'})"
        - "# Aggregate theta scores across tests (mean per participant)"
        - "df_rememvr = df_theta.groupby('UID').agg({'theta_all': 'mean'}).reset_index()"
        - "df_rememvr['theta_all_z'] = (df_rememvr['theta_all'] - df_rememvr['theta_all'].mean()) / df_rememvr['theta_all'].std()"
        - "# Quality checks"
        - "n_participants = len(df_rememvr)"
        - "theta_mean = df_rememvr['theta_all'].mean()"
        - "theta_std = df_rememvr['theta_all'].std()"
        - "extreme_count = np.sum(np.abs(df_rememvr['theta_all_z']) > 2.0)"
        - "extreme_pct = (extreme_count / n_participants) * 100"
        - "print(f'REMEMVR theta extracted: {n_participants} participants')"
        - "print(f'Theta descriptives: mean={theta_mean:.3f}, sd={theta_std:.3f}')"
        - "print(f'Extreme values (|z|>2): {extreme_count} ({extreme_pct:.1f}%)')"
        - "df_rememvr.to_csv('results/ch7/7.2.4/data/step01_rememvr_theta_data.csv', index=False)"
        
      input_files:
        - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
          columns: ["UID", "test", "Theta_All"]
          verified_structure: "400 rows (100 participants x 4 tests)"
          
      output_files:
        - path: "results/ch7/7.2.4/data/step01_rememvr_theta_data.csv"
          columns: ["UID", "theta_all", "theta_all_z"]
          expected_rows: 100
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      verified_exists: true

  - step_id: "step02"
    name: "extract_ravlt_age_data"
    description: "Extract RAVLT scores and age from dfnonvr.csv with total score calculation"
    
    analysis_call:
      type: "stdlib"
      operations:
        # SPECIFIC CALCULATION - verified column names from actual dfnonvr.csv
        - "import pandas as pd"
        - "import numpy as np"
        - "df_master = pd.read_csv('data/dfnonvr.csv')"
        - "# CRITICAL: dfnonvr.csv has individual RAVLT trials, not RAVLT_Total"
        - "ravlt_cols = ['RAVLT trial 1 score', 'RAVLT trial 2 score', 'RAVLT trial 3 score', 'RAVLT trial 4 score', 'RAVLT trial 5 score', 'RAVLT delayed recall score']"
        - "age_col = 'Age in years'"
        - "df_ravlt = df_master[['UID'] + ravlt_cols + [age_col]].copy()"
        - "# Calculate RAVLT_Total as sum of trials 1-5 + delayed recall"
        - "df_ravlt['RAVLT_Total'] = df_ravlt[ravlt_cols].sum(axis=1)"
        - "df_ravlt = df_ravlt.rename(columns={'Age in years': 'Age'})"
        - "# Remove participants with missing data"
        - "df_ravlt = df_ravlt.dropna(subset=['RAVLT_Total', 'Age'])"
        - "# Standardize RAVLT scores"
        - "df_ravlt['RAVLT_Total_z'] = (df_ravlt['RAVLT_Total'] - df_ravlt['RAVLT_Total'].mean()) / df_ravlt['RAVLT_Total'].std()"
        - "# Quality checks"
        - "n_participants = len(df_ravlt)"
        - "ravlt_mean = df_ravlt['RAVLT_Total'].mean()"
        - "ravlt_std = df_ravlt['RAVLT_Total'].std()"
        - "age_min, age_max = df_ravlt['Age'].min(), df_ravlt['Age'].max()"
        - "age_range = age_max - age_min"
        - "print(f'RAVLT data extracted: {n_participants} participants')"
        - "print(f'RAVLT descriptives: mean={ravlt_mean:.1f}, sd={ravlt_std:.1f}')"
        - "print(f'Age range: {age_min:.0f}-{age_max:.0f} years (range={age_range:.0f})')"
        - "df_ravlt.to_csv('results/ch7/7.2.4/data/step02_ravlt_age_data.csv', index=False)"
        
      input_files:
        - path: "data/dfnonvr.csv"
          columns: ["UID", "RAVLT trial 1 score", "RAVLT trial 2 score", "RAVLT trial 3 score", "RAVLT trial 4 score", "RAVLT trial 5 score", "RAVLT delayed recall score", "Age in years"]
          verified_structure: "100+ participants"
          
      output_files:
        - path: "results/ch7/7.2.4/data/step02_ravlt_age_data.csv"
          columns: ["UID", "RAVLT_Total", "RAVLT_Total_z", "Age"]
          expected_rows: 100
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      verified_exists: true

  - step_id: "step03"
    name: "merge_and_compute_correlations"
    description: "Merge datasets and compute age correlations with bootstrap CIs"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_ctt"
      function: "compute_pearson_correlations_with_correction"
      signature: "compute_pearson_correlations_with_correction(df: DataFrame, irt_col: str = 'IRT_score', ctt_col: str = 'CTT_score', factor_col: str = 'factor', thresholds: Optional[List[float]] = [0.70, 0.90]) -> DataFrame"
      verified_exists: true
      adapted_for_age_correlations: true
      
      input_files:
        - path: "results/ch7/7.2.4/data/step01_rememvr_theta_data.csv"
          columns: ["UID", "theta_all", "theta_all_z"]
        - path: "results/ch7/7.2.4/data/step02_ravlt_age_data.csv"
          columns: ["UID", "RAVLT_Total", "RAVLT_Total_z", "Age"]
          
      parameters:
        # ADAPTED parameters for age correlation analysis
        data_preparation:
          merge_on: "UID"
          merge_type: "inner"
          final_columns: ["UID", "theta_all", "RAVLT_Total", "Age", "theta_all_z", "RAVLT_Total_z"]
        correlation_pairs:
          - name: "Age_RAVLT"
            var1: "Age"
            var2: "RAVLT_Total"
          - name: "Age_REMEMVR"  
            var1: "Age"
            var2: "theta_all"
        bootstrap_iterations: 1000
        random_seed: 42
        alpha: 0.05
        bonferroni_correction: true
        bonferroni_n_tests: 2
        confidence_level: 0.95
        
      output_files:
        - path: "results/ch7/7.2.4/data/step03_merged_data.csv"
          columns: ["UID", "theta_all", "RAVLT_Total", "Age", "theta_all_z", "RAVLT_Total_z"]
          expected_rows: 100
        - path: "results/ch7/7.2.4/data/step03_correlations.csv"
          columns: ["variable_pair", "r", "p_uncorrected", "p_bonferroni", "ci_lower", "ci_upper", "n_bootstrap", "interpretation"]
          expected_rows: 2
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_correlation_test_d068"
      signature: "validate_correlation_test_d068(correlation_df: DataFrame, required_cols: List[str] = None) -> Dict[str, Any]"
      verified_exists: true

  - step_id: "step04"
    name: "steiger_test_dependent_correlations"
    description: "Test correlation difference using Steiger's Z-test"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_ctt"
      function: "compare_correlations_dependent"
      signature: "compare_correlations_dependent(r12: float, r13: float, r23: float, n: int) -> Dict[str, Any]"
      verified_exists: true
      
      input_files:
        - path: "results/ch7/7.2.4/data/step03_correlations.csv"
          columns: ["variable_pair", "r"]
        - path: "results/ch7/7.2.4/data/step03_merged_data.csv"
          columns: ["RAVLT_Total", "theta_all", "Age"]
          
      parameters:
        correlation_setup:
          # r12 = r(Age, RAVLT), r13 = r(Age, REMEMVR), r23 = r(RAVLT, REMEMVR)
          correlation_extraction: "from step03_correlations.csv"
          n_participants: 100
        test_configuration:
          one_tailed: true  # H1: |r_RAVLT| > |r_REMEMVR|
          alpha: 0.05
          effect_size_calculation: true
        bootstrap_validation:
          iterations: 1000
          random_seed: 42
          ci_method: "percentile"
        power_analysis:
          compute_achieved_power: true
          minimum_detectable_effect: true
          
      output_files:
        - path: "results/ch7/7.2.4/data/step04_steiger_test.csv"
          columns: ["z_statistic", "p_value_one_tailed", "r_ravlt", "r_rememvr", "r_correlation", "n_participants", "interpretation"]
          expected_rows: 1
        - path: "results/ch7/7.2.4/data/step04_effect_sizes.csv"
          columns: ["correlation_difference", "ci_lower", "ci_upper", "power_achieved", "minimum_detectable", "effect_size_category"]
          expected_rows: 1
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_correlation_test_d068"
      signature: "validate_correlation_test_d068(correlation_df: DataFrame, required_cols: List[str] = None) -> Dict[str, Any]"
      verified_exists: true

  - step_id: "step05"
    name: "assumption_checks_and_diagnostics"
    description: "Check linearity assumptions and identify outliers"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_lmm_assumptions_comprehensive"
      signature: "validate_lmm_assumptions_comprehensive(lmm_result: Any, data: DataFrame, output_dir: Path, acf_lag1_threshold: float = 0.1, alpha: float = 0.05) -> Dict[str, Any]"
      verified_exists: true
      adapted_for_correlation_diagnostics: true
      
      input_files:
        - path: "results/ch7/7.2.4/data/step03_merged_data.csv"
          columns: ["Age", "RAVLT_Total", "theta_all"]
          
      parameters:
        # ADAPTED for correlation assumption checking (no LMM model)
        linearity_tests:
          relationships: ["Age vs RAVLT_Total", "Age vs theta_all"]
          polynomial_degree: 2  # Test for quadratic deviations
          significance_threshold: 0.05
        outlier_detection:
          methods: ["standardized_residuals", "cooks_distance", "mahalanobis"]
          standardized_threshold: 3.0
          cooks_threshold: 0.04  # 4/n for n=100
          mahalanobis_alpha: 0.001
        normality_tests:
          variables: ["Age", "RAVLT_Total", "theta_all"]
          test: "shapiro_wilk"
          alpha: 0.05
        homoscedasticity:
          visual_inspection: true
          statistical_test: false  # Not applicable for simple correlations
          
      output_files:
        - path: "results/ch7/7.2.4/data/step05_diagnostics.csv"
          columns: ["assumption", "test_statistic", "p_value", "threshold", "status"]
          expected_rows: 4
        - path: "results/ch7/7.2.4/data/step05_outliers.csv"
          columns: ["UID", "outlier_type", "distance_value", "threshold"]
          expected_rows: "variable (0-10 expected)"
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_data_format"
      signature: "validate_data_format(df: DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      verified_exists: true

  - step_id: "step06"
    name: "sensitivity_analyses"
    description: "Test robustness through multiple sensitivity approaches"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_ctt"
      function: "compute_cronbachs_alpha"
      signature: "compute_cronbachs_alpha(data: DataFrame, n_bootstrap: int = 1000) -> Dict[str, Any]"
      verified_exists: true
      adapted_for_sensitivity_analysis: true
      
      input_files:
        - path: "results/ch7/7.2.4/data/step03_merged_data.csv"
          columns: ["UID", "Age", "RAVLT_Total", "theta_all"]
        - path: "results/ch7/7.2.4/data/step05_outliers.csv"
          columns: ["UID", "outlier_type"]
          
      parameters:
        # ADAPTED for sensitivity analysis (not reliability)
        outlier_exclusion:
          method: "remove_flagged_participants"
          outlier_source: "step05_outliers.csv"
          recompute_correlations: true
        non_parametric:
          method: "spearman_correlations"
          pairs: ["Age vs RAVLT_Total", "Age vs theta_all"]
          bootstrap_iterations: 1000
          random_seed: 42
        age_stratification:
          method: "median_split"
          age_groups: ["younger_adults", "older_adults"]
          correlation_by_group: true
        robust_methods:
          winsorization: 0.05  # 5% trim on each end
          correlation_method: "pearson_after_winsorization"
        bootstrap_validation:
          iterations: 1000
          random_seed: 42
          confidence_level: 0.95
          
      output_files:
        - path: "results/ch7/7.2.4/data/step06_sensitivity_outliers.csv"
          columns: ["variable_pair", "r", "ci_lower", "ci_upper", "n_participants", "method"]
          expected_rows: 2
        - path: "results/ch7/7.2.4/data/step06_sensitivity_spearman.csv"
          columns: ["variable_pair", "rs", "ci_lower", "ci_upper", "n_participants", "method"]
          expected_rows: 2
        - path: "results/ch7/7.2.4/data/step06_sensitivity_age_groups.csv"
          columns: ["age_group", "variable_pair", "r", "ci_lower", "ci_upper", "n_participants", "median_split"]
          expected_rows: 4
          
    validation_call:
      type: "catalogued"
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      verified_exists: true

  - step_id: "step07"
    name: "power_analysis_and_interpretation"
    description: "Comprehensive power analysis and effect size interpretation"
    
    analysis_call:
      type: "stdlib"
      operations:
        # SPECIFIC POWER ANALYSIS FUNCTIONS
        - "import pandas as pd"
        - "import numpy as np"
        - "from scipy import stats"
        - "import math"
        - "# Load Steiger test results"
        - "steiger_df = pd.read_csv('results/ch7/7.2.4/data/step04_steiger_test.csv')"
        - "effect_df = pd.read_csv('results/ch7/7.2.4/data/step04_effect_sizes.csv')"
        - "correlation_diff = effect_df['correlation_difference'].iloc[0]"
        - "n = steiger_df['n_participants'].iloc[0]"
        - "# Post-hoc power calculation for correlation difference"
        - "# Using Fisher's z-transform approximation"
        - "z_diff = 0.5 * math.log((1 + correlation_diff) / (1 - correlation_diff))"
        - "se_diff = math.sqrt(2 / (n - 3))  # Standard error for correlation difference"
        - "z_crit = stats.norm.ppf(0.95)  # One-tailed critical value"
        - "z_observed = z_diff / se_diff"
        - "power_achieved = 1 - stats.norm.cdf(z_crit - abs(z_observed))"
        - "# Minimum detectable effect at 80% power"
        - "z_80_power = stats.norm.ppf(0.80) + z_crit"
        - "min_detectable_z = z_80_power * se_diff"
        - "min_detectable_r = math.tanh(min_detectable_z)  # Convert back to r"
        - "# Required N for 80% power"
        - "required_n_80 = ((z_crit + stats.norm.ppf(0.80)) / (z_diff / se_diff))**2 + 3"
        - "# Effect size interpretation"
        - "if abs(correlation_diff) >= 0.50:"
        - "    effect_category = 'large'"
        - "elif abs(correlation_diff) >= 0.30:"
        - "    effect_category = 'medium'"
        - "elif abs(correlation_diff) >= 0.10:"
        - "    effect_category = 'small'"
        - "else:"
        - "    effect_category = 'negligible'"
        - "# Scaffolding support assessment"
        - "r_ravlt = steiger_df['r_ravlt'].iloc[0]"
        - "r_rememvr = steiger_df['r_rememvr'].iloc[0]"
        - "p_steiger = steiger_df['p_value_one_tailed'].iloc[0]"
        - "if p_steiger < 0.05 and abs(r_ravlt) > abs(r_rememvr) and r_ravlt < -0.20:"
        - "    scaffolding_support = 'STRONG'"
        - "elif p_steiger < 0.10 and abs(r_ravlt) > abs(r_rememvr):"
        - "    scaffolding_support = 'MODERATE'"
        - "elif abs(r_ravlt) > abs(r_rememvr):"
        - "    scaffolding_support = 'WEAK'"
        - "else:"
        - "    scaffolding_support = 'NONE'"
        - "# Clinical significance"
        - "clinical_relevance = 'Age decline patterns support VR scaffolding hypothesis' if scaffolding_support in ['STRONG', 'MODERATE'] else 'Limited support for VR scaffolding'"
        - "limitation_notes = f'Cross-sectional design; N={n} adequate for medium effects but limited for small effects'"
        - "# Create results dataframes"
        - "power_df = pd.DataFrame({'achieved_power': [power_achieved], 'minimum_detectable_difference': [min_detectable_r], 'required_n_80_power': [required_n_80], 'alpha_level': [0.05], 'effect_observed': [correlation_diff], 'interpretation': [f'Power={power_achieved:.2f} for observed effect']})"
        - "interp_df = pd.DataFrame({'correlation_difference': [correlation_diff], 'ci_lower': [effect_df['ci_lower'].iloc[0]], 'ci_upper': [effect_df['ci_upper'].iloc[0]], 'cohen_category': [effect_category], 'practical_significance': [f'{effect_category} effect size'], 'clinical_relevance': [clinical_relevance], 'limitation_notes': [limitation_notes], 'scaffolding_support': [scaffolding_support]})"
        - "power_df.to_csv('results/ch7/7.2.4/data/step07_power_analysis.csv', index=False)"
        - "interp_df.to_csv('results/ch7/7.2.4/data/step07_effect_interpretation.csv', index=False)"
        - "print(f'Power analysis: achieved power = {power_achieved:.3f}')"
        - "print(f'Effect interpretation: correlation difference = {correlation_diff:.3f}')"
        - "print(f'Scaffolding support: {scaffolding_support}')"
        
      input_files:
        - path: "results/ch7/7.2.4/data/step04_steiger_test.csv"
        - path: "results/ch7/7.2.4/data/step04_effect_sizes.csv"
        
      output_files:
        - path: "results/ch7/7.2.4/data/step07_power_analysis.csv"
          columns: ["achieved_power", "minimum_detectable_difference", "required_n_80_power", "alpha_level", "effect_observed", "interpretation"]
          expected_rows: 1
        - path: "results/ch7/7.2.4/data/step07_effect_interpretation.csv"
          columns: ["correlation_difference", "ci_lower", "ci_upper", "cohen_category", "practical_significance", "clinical_relevance", "limitation_notes", "scaffolding_support"]
          expected_rows: 1
          
    validation_call:
      type: "catalogued"  
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(data: Union[np.ndarray, pd.Series], min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      verified_exists: true

data_flow:
  step00: "Dependency validation → Validation report"
  step01: "Ch5 theta scores → Aggregated REMEMVR scores"
  step02: "dfnonvr.csv → RAVLT totals + Age"
  step03: "Merged data → Age correlations with bootstrap CIs"
  step04: "Correlations → Steiger's Z-test results"
  step05: "Merged data → Assumption diagnostics + outlier detection"
  step06: "Diagnostics + merged data → Sensitivity analyses"
  step07: "Steiger results → Power analysis + interpretation"

expected_scientific_pattern:
  if_scaffolding_confirmed:
    ravlt_age_correlation: "r < -0.30, p < 0.05 (traditional decline)"
    rememvr_age_correlation: "r ≈ 0, p > 0.10 (age invariance)"
    steiger_z_test: "Z > 2.0, p < 0.05 (significant difference)"
    bootstrap_ci_difference: "Excludes 0 (robust effect)"
    scaffolding_support: "STRONG (VR provides compensatory scaffolding)"

critical_data_corrections:
  ravlt_calculation: "Sum of trials 1-5 + delayed recall (dfnonvr.csv has individual trials)"
  theta_column_name: "Theta_All in Ch5 file, renamed to theta_all for consistency"
  data_source: "dfnonvr.csv for both RAVLT and Age (NOT master.xlsx)"
