  rq_id: "ch7/7.2.4"
  rq_title: "VR Scaffolding Validation"
  total_steps: 8
  verification_status: "fully_verified"
  corrections_applied: 6
  critical_fixes:
    - "RAVLT_Total not in dfnonvr.csv -> Sum individual trials 1-5 + delayed"
    - "theta_all not in Ch5 -> Use Theta_All from step03_theta_scores.csv"
    - "master.xlsx path -> Use dfnonvr.csv for RAVLT and Age"
