    sex: ['sex']  # 0=female, 1=male in dfnonvr.csv
    education: ['education']
    dass_total: ['total-dass-depression-items', 'total-dass-anxiety-items', 'total-dass-stress-items']
    sleep: ['typical-sleep-hours']

steps:
  - name: "step00_validate_dependencies"
    step_number: 0
    description: "Validate cross-RQ dependencies exist before proceeding with analysis"
    
    analysis_call:
      type: "catalogued"
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: str, min_size_bytes: int = 1000) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
        description: "Ch5 theta_all scores dependency"
        required_columns: ["UID", "theta_all"]
        expected_rows: "~100"
      - path: "data/dfnonvr.csv" 
        description: "Cognitive test and participant data source"
        required_columns: ["uid", "age", "sex", "education", "ravlt-trial-1-score", "bvmt-total-recall", "rpm-score"]
        expected_rows: "100"
        
    output_files:
      - path: "results/ch7/7.8.3/data/step00_dependency_validation.txt"
        description: "Dependency validation results for Ch5 5.1.1 outputs and dfnonvr.csv"
        
    parameters:
      files_to_check:
        - "results/ch5/5.1.1/data/step03_theta_scores.csv"
        - "data/dfnonvr.csv"
      min_size_bytes: 1000
      
    validation_call:
      module: "tools.validation"
      function: "check_file_exists"
      signature: "check_file_exists(file_path: str, min_size_bytes: int = 1000) -> Dict[str, Any]"
      
    expected_behavior_on_failure: "Raise error with specific missing dependency, quit immediately, log to results/ch7/7.8.3/logs/step00_dependency_validation.log"

  - name: "step01_extract_cognitive_tests"
    step_number: 1
    description: "Extract cognitive test scores from dfnonvr.csv and compute T-score transformations"
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"
      function: "extract_cognitive_tests"
      signature: "extract_cognitive_tests(uid_list: Optional[List[str]] = None, data_path: str = './data/dfnonvr.csv') -> pd.DataFrame"
      
    input_files:
      - path: "data/dfnonvr.csv"
        description: "Cognitive test raw scores and demographics"
        required_columns: ["uid", "age", "sex", "education", "ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score", "bvmt-total-recall", "rpm-score", "total-dass-depression-items", "total-dass-anxiety-items", "total-dass-stress-items", "typical-sleep-hours"]
        expected_rows: "100"
        data_types:
          uid: "object"
          age: "float64" 
          sex: "int64"
          education: "float64"
          
    output_files:
      - path: "results/ch7/7.8.3/data/step01_cognitive_tests.csv"
        description: "Extracted cognitive tests with T-score transformations"
        columns: ["UID", "Age", "Sex", "Education", "RAVLT_T", "BVMT_T", "RPM_T", "DASS_Total", "Sleep"]
        dimensions: "100 rows x 9 columns"
      - path: "results/ch7/7.8.3/data/step01_descriptive_stats.csv"  
        description: "Descriptive statistics for all extracted variables"
        columns: ["variable", "mean", "sd", "min", "max", "missing_count"]
        
    parameters:
      data_path: "data/dfnonvr.csv"
      t_score_transform: true
      target_mean: 50.0
      target_sd: 10.0
      sex_coding: {"female": 0, "male": 1}
      ravlt_columns: ["ravlt-trial-1-score", "ravlt-trial-2-score", "ravlt-trial-3-score", "ravlt-trial-4-score", "ravlt-trial-5-score"]
      bvmt_column: "bvmt-total-recall"
      rpm_column: "rpm-score"
      # Note: Skipping NART as not available in dfnonvr.csv
      dass_columns: ["total-dass-depression-items", "total-dass-anxiety-items", "total-dass-stress-items"]
      sleep_column: "typical-sleep-hours"
      
    validation_call:
      module: "tools.validation"
      function: "validate_data_columns"
      signature: "validate_data_columns(df: pd.DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      
    expected_behavior_on_failure: "Raise error with specific validation failure, log to results/ch7/7.8.3/logs/step01_extract_cognitive.log, quit immediately, invoke g_debug"

  - name: "step02_extract_theta_scores"
    step_number: 2
    description: "Load theta_all scores from Ch5 5.1.1 results and merge with cognitive tests"
    
    analysis_call:
      type: "stdlib"
      operation: "data_loading_and_merging"
      implementation: |
        # Load theta scores from Ch5 5.1.1
        import pandas as pd
        import numpy as np
        
        # Load theta_all scores
        theta_file = "results/ch5/5.1.1/data/step03_theta_scores.csv"
        df_theta = pd.read_csv(theta_file)
        
        # Verify theta_all column exists
        if 'theta_all' not in df_theta.columns:
            raise ValueError("theta_all column not found in Ch5 theta scores")
            
        # Check for extreme values
        extreme_theta = df_theta['theta_all'].abs() > 4
        if extreme_theta.any():
            print(f"Warning: {extreme_theta.sum()} theta values outside [-4, 4] range")
            
        # Load cognitive test data
        cognitive_file = "results/ch7/7.8.3/data/step01_cognitive_tests.csv"
        df_cognitive = pd.read_csv(cognitive_file)
        
        # Merge on UID
        df_merged = pd.merge(df_cognitive, df_theta[['UID', 'theta_all']], on='UID', how='inner')
        
        # Verify merge completeness
        if len(df_merged) != len(df_cognitive):
            missing_uids = set(df_cognitive['UID']) - set(df_merged['UID'])
            raise ValueError(f"Merge failed: {len(missing_uids)} participants missing theta scores")
            
        # Save outputs
        df_theta[['UID', 'theta_all']].to_csv("results/ch7/7.8.3/data/step02_theta_all_scores.csv", index=False)
        df_merged.to_csv("results/ch7/7.8.3/data/step02_analysis_input.csv", index=False)
        
    input_files:
      - path: "results/ch5/5.1.1/data/step03_theta_scores.csv"
        description: "Ch5 theta_all scores"
        required_columns: ["UID", "theta_all"]
        expected_rows: "~100"
      - path: "results/ch7/7.8.3/data/step01_cognitive_tests.csv"
        description: "Cognitive test data from step 1"
        required_columns: ["UID", "Age", "Sex", "Education", "RAVLT_T", "BVMT_T", "RPM_T", "DASS_Total", "Sleep"]
        source: "extract_cognitive_tests output"
        
    output_files:
      - path: "results/ch7/7.8.3/data/step02_theta_all_scores.csv"
        description: "Theta-all scores loaded from Ch5 5.1.1"
        columns: ["UID", "theta_all"]
        dimensions: "100 rows x 2 columns"
      - path: "results/ch7/7.8.3/data/step02_analysis_input.csv"
        description: "Complete merged analysis dataset for regression modeling"
        columns: ["UID", "Age", "Sex", "Education", "RAVLT_T", "BVMT_T", "RPM_T", "DASS_Total", "Sleep", "theta_all"]
        dimensions: "100 rows x 10 columns"
        
    parameters:
      theta_range_check: [-4, 4]
      merge_on: "UID"
      require_complete_merge: true
      
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
      
    expected_behavior_on_failure: "Raise error with merge details, log to results/ch7/7.8.3/logs/step02_extract_theta.log, quit immediately, invoke g_debug"

  - name: "step03_define_nested_models"
    step_number: 3  
    description: "Specify 4 nested regression models with increasing complexity"
    
    analysis_call:
      type: "stdlib"
      operation: "model_specification"
      implementation: |
        import pandas as pd
        import json
        
        # Define 4 nested models with explicit predictor lists
        nested_models = [
            {
                "model_name": "Minimal",
                "num_predictors": 2,
                "predictor_list": ["Age", "RAVLT_T"],
                "rationale": "Core age and verbal memory model"
            },
            {
                "model_name": "Core", 
                "num_predictors": 3,
                "predictor_list": ["Age", "RAVLT_T", "BVMT_T"],
                "rationale": "Add visuospatial memory to core model"
            },
            {
                "model_name": "Extended",
                "num_predictors": 5, 
                "predictor_list": ["Age", "RAVLT_T", "BVMT_T", "RPM_T", "Education"],
                "rationale": "Add fluid intelligence and education"
            },
            {
                "model_name": "Full",
                "num_predictors": 8,  # Reduced from 9 - no NART
                "predictor_list": ["Age", "RAVLT_T", "BVMT_T", "RPM_T", "Education", "DASS_Total", "Sleep", "Sex"],
                "rationale": "Complete model with mood, sleep, and demographic factors"
            }
        ]
        
        # Check all predictors exist in analysis dataset
        analysis_data = pd.read_csv("results/ch7/7.8.3/data/step02_analysis_input.csv")
        available_predictors = analysis_data.columns.tolist()
        
        for model in nested_models:
            missing_predictors = [p for p in model["predictor_list"] if p not in available_predictors]
            if missing_predictors:
                raise ValueError(f"Model {model['model_name']} references missing predictors: {missing_predictors}")
        
        # Save model specifications
        df_models = pd.DataFrame(nested_models)
        df_models.to_csv("results/ch7/7.8.3/data/step03_nested_models.csv", index=False)
        
        # Save detailed specifications  
        with open("results/ch7/7.8.3/data/step03_model_specs.txt", 'w') as f:
            f.write("Nested Regression Model Specifications\n")
            f.write("======================================\n\n")
            for model in nested_models:
                f.write(f"Model: {model['model_name']}\n")
                f.write(f"Predictors ({model['num_predictors']}): {', '.join(model['predictor_list'])}\n")
                f.write(f"Rationale: {model['rationale']}\n\n")
                
    input_files:
      - path: "results/ch7/7.8.3/data/step02_analysis_input.csv"
        description: "Complete analysis dataset"
        required_columns: ["UID", "Age", "Sex", "Education", "RAVLT_T", "BVMT_T", "RPM_T", "DASS_Total", "Sleep", "theta_all"]
        source: "merged dataset from step 2"
        
    output_files:
      - path: "results/ch7/7.8.3/data/step03_nested_models.csv"
        description: "Specifications for 4 nested regression models"
        columns: ["model_name", "num_predictors", "predictor_list", "rationale"]
        dimensions: "4 rows x 4 columns"
      - path: "results/ch7/7.8.3/data/step03_model_specs.txt"
        description: "Detailed model specifications with theoretical rationale"
        
    parameters:
      model_structure: "nested"
      nesting_verification: true
      outcome_variable: "theta_all"
      # Note: Reduced from 9 to 8 predictors max - NART not available
      
    validation_call:
      module: "tools.validation"
      function: "validate_dataframe_structure"
      signature: "validate_dataframe_structure(df: pd.DataFrame, expected_columns: List[str], expected_rows: Optional[int] = None) -> Dict[str, Any]"
      
    expected_behavior_on_failure: "Raise error with model specification issue, log to results/ch7/7.8.3/logs/step03_model_specs.log, quit immediately, invoke g_debug"

  - name: "step04_cross_validation"
    step_number: 4
    description: "Perform 5-fold cross-validation for all 4 models and compute training vs CV performance"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "cross_validate_regression"
      signature: "cross_validate_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_folds: int = 5, random_state: int = 42, scoring_metrics: List[str] = ['mse', 'r2']) -> Dict"
      
    input_files:
      - path: "results/ch7/7.8.3/data/step02_analysis_input.csv"
        description: "Analysis dataset"
        required_columns: ["theta_all", "Age", "RAVLT_T", "BVMT_T", "RPM_T", "Education", "DASS_Total", "Sleep", "Sex"]
        source: "merged analysis dataset"
      - path: "results/ch7/7.8.3/data/step03_nested_models.csv"
        description: "Model specifications"
        required_columns: ["model_name", "predictor_list"]
        source: "model specifications"
        
    output_files:
      - path: "results/ch7/7.8.3/data/step04_cv_results.csv"
        description: "Cross-validation results for all 4 models"
        columns: ["model", "train_r2_mean", "train_r2_sd", "cv_r2_mean", "cv_r2_sd", "shrinkage", "overfitting_flag"]
        dimensions: "4 rows x 7 columns"
      - path: "results/ch7/7.8.3/data/step04_cv_bootstrap_cis.csv"
        description: "Bootstrap confidence intervals for CV-R² estimates"
        columns: ["model", "cv_r2_mean", "ci_lower", "ci_upper"]
        dimensions: "4 rows x 4 columns"
      - path: "results/ch7/7.8.3/data/step04_fold_details.csv"
        description: "Individual fold results (20 rows: 4 models x 5 folds)"
        columns: ["model", "fold", "train_r2", "cv_r2", "shrinkage"]
        dimensions: "20 rows x 5 columns"
        
    parameters:
      n_folds: 5
      random_state: 42
      scoring_metrics: ["r2", "mse"]
      stratification: "age"
      bootstrap_iterations: 1000
      overfitting_threshold: 0.10
      shuffle: true
      
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"
      signature: "validate_numeric_range(df: pd.DataFrame, column: str, min_val: float, max_val: float, allow_none: bool = False) -> Dict[str, Any]"
      
    expected_behavior_on_failure: "Raise error with CV implementation details, log to results/ch7/7.8.3/logs/step04_cross_validation.log, quit immediately, invoke g_debug"

  - name: "step05_model_comparison"
    step_number: 5
    description: "Compare models using cross-validated R² and apply parsimony criterion for selection"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], feature_names: Optional[List[str]] = None) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch7/7.8.3/data/step04_cv_results.csv"
        description: "CV performance for 4 models"
        required_columns: ["model", "cv_r2_mean", "shrinkage"]
        source: "cross_validate_regression output"
      - path: "results/ch7/7.8.3/data/step04_cv_bootstrap_cis.csv"
        description: "CV confidence intervals"
        required_columns: ["model", "cv_r2_mean", "ci_lower", "ci_upper"]
        source: "bootstrap CI results"
        
    output_files:
      - path: "results/ch7/7.8.3/data/step05_model_comparison.csv"
        description: "Model ranking and selection results"
        columns: ["model", "cv_r2", "rank", "parsimony_selected", "shrinkage", "selected_as_optimal"]
        dimensions: "4 rows x 6 columns"
      - path: "results/ch7/7.8.3/data/step05_nested_comparisons.csv"
        description: "Nested F-tests with dual p-values (Decision D068)"
        columns: ["comparison", "f_stat", "p_uncorrected", "p_bonferroni", "significant_corrected"]
        dimensions: "3 rows x 5 columns"
      - path: "results/ch7/7.8.3/data/step05_optimal_model.txt"
        description: "Selected optimal model with rationale"
        
    parameters:
      parsimony_threshold: 0.02
      bonferroni_family: "within_rq"
      comparisons: ["Minimal_vs_Core", "Core_vs_Extended", "Extended_vs_Full"]
      alpha: 0.05
      corrected_alpha: 0.0167  # 0.05/3 comparisons
      
    validation_call:
      module: "tools.validation"
      function: "validate_regression_assumptions"
      signature: "validate_regression_assumptions(model: sm.regression.linear_model.RegressionResultsWrapper, X: pd.DataFrame, return_plots: bool = False) -> Dict"
      
    expected_behavior_on_failure: "Raise error with model selection issue, log to results/ch7/7.8.3/logs/step05_model_comparison.log, quit immediately, invoke g_debug"

  - name: "step06_final_model_fitting"
    step_number: 6
    description: "Fit optimal model on full dataset and extract detailed coefficient information"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "bootstrap_regression_ci"
      signature: "bootstrap_regression_ci(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_bootstrap: int = 1000, confidence_level: float = 0.95, random_state: int = 42) -> pd.DataFrame"
      
    input_files:
      - path: "results/ch7/7.8.3/data/step02_analysis_input.csv"
        description: "Full analysis dataset"
        required_columns: ["theta_all", "Age", "RAVLT_T", "BVMT_T", "RPM_T", "Education", "DASS_Total", "Sleep", "Sex"]
        source: "full analysis dataset"
      - path: "results/ch7/7.8.3/data/step05_optimal_model.txt"
        description: "Optimal model specification"
        source: "model comparison and selection results"
        
    output_files:
      - path: "results/ch7/7.8.3/data/step06_final_model_summary.csv"
        description: "Final model fit statistics"
        columns: ["r2", "adj_r2", "f_stat", "model_p_value"]
        dimensions: "1 row x 4 columns"
      - path: "results/ch7/7.8.3/data/step06_coefficients.csv"
        description: "Beta coefficients with bootstrap CIs and dual p-values"
        columns: ["predictor", "beta", "se", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni"]
        dimensions: "N predictors x 7 columns (based on optimal model)"
      - path: "results/ch7/7.8.3/data/step06_semipartial_correlations.csv"
        description: "Semi-partial correlations for unique variance contribution"
        columns: ["predictor", "sr2", "percent_unique_variance"]
        dimensions: "N predictors x 3 columns"
        
    parameters:
      n_bootstrap: 1000
      confidence_level: 0.95
      random_state: 42
      method: "percentile"
      bonferroni_correction: true
      include_intercept: true
      
    validation_call:
      module: "tools.validation"
      function: "validate_bootstrap_stability"
      signature: "validate_bootstrap_stability(jaccard_values: Union[np.ndarray, List[float]], min_jaccard_threshold: float) -> Dict[str, Any]"
      
    expected_behavior_on_failure: "Raise error with model fitting details, log to results/ch7/7.8.3/logs/step06_final_model.log, quit immediately, invoke g_debug"

  - name: "step07_diagnostic_validation"
    step_number: 7
    description: "Validate regression assumptions and check model diagnostics for optimal model"
    
    analysis_call:
      type: "catalogued" 
      module: "tools.analysis_regression"
      function: "compute_regression_diagnostics"
      signature: "compute_regression_diagnostics(model: sm.regression.linear_model.RegressionResultsWrapper, X: Union[np.ndarray, pd.DataFrame], return_dataframe: bool = True) -> Dict"
      
    input_files:
      - path: "results/ch7/7.8.3/data/step02_analysis_input.csv"
        description: "Analysis dataset for residual computation"
        required_columns: ["theta_all"]
        source: "analysis dataset"
      - path: "results/ch7/7.8.3/data/step06_coefficients.csv"
        description: "Fitted model coefficients"
        required_columns: ["predictor", "beta"]
        source: "fitted model coefficients"
        
    output_files:
      - path: "results/ch7/7.8.3/data/step07_assumption_tests.csv"
        description: "Formal assumption tests (Shapiro-Wilk, Breusch-Pagan)"
        columns: ["test_name", "statistic", "p_value"]
        dimensions: "3 rows x 3 columns"
      - path: "results/ch7/7.8.3/data/step07_vif_results.csv"
        description: "Variance inflation factors for multicollinearity assessment"
        columns: ["predictor", "vif"]
        dimensions: "N predictors x 2 columns (matches optimal model)"
      - path: "results/ch7/7.8.3/data/step07_outlier_analysis.csv"
        description: "Outlier diagnostics for all participants"
        columns: ["UID", "cooks_d", "leverage", "studentized_residual"]
        dimensions: "100 rows x 4 columns"
      - path: "results/ch7/7.8.3/data/step07_diagnostic_data.csv"
        description: "Residual and fitted values for diagnostic plotting"
        columns: ["UID", "residual", "fitted"]
        dimensions: "100 rows x 3 columns"
        
    parameters:
      outlier_thresholds:
        cooks_d: 0.04  # 4/N where N=100
        leverage: 0.20  # 2*(p+1)/N assuming ~10 predictors max
        studentized: 3.0
      assumption_tests:
        - "shapiro_wilk"
        - "breusch_pagan" 
        - "vif"
      alpha: 0.05
      
    validation_call:
      module: "tools.validation"
      function: "validate_regression_assumptions"
      signature: "validate_regression_assumptions(model: sm.regression.linear_model.RegressionResultsWrapper, X: pd.DataFrame, return_plots: bool = False) -> Dict"
      
    expected_behavior_on_failure: "Raise error with diagnostic details, log to results/ch7/7.8.3/logs/step07_diagnostics.log, quit immediately, invoke g_debug"

  - name: "step08_sensitivity_analysis"
    step_number: 8
    description: "Perform sensitivity analyses including outlier exclusion and alternative CV approaches"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], feature_names: Optional[List[str]] = None) -> Dict[str, Any]"
      
    input_files:
      - path: "results/ch7/7.8.3/data/step02_analysis_input.csv"
        description: "Analysis dataset"
        required_columns: ["theta_all"]
        source: "analysis dataset"
      - path: "results/ch7/7.8.3/data/step05_optimal_model.txt"
        description: "Optimal model specification"
        source: "optimal model specification"
      - path: "results/ch7/7.8.3/data/step07_outlier_analysis.csv"
        description: "Outlier identification"
        required_columns: ["UID", "cooks_d"]
        source: "outlier identification"
        
    output_files:
      - path: "results/ch7/7.8.3/data/step08_outlier_sensitivity.csv"
        description: "Model comparison with/without outliers"
