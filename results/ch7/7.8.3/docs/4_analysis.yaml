metadata:
  rq_id: "ch7/7.8.3"
  verification_level: "deep_v5.3.0"
  module_corrections: 3
  path_corrections: 18
  data_source_corrections: 4
  validator_corrections: 2
  format_corrections: 1
  
  critical_data_sources:
    cognitive_tests: "data/dfnonvr.csv"  # NEVER master.xlsx for Ch7
    participant_data: "data/dfnonvr.csv"  # Demographics, DASS, etc.
    theta_scores: "results/ch5/5.1.1/data/step03_theta_scores.csv"
    
  dfnonvr_column_mapping:
    ravlt_total: ['ravlt-trial-1-score', 'ravlt-trial-2-score', 'ravlt-trial-3-score', 'ravlt-trial-4-score', 'ravlt-trial-5-score']
    bvmt_total: ['bvmt-total-recall']
    rpm_score: ['rpm-score'] 
    # Note: NART not available in dfnonvr.csv - skip from analysis
