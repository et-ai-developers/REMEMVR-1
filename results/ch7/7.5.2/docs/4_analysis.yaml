          - "nart-score" # EXACT name from dfnonvr.csv (RAVLT not available)
        complete_cases_only: true
        theta_source: "results/ch5/5.1.1/data/step03_theta_scores.csv"
        participant_source: "data/dfnonvr.csv"  # v5.3.0: MANDATORY data source
    
    input_files:
