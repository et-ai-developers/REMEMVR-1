  - name: "step02_descriptives"
    step_number: 2
    description: "Generate descriptive statistics and check distributional assumptions"
    dependencies: ["step01_extract_merge_data"]
    verification_status:
      module_verified: true
      validator_appropriate: true  # CORRECTED: regression validator for descriptives
      file_formats_compatible: true
      path_organization: "hierarchical"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_multiple_regression"
      signature: "fit_multiple_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], feature_names: Optional[List[str]] = None) -> Dict[str, Any]"
      
      parameters:
        outcome_var: "theta_all"
        standardize_predictors: true
        compute_correlations: true
        test_normality: true
        alpha_level: 0.05
        descriptives_only: true  # Only compute descriptives, not full regression yet
    
    input_files:
      - path: "results/ch7/7.5.2/data/step01_analysis_dataset.csv"  # CORRECTED: hierarchical
        required_columns: ["UID", "theta_all", "dass_dep", "dass_anx", "dass_str", "age", "nart_score"]
        description: "Analysis-ready dataset from Step 1"
    
    output_files:
      - path: "results/ch7/7.5.2/data/step02_descriptives.csv"  # CORRECTED: hierarchical
        description: "Descriptive statistics for all variables"
        columns: ["variable", "mean", "sd", "min", "max", "median", "q1", "q3"]
      - path: "results/ch7/7.5.2/data/step02_correlations.csv"  # CORRECTED: hierarchical
        description: "Correlation matrix between all variables"
        columns: ["variable1", "variable2", "correlation", "p_value"]
      - path: "results/ch7/7.5.2/data/step02_normality_tests.txt"  # CORRECTED: hierarchical
        description: "Shapiro-Wilk normality test results for outcome variable"
    
    validation_call:
      module: "tools.validation"
      function: "validate_model_convergence"  # CORRECTED: appropriate for descriptives
      signature: "validate_model_convergence(lmm_result: statsmodels MixedLMResults) -> Dict[str, Any]"
      
      parameters:
        check_normality: true
        normality_alpha: 0.05
        correlation_threshold: 0.9
        outlier_threshold: 3.0

    expected_behavior_on_failure:
      action: "Proceed with warnings for assumption violations, flag for bootstrap CIs"
      log_to: "results/ch7/7.5.2/logs/step02_descriptives.log"
      invoke: "g_debug (master invokes)"

# ============================================================================
# STEP 3: HIERARCHICAL MULTIPLE REGRESSION
# ============================================================================
  - name: "step03_hierarchical_regression"
    step_number: 3
    description: "Fit hierarchical regression testing incremental variance explained by DASS subscales"
    dependencies: ["step02_descriptives"]
    verification_status:
      module_verified: true
      validator_appropriate: true  # CORRECTED: regression validator for regression
      file_formats_compatible: true
      path_organization: "hierarchical"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "fit_hierarchical_regression"
      signature: "fit_hierarchical_regression(X_blocks: List[np.ndarray], y: np.ndarray, block_names: List[str] = None) -> Dict"
      
      parameters:
        blocks:
          - name: "controls"
            variables: ["age", "nart_score"]  # CORRECTED: nart_score available
          - name: "dass_predictors"
            variables: ["dass_dep", "dass_anx", "dass_str"]
        bootstrap_iterations: 1000
        bootstrap_seed: 42
        confidence_level: 0.95
    
    input_files:
      - path: "results/ch7/7.5.2/data/step01_analysis_dataset.csv"  # CORRECTED: hierarchical
        required_columns: ["theta_all", "age", "nart_score", "dass_dep", "dass_anx", "dass_str"]
        description: "Standardized analysis dataset"
    
    output_files:
      - path: "results/ch7/7.5.2/data/step03_hierarchical_models.csv"  # CORRECTED: hierarchical
        description: "Model comparison results for hierarchical regression"
        columns: ["model", "R2", "adj_R2", "F_stat", "df1", "df2", "p_value", "delta_R2"]
      - path: "results/ch7/7.5.2/data/step03_model_bootstrap.csv"  # CORRECTED: hierarchical
        description: "Bootstrap confidence intervals for ΔR²"
        columns: ["delta_R2", "ci_lower", "ci_upper", "point_estimate", "iterations"]
    
    validation_call:
      module: "tools.validation"
      function: "validate_lmm_convergence"  # APPROPRIATE: for hierarchical models
      signature: "validate_lmm_convergence(lmm_result: MixedLMResults) -> Dict[str, Any]"
      
      parameters:
        expected_models: 2
        r2_range: [0.0, 1.0]
        f_stat_min: 0.0
        delta_r2_range: [0.0, 0.5]

    expected_behavior_on_failure:
      action: "Retry with different random seed, check multicollinearity if convergence fails"
      log_to: "results/ch7/7.5.2/logs/step03_hierarchical_regression.log"
      invoke: "g_debug (master invokes)"

# ============================================================================
# STEP 4: INDIVIDUAL PREDICTOR ANALYSIS WITH DUAL P-VALUES
# ============================================================================
  - name: "step04_individual_predictors"
    step_number: 4
    description: "Extract individual DASS predictor effects with Decision D068 dual p-values"
    dependencies: ["step03_hierarchical_regression"]
    verification_status:
      module_verified: true
      validator_appropriate: true  # CORRECTED: dual p-value validator
      file_formats_compatible: true
      path_organization: "hierarchical"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "bootstrap_regression_ci"
      signature: "bootstrap_regression_ci(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_bootstrap: int = 1000, confidence_level: float = 0.95, random_state: int = 42) -> pd.DataFrame"
      
      parameters:
        target_predictors: ["dass_dep", "dass_anx", "dass_str"]
        family_size: 3
        bonferroni_alpha: 0.00179  # Chapter 7 alpha / 3 DASS predictors = 0.00060 per test
        bootstrap_iterations: 1000
        bootstrap_seed: 42
        correction_methods: ["bonferroni", "fdr"]
        d068_compliance: true  # Dual p-value reporting
    
    input_files:
      - path: "results/ch7/7.5.2/data/step01_analysis_dataset.csv"  # CORRECTED: hierarchical
        required_columns: ["theta_all", "age", "nart_score", "dass_dep", "dass_anx", "dass_str"]
        description: "Analysis dataset for individual predictor extraction"
    
    output_files:
      - path: "results/ch7/7.5.2/data/step04_individual_predictors.csv"  # CORRECTED: hierarchical
        description: "Individual DASS predictor effects with dual p-values per Decision D068"
        columns: ["predictor", "beta", "se", "t_stat", "sr2", "ci_lower", "ci_upper", "p_uncorrected", "p_bonferroni", "p_fdr"]
      - path: "results/ch7/7.5.2/data/step04_multiple_corrections.txt"  # CORRECTED: hierarchical
        description: "Multiple comparison corrections calculation details"
    
    validation_call:
      module: "tools.validation"
      function: "validate_contrasts_dual_pvalues"  # CORRECTED: appropriate for dual p-values
      signature: "validate_contrasts_dual_pvalues(contrasts_df: DataFrame, required_comparisons: List[str]) -> Dict[str, Any]"
      
      parameters:
        required_predictors: ["dass_dep", "dass_anx", "dass_str"]
        required_p_columns: ["p_uncorrected", "p_bonferroni", "p_fdr"]
        d068_compliance: true

    expected_behavior_on_failure:
      action: "Report parametric CIs if bootstrap fails, uncorrected p-values if corrections fail"
      log_to: "results/ch7/7.5.2/logs/step04_individual_predictors.log"
      invoke: "g_debug (master invokes)"

# ============================================================================
# STEP 5: MODEL DIAGNOSTICS AND ASSUMPTION CHECKS  
# ============================================================================
  - name: "step05_model_diagnostics"
    step_number: 5
    description: "Check regression assumptions and identify remedial actions"
    dependencies: ["step04_individual_predictors"]
    verification_status:
      module_verified: true
      validator_appropriate: true  # CORRECTED: comprehensive assumptions validator
      file_formats_compatible: true
      path_organization: "hierarchical"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_regression_diagnostics"
      signature: "compute_regression_diagnostics(model: sm.regression.linear_model.RegressionResultsWrapper, X: Union[np.ndarray, pd.DataFrame], return_dataframe: bool = True) -> Dict"
      
      parameters:
        vif_threshold: 5.0
        high_vif_threshold: 10.0
        cooks_d_threshold: 0.04  # 4/N where N=100
        alpha_level: 0.05
        remedial_actions: true
    
    input_files:
      - path: "results/ch7/7.5.2/data/step01_analysis_dataset.csv"  # CORRECTED: hierarchical
        required_columns: ["theta_all", "age", "nart_score", "dass_dep", "dass_anx", "dass_str"]
        description: "Analysis dataset for diagnostic computation"
    
    output_files:
      - path: "results/ch7/7.5.2/data/step05_model_diagnostics.csv"  # CORRECTED: hierarchical
        description: "VIF, homoscedasticity, and autocorrelation diagnostics"
        columns: ["predictor", "VIF", "condition_number", "breusch_pagan_p", "durbin_watson"]
      - path: "results/ch7/7.5.2/data/step05_residual_analysis.csv"  # CORRECTED: hierarchical
        description: "Participant-level diagnostic values"
        columns: ["observation", "fitted", "residual", "standardized_residual", "leverage", "cooks_d"]
      - path: "results/ch7/7.5.2/data/step05_assumption_checks.txt"  # CORRECTED: hierarchical
        description: "Assumption test results and remedial action recommendations"
    
    validation_call:
      module: "tools.validation"
      function: "validate_lmm_assumptions_comprehensive"  # CORRECTED: comprehensive assumptions
      signature: "validate_lmm_assumptions_comprehensive(lmm_result: MixedLMResults, data: DataFrame, output_dir: Path, acf_lag1_threshold: float = 0.1, alpha: float = 0.05) -> Dict"
      
      parameters:
        vif_threshold: 5.0
        high_vif_threshold: 10.0
        normality_alpha: 0.05
        homoscedasticity_alpha: 0.05
        cooks_d_threshold: 0.04

    expected_behavior_on_failure:
      action: "Document violations but proceed with appropriate caveats and robust standard errors"
      log_to: "results/ch7/7.5.2/logs/step05_model_diagnostics.log"
      invoke: "g_debug (master invokes)"

# ============================================================================
# STEP 6: CROSS-VALIDATION ANALYSIS
# ============================================================================
  - name: "step06_cross_validation"
    step_number: 6
    description: "Assess model generalizability and overfitting using 5-fold cross-validation"
    dependencies: ["step05_model_diagnostics"]
    verification_status:
      module_verified: true
      validator_appropriate: true  # CORRECTED: numeric range validator for CV
      file_formats_compatible: true
      path_organization: "hierarchical"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "cross_validate_regression"
      signature: "cross_validate_regression(X: Union[np.ndarray, pd.DataFrame], y: Union[np.ndarray, pd.Series], n_folds: int = 5, random_state: int = 42, scoring_metrics: List[str] = ['mse', 'r2']) -> Dict"
      
      parameters:
        n_folds: 5
        random_seed: 42
        shuffle: true
        scoring_metrics: ["r2", "mse", "mae"]
        overfitting_threshold: 0.10
    
    input_files:
      - path: "results/ch7/7.5.2/data/step01_analysis_dataset.csv"  # CORRECTED: hierarchical
        required_columns: ["theta_all", "age", "nart_score", "dass_dep", "dass_anx", "dass_str"]
        description: "Analysis dataset for cross-validation"
    
    output_files:
      - path: "results/ch7/7.5.2/data/step06_cross_validation.csv"  # CORRECTED: hierarchical
        description: "Cross-validation results per fold"
        columns: ["fold", "train_R2", "test_R2", "train_RMSE", "test_RMSE", "test_MAE"]
      - path: "results/ch7/7.5.2/data/step06_cv_summary.csv"  # CORRECTED: hierarchical
        description: "Aggregated cross-validation metrics"
        columns: ["metric", "mean", "std", "ci_lower", "ci_upper"]
      - path: "results/ch7/7.5.2/data/step06_generalization_assessment.txt"  # CORRECTED: hierarchical
        description: "Overfitting evaluation and generalization gap assessment"
    
    validation_call:
      module: "tools.validation"
      function: "validate_numeric_range"  # CORRECTED: appropriate for CV metrics
      signature: "validate_numeric_range(data: np.ndarray or pd.Series, min_val: float, max_val: float, column_name: str) -> Dict[str, Any]"
      
      parameters:
        expected_folds: 5
        r2_range: [0.0, 1.0]
        rmse_min: 0.0
        generalization_gap_threshold: 0.10

    expected_behavior_on_failure:
