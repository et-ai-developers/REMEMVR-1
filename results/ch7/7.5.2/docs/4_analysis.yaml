        required_columns: ["composite_ID", "theta_all"]
        description: "IRT ability estimates from Ch5 5.1.1"
      - path: "data/dfnonvr.csv"  # v5.3.0: CORRECTED data source
        required_columns: ["UID", "total-dass-depression-items", "total-dass-anxiety-items", "total-dass-stress-items", "age", "nart-score"]
        description: "DASS subscales and demographics from dfnonvr.csv"
    
    output_files:
      - path: "results/ch7/7.5.2/data/step01_analysis_dataset.csv"  # CORRECTED: hierarchical
        description: "Merged analysis dataset with complete cases only"
        columns: ["UID", "theta_all", "dass_dep", "dass_anx", "dass_str", "age", "nart_score"]
      - path: "results/ch7/7.5.2/data/step01_extraction_log.txt"  # CORRECTED: hierarchical
        description: "Data extraction and merging log with sample size documentation"
    
