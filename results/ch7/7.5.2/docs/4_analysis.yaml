# ============================================================================
# STEP 1: EXTRACT AND MERGE DATA  
# ============================================================================
  - name: "step01_extract_merge_data"
    step_number: 1
    description: "Extract theta scores from Ch5 5.1.1 and merge with DASS subscales from dfnonvr.csv"
    dependencies: ["step00_validate_dependencies"]
    verification_status:
      module_verified: true
      validator_appropriate: true
      file_formats_compatible: true
      path_organization: "hierarchical"
      data_source_correct: true  # v5.3.0: dfnonvr.csv only
    
    analysis_call:
      type: "catalogued"
      module: "tools.data"  # CORRECTED from tools.data_extraction  
      function: "load_test_data"
      signature: "load_test_data(path: str = './data/dfdata.csv') -> pd.DataFrame"
      
      parameters:
        # v5.3.0 CRITICAL: Use exact column names from DATA_DICTIONARY.md
        merge_on: "UID"
        join_type: "inner"
        dass_columns: 
          - "total-dass-depression-items"  # EXACT name from dfnonvr.csv
          - "total-dass-anxiety-items"     # EXACT name from dfnonvr.csv
          - "total-dass-stress-items"      # EXACT name from dfnonvr.csv
        control_columns: 
