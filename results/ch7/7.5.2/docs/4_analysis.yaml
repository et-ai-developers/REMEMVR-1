      log_to: "results/ch7/7.5.2/logs/step06_cross_validation.log"
      invoke: "g_debug (master invokes)"

# ============================================================================
# STEP 7: POWER ANALYSIS AND SENSITIVITY ASSESSMENT
# ============================================================================
  - name: "step07_power_analysis"
    step_number: 7
    description: "Post-hoc power analysis and minimum detectable effect sizes"
    dependencies: ["step06_cross_validation"]
    verification_status:
      module_verified: true
      validator_appropriate: true  # CORRECTED: effect sizes validator
      file_formats_compatible: true
      path_organization: "hierarchical"
    
    analysis_call:
      type: "catalogued"
      module: "tools.analysis_regression"
      function: "compute_post_hoc_power"
      signature: "compute_post_hoc_power(n: int, k: int, r2: float, alpha: float = 0.05) -> Dict"
      
      parameters:
        sample_size: 97  # Expected N after exclusions
        n_dass_predictors: 3
        alpha_bonferroni: 0.00060  # 0.00179 / 3 predictors
        alpha_uncorrected: 0.05
        target_power: 0.80
        effect_size_benchmarks: [0.02, 0.15, 0.35]  # Cohen small/medium/large
    
    input_files:
      - path: "results/ch7/7.5.2/data/step03_hierarchical_models.csv"  # CORRECTED: hierarchical
        required_columns: ["model", "R2", "delta_R2"]
        description: "Hierarchical regression results for power analysis"
    
    output_files:
