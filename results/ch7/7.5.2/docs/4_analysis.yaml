      module: "tools.validation"
      function: "validate_data_columns"  # APPROPRIATE: data validation
      signature: "validate_data_columns(df: DataFrame, required_columns: List[str]) -> Dict[str, Any]"
      
      parameters:
        required_columns: ["UID", "theta_all", "dass_dep", "dass_anx", "dass_str", "age", "nart_score"]
        expected_sample_size: [90, 100]  # Allow for some DASS missing data
        theta_range: [-3.0, 3.0]
        dass_range: [0, 21]  # DASS-21 subscale range
        age_range: [18, 85]
        nart_range: [0, 50]   # NART score range

    expected_behavior_on_failure:
      action: "QUIT if N < 80 (insufficient sample), proceed if N 80-90 with warning"
      log_to: "results/ch7/7.5.2/logs/step01_extract_merge_data.log"
      invoke: "g_debug (master invokes)"

# ============================================================================
